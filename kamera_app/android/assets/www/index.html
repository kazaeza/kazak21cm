<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ferment</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', 'Roboto Mono', ui-monospace, monospace;

      --safe-top: 0px;
      --safe-bottom: 0px;

      /* Signature Pastel Palette */
      --ink: #18191C;
      --text-sec: #686662;
      --text-muted: #98938A;

      --cream-bg: #FAF8F1;
      --cream-card: #F3EFE4;
      --cream-warm: #F5E9DC;
      --white: #FFFFFF;

      --coral: #EA7B72;
      --coral-deep: #C45249;
      --apricot: #EE9D68;
      --apricot-deep: #C8713B;
      --sage: #8FB184;
      --sage-deep: #56794C;
      --teal: #3B7D71;
      --teal-deep: #295D53;
      --butter: #F5D547;
      --butter-soft: #FCF6D8;
      --mustard: #EDA944;
      --lavender: #8884E6;
      --lavender-deep: #5B57B8;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--cream-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    input, select, textarea {
      user-select: text;
      font-family: var(--font-sans);
    }

    .app-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--cream-bg);
    }

    .screen-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(114px + var(--safe-bottom));
    }

    body.kb-open .screen-viewport { padding-bottom: 120px; }
    .screen-viewport::-webkit-scrollbar { width: 0; height: 0; }

    /* COMMON CONTROLS */
    .circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(24, 25, 28, 0.08);
      background: var(--white);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.14s var(--ease);
    }
    .circle-btn:active { transform: scale(0.92); }
    .circle-btn.on-pastel {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.28);
      color: var(--white);
    }

    .btn-butter {
      border: none;
      background: var(--butter);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      padding: 13px 18px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 6px 18px rgba(245, 213, 71, 0.34);
      transition: transform 0.14s var(--ease);
    }
    .btn-butter:active { transform: scale(0.96); }

    .btn-ink {
      border: none;
      background: var(--ink);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      padding: 13px 18px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.14s var(--ease);
    }
    .btn-ink:active { transform: scale(0.96); }

    .btn-soft {
      border: 1.5px solid rgba(24, 25, 28, 0.12);
      background: var(--white);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      padding: 11px 16px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-soft:active { transform: scale(0.96); }

    /* =====================================================================
       HOME SCREEN
       ===================================================================== */
    .home-header {
      padding: calc(14px + var(--safe-top)) 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .avatar-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--butter);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 2.5px solid var(--white);
      box-shadow: 0 5px 14px rgba(24, 25, 28, 0.08);
      flex-shrink: 0;
    }

    .heute-split {
      margin: 4px 18px 14px;
      background: var(--white);
      border-radius: 26px;
      display: grid;
      grid-template-columns: 1fr 112px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(24, 25, 28, 0.05);
    }

    .heute-left {
      padding: 15px 14px 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .heute-right {
      background: var(--butter);
      padding: 14px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .heute-right:active { filter: brightness(0.95); }

    .quick-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 0;
      font-size: 12px;
      cursor: pointer;
    }

    .quick-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid rgba(24, 25, 28, 0.13);
      background: var(--cream-bg);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }
    .quick-pill.urgent {
      background: #E4F2E1;
      border-color: #8FB184;
      color: #3E6634;
    }

    .zone-strip {
      padding: 0 18px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 13px;
    }
    .zone-strip::-webkit-scrollbar { display: none; }

    .zone-chip {
      border: none;
      background: var(--white);
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 99px;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.16s var(--ease);
    }
    .zone-chip.active {
      background: var(--ink);
      color: var(--white);
    }

    .section-row {
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .pastel-grid {
      padding: 0 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .pastel-card {
      border-radius: 26px;
      padding: 12px 13px 14px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(24, 25, 28, 0.08);
      transition: transform 0.15s var(--ease);
    }
    .pastel-card:active { transform: scale(0.97); }

    .card-ring-mini {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 800;
      font-family: var(--font-mono);
    }

    .card-art-slot {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =====================================================================
       DETAIL SCREEN — SAFE TIMELINE INSPECTOR + EXPLICIT STAGE TRANSFER
       ===================================================================== */
    .detail-hero {
      padding: calc(12px + var(--safe-top)) 18px 26px;
      color: var(--white);
      min-height: 256px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.35s var(--ease);
    }

    .detail-sheet {
      background: var(--white);
      border-radius: 30px 30px 0 0;
      margin-top: -18px;
      position: relative;
      z-index: 3;
      padding: 16px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Live current-status strip above tabs */
    .live-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 16px;
      background: var(--cream-bg);
      font-size: 12px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Read-only browse tabs (tapping NEVER mutates the piece!) */
    .inspect-tabs-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: var(--cream-card);
      padding: 4px;
      border-radius: 99px;
    }
    .inspect-tabs-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--cream-card);
      padding: 4px;
      border-radius: 99px;
    }

    .inspect-tab {
      border: none;
      background: transparent;
      color: var(--text-sec);
      font-size: 11.5px;
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.16s var(--ease);
      white-space: nowrap;
    }
    .inspect-tab.viewing {
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 3px 10px rgba(24, 25, 28, 0.18);
    }

    /* Modal phase picker */
    .stage-bar-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--cream-bg);
      padding: 5px;
      border-radius: 99px;
    }
    .phase-btn {
      border: none;
      background: transparent;
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 700;
      padding: 9px 4px;
      border-radius: 99px;
      cursor: pointer;
      white-space: nowrap;
    }
    .phase-btn.active {
      background: var(--butter);
      color: var(--ink);
      font-weight: 800;
    }

    /* Drying sub-method chips */
    .sub-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .sub-chip {
      border: 1.5px solid rgba(24, 25, 28, 0.13);
      background: var(--white);
      color: var(--text-sec);
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 99px;
      cursor: pointer;
    }
    .sub-chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--white);
    }

    /* LOCKED VACUUM / CURE CARD */
    .vacuum-locked-card {
      border-radius: 26px;
      padding: 18px 16px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 28px rgba(24, 25, 28, 0.12);
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.18);
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .vac-progress-track {
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
    }
    .vac-progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--butter);
      transition: width 0.35s var(--ease);
    }

    /* Calm Read-Only Preview Card when browsing another tab */
    .inspect-preview-card {
      border-radius: 24px;
      background: var(--cream-bg);
      border: 1.5px solid rgba(24, 25, 28, 0.08);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    /* Explicit transfer action bar on live fermentation card */
    .transfer-actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .transfer-btn {
      border: 1.5px solid rgba(24, 25, 28, 0.12);
      background: var(--cream-bg);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      padding: 12px 10px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.14s var(--ease);
    }
    .transfer-btn:active { transform: scale(0.96); }
    .transfer-btn.archive-go {
      background: #E4F2E1;
      border-color: #8FB184;
      color: #2E5225;
    }

    /* LAYERED MUSTARD + TEAL ARC DIAL */
    .arc-dial-card {
      border-radius: 28px;
      background: var(--mustard);
      overflow: hidden;
      padding-top: 12px;
      color: var(--white);
      box-shadow: 0 12px 28px rgba(59, 125, 113, 0.18);
    }

    .arc-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px 10px;
    }

    .arc-chip-btn {
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 99px;
      cursor: pointer;
    }

    .arc-teal-body {
      background: var(--teal);
      border-radius: 50% 50% 0 0 / 38px 38px 0 0;
      padding: 14px 14px 18px;
      text-align: center;
    }

    .weight-inline-input {
      width: 118px;
      background: rgba(255, 255, 255, 0.16);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 14px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 23px;
      font-weight: 800;
      text-align: center;
      padding: 5px 8px;
      outline: none;
    }
    .weight-inline-input:focus {
      background: rgba(255, 255, 255, 0.26);
      border-color: var(--butter);
    }

    .arc-steppers {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 12px;
    }

    .teal-step-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .teal-step-btn:active { background: rgba(255, 255, 255, 0.34); }

    .teal-save-btn {
      height: 44px;
      padding: 0 17px;
      border-radius: 99px;
      border: 3.5px solid rgba(255, 255, 255, 0.25);
      background: var(--cream-bg);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }
    .teal-save-btn:active { transform: scale(0.96); }

    /* TASTING VERDICT CARD */
    .tasting-card {
      border-radius: 24px;
      background: var(--cream-bg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .verdict-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .verdict-chip {
      border: 1.5px solid rgba(24, 25, 28, 0.12);
      background: var(--white);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 99px;
      cursor: pointer;
    }
    .verdict-chip.selected {
      background: var(--butter);
      border-color: var(--ink);
    }

    /* INTEGRATED ANALYTICS SECTION */
    .capsules-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .stat-cap {
      background: var(--cream-bg);
      border-radius: 24px;
      padding: 11px 6px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-cap-num {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-family: var(--font-mono);
    }

    .stat-cap-lbl {
      font-size: 10.5px;
      color: var(--text-sec);
      font-weight: 600;
      margin-top: 2px;
    }

    .wave-card {
      background: var(--cream-bg);
      border-radius: 24px;
      padding: 14px 13px 12px;
    }

    .journal-list {
      display: flex;
      flex-direction: column;
    }
    .journal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(24, 25, 28, 0.06);
      font-size: 12.5px;
    }
    .journal-item:last-child { border-bottom: none; }

    /* =====================================================================
       ARCHIVE & PLANS SCREEN
       ===================================================================== */
    .archive-wrap {
      padding: calc(14px + var(--safe-top)) 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .seg-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      background: var(--cream-card);
      padding: 4px;
      border-radius: 99px;
    }
    .seg-opt {
      border: none;
      background: transparent;
      color: var(--text-sec);
      font-size: 12.5px;
      font-weight: 700;
      padding: 9px 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }
    .seg-opt.active {
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 3px 10px rgba(24, 25, 28, 0.16);
    }

    .archive-card {
      background: var(--white);
      border-radius: 24px;
      padding: 15px 16px;
      box-shadow: 0 8px 24px rgba(24, 25, 28, 0.045);
      display: flex;
      flex-direction: column;
      gap: 9px;
      cursor: pointer;
    }
    .archive-card:active { transform: scale(0.985); }

    .plan-card {
      background: var(--white);
      border-radius: 24px;
      padding: 15px 16px;
      box-shadow: 0 8px 24px rgba(24, 25, 28, 0.045);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* FLOATING 3-ITEM BOTTOM DOCK */
    .bottom-dock {
      position: fixed;
      bottom: calc(14px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 248px;
      height: 60px;
      background: var(--ink);
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      box-shadow: 0 14px 32px rgba(24, 25, 28, 0.28);
      z-index: 40;
      transition: transform 0.2s var(--ease), opacity 0.2s;
    }

    body.kb-open .bottom-dock {
      transform: translate(-50%, 100px);
      opacity: 0;
      pointer-events: none;
    }

    .dock-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.54);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }
    .dock-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
    }

    .dock-fab {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--butter);
      color: var(--ink);
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 213, 71, 0.42);
    }
    .dock-fab:active { transform: scale(0.92); }

    /* FLOATING KEYBOARD DISMISS BUTTON */
    .kb-dismiss-bar {
      position: fixed;
      right: 14px;
      bottom: 10px;
      z-index: 300;
      display: none;
    }
    body.kb-open .kb-dismiss-bar { display: flex; }
    .kb-dismiss-btn {
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      background: var(--ink);
      color: var(--white);
      font-size: 12.5px;
      font-weight: 800;
      padding: 9px 16px;
      border-radius: 99px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* MODAL SHEETS */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 25, 28, 0.5);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 120;
    }
    .sheet-backdrop.open { display: flex; }

    .sheet-panel {
      width: 100%;
      max-width: 500px;
      max-height: 92%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--cream-bg);

    // 1. NATIVE BRIDGE, KEYBOARD & BACK SWIPE SYNC
    // =========================================================================
    const hasAndroid = typeof window.AndroidBridge !== 'undefined';
    let currentImeDp = 0;

    function syncAndroidBackState() {
      if (!hasAndroid || !window.AndroidBridge.setCanGoBack) return;
      const modalOpen = document.getElementById('batch-modal').classList.contains('open')
        || document.getElementById('settings-modal').classList.contains('open');
      const canGoBack = ui.screen !== 'home' || modalOpen || currentImeDp > 40 || isTextFieldFocused();
      try { window.AndroidBridge.setCanGoBack(!!canGoBack); } catch (e) {}
    }

    window.__setAndroidInsets = function(topDp, bottomDp, imeDp) {
      document.documentElement.style.setProperty('--safe-top', Math.max(0, topDp || 0) + 'px');
      document.documentElement.style.setProperty('--safe-bottom', Math.max(0, bottomDp || 0) + 'px');
      currentImeDp = imeDp || 0;
      const isKb = currentImeDp > 40 || isTextFieldFocused();
      document.body.classList.toggle('kb-open', isKb);
      if (currentImeDp > 40) scrollActiveInputIntoView();
      syncAndroidBackState();
    };

    function isTextFieldFocused() {
      const el = document.activeElement;
      return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
    }

    function scrollActiveInputIntoView() {
      const el = document.activeElement;
      if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
      setTimeout(() => {
        try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
      }, 220);
    }

    function dismissKeyboard() {
      const el = document.activeElement;
      if (el && typeof el.blur === 'function') el.blur();
      document.body.classList.remove('kb-open');
      if (hasAndroid && window.AndroidBridge.hideKeyboard) {
        try { window.AndroidBridge.hideKeyboard(); } catch (e) {}
      }
      syncAndroidBackState();
    }

    document.addEventListener('focusin', (ev) => {
      const tag = ev.target && ev.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        document.body.classList.add('kb-open');
        scrollActiveInputIntoView();
        syncAndroidBackState();
      }
    });
    document.addEventListener('focusout', () => {
      setTimeout(() => {
        if (!isTextFieldFocused() && currentImeDp <= 40) {
          document.body.classList.remove('kb-open');
          syncAndroidBackState();
        }
      }, 140);
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && isTextFieldFocused()) {
        ev.preventDefault();
        dismissKeyboard();
      }
    });
    document.addEventListener('click', (ev) => {
      if (!isTextFieldFocused()) return;
      if (!ev.target.closest('input, textarea, select, button, .kb-dismiss-btn')) dismissKeyboard();

      if (hasAndroid && window.AndroidBridge.haptic) {

    }

    let store = null;

    function loadStore() {
      let raw = '';
      if (hasAndroid && window.AndroidBridge.loadState) {
        try { raw = window.AndroidBridge.loadState(); } catch (e) {}
      }
      if (!raw) {
        try { raw = localStorage.getItem('kamera_store_v1') || ''; } catch (e) {}
      }
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.schemaVersion === 3 && Array.isArray(parsed.batches)) {
            store = parsed;
            if (!store.plans) store.plans = [];
            return;
          }
        } catch (e) {}
      }
      store = createSousChefSeed();
      persistStore();
    }

    function persistStore() {
      const json = JSON.stringify(store);
      try { localStorage.setItem('kamera_store_v1', json); } catch (e) {}
      if (hasAndroid && window.AndroidBridge.saveState) {
        try { window.AndroidBridge.saveState(json); } catch (e) {}
      }
    }

    // =========================================================================
    // 4. FICK'S LAW FERMENTATION / DRYING ENGINE
    // =========================================================================
    function getCut(cutId) { return MEAT_CATALOG[cutId] || MEAT_CATALOG.pork_coppa; }

    function getPhaseColor(batch, phaseOverride) {
      const ph = phaseOverride || batch.phase;
      if (ph === 'dry') return (DRY_METHODS[batch.dryMethod] || DRY_METHODS.casing).hex;
      return (PHASES[ph] || PHASES.dry).hex;
    }

    function getPhaseShortLabel(batch) {
      if (batch.phase === 'dry') {
        const m = (DRY_METHODS[batch.dryMethod] || DRY_METHODS.casing).label;
        return batch.smoked ? `${m} · 💨` : m;
      }
      return (PHASES[batch.phase] || PHASES.dry).tab;
    }

    function analyze(batch) {
      const today = daysAgoISO(0);

      if (batch.category === 'pepper') {
        const elapsed = diffDays(batch.createdAt, today);
        const targetDays = batch.targetDays || 21;
        const remDays = Math.max(0, targetDays - elapsed);
        const readinessPct = batch.phase === 'done' ? 100 : Math.min(100, Math.round((elapsed / targetDays) * 100));
        const totalMass = batch.initialWeight + (batch.brineWater || 0);
        const saltGrams = ((totalMass * (batch.saltPct || 2.8)) / 100).toFixed(1);
        const etaBadge = batch.phase === 'done' || remDays === 0 ? 'Готово!' : (batch.puffed ? 'CO₂!' : `~${remDays} дн`);
        return {
          isPepper: true,
          W0: batch.initialWeight, Wcur: batch.initialWeight, targetWeight: batch.initialWeight,
          lostGrams: 0, lossPct: 0, readinessPct, remDays,
          etaBadge, etaSort: batch.puffed ? 0 : remDays,
          elapsedDays: elapsed, curPhaseDays: elapsed,
          cureDays: 0, dryDays: 0, vacDays: batch.phase === 'ferm_vac' ? elapsed : 0,
          saltGrams, k_eff: 0.04, speedPctDay: 0, crustRisk: false
        };
      }

      const cut = getCut(batch.cutId);
      const useHang = store.settings.lossBase === 'hang' && batch.hangWeight;
      const W0 = useHang ? batch.hangWeight : batch.initialWeight;
      const lastLog = batch.weightLogs[batch.weightLogs.length - 1] || { date: batch.createdAt, weight: batch.initialWeight };
      const Wcur = lastLog.weight;
      const targetLoss = batch.targetLossPct || cut.optLoss;
      const targetWeight = Math.round(W0 * (1 - targetLoss / 100));
      const lostGrams = Math.max(0, W0 - Wcur);
      const lossPct = Math.max(0, ((W0 - Wcur) / W0) * 100);
      const readinessPct = batch.phase === 'done'
        ? Math.max(100, Math.round((lossPct / targetLoss) * 100))
        : Math.min(100, Math.max(0, Math.round((lossPct / targetLoss) * 100)));

      const estDiam = Math.max(32, Math.min(130, cut.refDiam * Math.pow(Math.max(200, W0) / cut.refWeight, 1 / 3)));
      const W_inf = 0.44 * W0;
      const methodF = (DRY_METHODS[batch.dryMethod] || DRY_METHODS.casing).factor;
      const loc = LOCATIONS[batch.locId] || LOCATIONS.fridge_12;
      const dryTemp = batch.phase === 'dry' ? loc.temp : 12;
      const k_prior = 0.034 * cut.factor * methodF * Math.pow(75 / estDiam, 1.42) * (0.68 + 0.32 * (dryTemp / 12));

      let cureDays = 0, dryDays = 0, vacDays = 0;
      for (const h of batch.phaseHistory) {
        const d = diffDays(h.startDate, h.endDate || today);
        if (h.phase === 'cure') cureDays += d;
        else if (h.phase === 'dry') dryDays += d;
        else if (h.phase === 'vacuum') vacDays += d;
      }

      const curH = batch.phaseHistory[batch.phaseHistory.length - 1];
      const curPhaseDays = curH ? diffDays(curH.startDate, today) : 0;

      let k_emp = null;
      if (dryDays >= 3 && Wcur < W0 && Wcur > W_inf + 10) {
        const ratio = (Wcur - W_inf) / (W0 - W_inf);
        if (ratio > 0.05 && ratio < 0.99) k_emp = -Math.log(ratio) / dryDays;
      }
      const empTrust = Math.min(0.85, dryDays / 14);
      const k_eff = k_emp !== null ? (k_emp * empTrust + k_prior * (1 - empTrust)) : k_prior;

      let remDryingDays = 0;
      if (Wcur > targetWeight && Wcur > W_inf + 5 && targetWeight > W_inf) {
        const rNeed = (targetWeight - W_inf) / (Wcur - W_inf);
        if (rNeed > 0 && rNeed < 1) remDryingDays = Math.ceil(-Math.log(rNeed) / Math.max(0.004, k_eff));
      }

      const recCure = cut.cureDays || 12;
      const cureLeft = Math.max(0, recCure - cureDays);
      const curePct = Math.min(100, Math.round((cureDays / Math.max(1, recCure)) * 100));

      let etaBadge = '';
      let etaSort = remDryingDays;
      if (batch.phase === 'done') {
        etaBadge = 'В архиве';
        etaSort = 999;
      } else if (batch.phase === 'cure') {
        etaBadge = cureLeft === 0 ? 'В ферм-камеру!' : `посол ~${cureLeft}д`;
        etaSort = cureLeft;
      } else if (batch.phase === 'vacuum') {
        etaBadge = curPhaseDays >= 5 ? 'Достать?' : `вак · ${curPhaseDays}д`;
        etaSort = curPhaseDays >= 5 ? 1 : Math.max(2, remDryingDays);
      } else {
        etaBadge = Wcur <= targetWeight ? 'Готово!' : `~${remDryingDays} дн`;
        etaSort = Wcur <= targetWeight ? 0 : remDryingDays;
      }

      let speedPctDay = 0;
      if (batch.weightLogs.length >= 2) {
        const prev = batch.weightLogs[batch.weightLogs.length - 2];
        const dt = Math.max(1, diffDays(prev.date, lastLog.date));
        speedPctDay = Math.max(0, (((prev.weight - lastLog.weight) / W0) * 100) / dt);
      }
      const crustRisk = batch.phase === 'dry' && batch.dryMethod === 'naked' && estDiam >= 70 && speedPctDay >= 1.7;

      return {
        isPepper: false,
        cut, W0, Wcur, targetWeight, lostGrams, lossPct, readinessPct,
        remDays: remDryingDays, cureLeft, recCure, curePct,
        etaBadge, etaSort,
        elapsedDays: diffDays(batch.createdAt, today),
        curPhaseDays, cureDays, dryDays, vacDays,
        k_eff, speedPctDay, crustRisk
      };
    }

    // =========================================================================
    // 6. NAVIGATION & RENDERING
    // =========================================================================
    function getSelectedBatch() {
      if (!store.batches.length) return null;
      return store.batches.find(b => b.id === ui.selectedId) || store.batches[0];
    }

    function navigate(screen, batchId) {
      dismissKeyboard();
      if (screen === 'detail' && ui.screen !== 'detail') {
        ui.prevScreen = ui.screen;
      }
      if (batchId) {
        ui.selectedId = batchId;
        const target = store.batches.find(x => x.id === batchId);
        ui.inspectPhase = target ? target.phase : null;
        ui.draftWeight = null;
        ui.weighDateMode = 'today';
        ui.transferPickerFor = null;
      }
      ui.screen = screen;
      haptic('light');
      render();
      document.getElementById('viewport').scrollTop = 0;
    }

    window.handleAndroidBack = function() {
      if (isTextFieldFocused() || currentImeDp > 40) { dismissKeyboard(); return true; }
      if (document.getElementById('batch-modal').classList.contains('open')) { closeBatchModal(); return true; }
      if (document.getElementById('settings-modal').classList.contains('open')) { closeSettings(); return true; }
      if (ui.screen === 'detail') {
        const b = getSelectedBatch();
        const dest = (b && b.phase === 'done') ? 'archive' : (ui.prevScreen === 'archive' ? 'archive' : 'home');
        navigate(dest);
        return true;
      }
      if (ui.screen !== 'home') {
        navigate('home');
        return true;
      }
      return false;
    };

    function render() {
      document.getElementById('dock-home').classList.toggle('active', ui.screen === 'home' || (ui.screen === 'detail' && ui.prevScreen !== 'archive'));
      document.getElementById('dock-archive').classList.toggle('active', ui.screen === 'archive' || (ui.screen === 'detail' && ui.prevScreen === 'archive'));

      const vp = document.getElementById('viewport');
      if (ui.screen === 'home') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildHomeScreen();
      } else if (ui.screen === 'detail') {
        const b = getSelectedBatch();
        setStatusBar(b ? getPhaseColor(b) : '#EE9D68', false);
        vp.innerHTML = buildDetailScreen(b);
      } else if (ui.screen === 'archive') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildArchiveScreen();
      }
      syncAndroidBackState();
    }

                    <span style="font-size:11.5px;color:var(--text-sec);font-weight:600;margin-left:6px;">

    function buildSplineSVG(batch, an) {
      const W = 300, H = 118, padX = 14, padTop = 30, padBot = 14;
      const plotW = W - padX * 2, plotH = H - padTop - padBot;

      const logs = batch.weightLogs;
      const startD = batch.createdAt;
      const lastD = logs[logs.length - 1].date;
      const elapsed = Math.max(1, diffDays(startD, lastD));
      const span = Math.max(elapsed + Math.min(35, an.remDays), 10);

      const pts = logs.map(l => {
        const d = diffDays(startD, l.date);
        const loss = Math.max(0, ((an.W0 - l.weight) / an.W0) * 100);
        const pct = Math.min(105, (loss / Math.max(1, batch.targetLossPct)) * 100);
        return { x: padX + (d / span) * plotW, y: padTop + plotH * (1 - pct / 105) };
      });

      const lastPt = pts[pts.length - 1];
      let dPath = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i], p1 = pts[i + 1];
        const cx = ((p0.x + p1.x) / 2).toFixed(1);
        dPath += ` C ${cx} ${p0.y.toFixed(1)}, ${cx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
      }
      const areaD = pts.length >= 2
        ? `${dPath} L ${lastPt.x.toFixed(1)} ${H - padBot} L ${pts[0].x.toFixed(1)} ${H - padBot} Z`
        : '';

      const showProj = batch.phase !== 'done' && an.remDays > 0 && an.Wcur > an.targetWeight;
      const projX = W - padX, projY = padTop + 4;
      const projD = showProj
        ? `M ${lastPt.x.toFixed(1)} ${lastPt.y.toFixed(1)} Q ${((lastPt.x + projX) / 2).toFixed(1)} ${(lastPt.y - 8).toFixed(1)} ${projX} ${projY}`
        : '';

      const bx = Math.min(W - 34, Math.max(34, lastPt.x));
      const by = Math.max(25, lastPt.y);

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" fill="none">
          <defs>
            <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#D96B68" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#D96B68" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <line x1="${padX}" y1="${padTop + 4}" x2="${W - padX}" y2="${padTop + 4}" stroke="rgba(86,121,76,0.3)" stroke-dasharray="4 4"/>
          ${areaD ? `<path d="${areaD}" fill="url(#wg)"/>` : ''}
          ${projD ? `<path d="${projD}" stroke="#8FB184" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>` : ''}
          <path d="${dPath}" stroke="#C86464" stroke-width="2.6" stroke-linecap="round"/>
          ${showProj ? `<circle cx="${projX}" cy="${projY}" r="4" fill="#8FB184"/>` : ''}
          <circle cx="${lastPt.x.toFixed(1)}" cy="${lastPt.y.toFixed(1)}" r="5" fill="#18191C" stroke="#FFFFFF" stroke-width="2"/>
          <rect x="${(bx - 28).toFixed(1)}" y="${(by - 28).toFixed(1)}" width="56" height="20" rx="10" fill="#18191C"/>
          <text x="${bx.toFixed(1)}" y="${(by - 14.5).toFixed(1)}" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800">−${an.lossPct.toFixed(1)}%</text>
        </svg>
      `;
    }

    // --- SCREEN 3: ARCHIVE & PLANS ---
    function buildArchiveScreen() {
      const doneBatches = store.batches.filter(b => b.phase === 'done');

      return `
        <div class="archive-wrap">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h2 style="font-size:24px;font-weight:800;letter-spacing:-0.02em;">Архив и планы</h2>

            </div>
            <button class="circle-btn" onclick="openSettings()">⚙️</button>
          </div>

          <div class="seg-toggle">
            <button class="seg-opt ${ui.archiveTab === 'done' ? 'active' : ''}" onclick="setArchiveTab('done')">Дегустации (${doneBatches.length})</button>
            <button class="seg-opt ${ui.archiveTab === 'plans' ? 'active' : ''}" onclick="setArchiveTab('plans')">Планы (${store.plans.length})</button>
          </div>

          ${ui.archiveTab === 'done' ? (
            doneBatches.length ? doneBatches.map(b => {
              const an = analyze(b);
              return `
                <div class="archive-card" onclick="navigate('detail', '${b.id}')">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                    <div>
                      <div style="font-size:16px;font-weight:800;">${b.title}</div>
                      <div style="font-size:11.5px;color:var(--text-sec);margin-top:2px;">
                        ${formatShortDate(b.createdAt)} · ${(DRY_METHODS[b.dryMethod] || DRY_METHODS.casing).label}${b.smoked ? ' · 💨' : ''}
                      </div>
                    </div>
                    ${b.verdict ? `<span style="font-size:11.5px;font-weight:800;background:var(--butter-soft);padding:5px 10px;border-radius:99px;white-space:nowrap;">${b.verdict}</span>` : ''}
                  </div>

                  <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-family:var(--font-mono);font-weight:700;background:var(--cream-bg);padding:9px 12px;border-radius:14px;">
                    <span>${an.Wcur !== an.W0 ? `${an.W0}г → ${an.Wcur}г` : `Старт ${an.W0}г`}</span>
                    ${an.lossPct > 0.4 ? `<span style="color:var(--coral-deep);">−${an.lossPct.toFixed(0)}%</span>` : ''}
                    <span style="color:var(--text-sec);margin-left:auto;">П:${an.cureDays}д · Ф:${an.dryDays}д${an.vacDays ? ` · В:${an.vacDays}д` : ''}</span>
                  </div>

                  ${b.tastingNote || b.notes ? `
                    <div style="font-size:12.5px;color:var(--text-sec);line-height:1.4;">${b.tastingNote || b.notes}</div>
                  ` : ''}
                </div>
              `;
            }).join('') : `
              <div style="background:var(--white);border-radius:24px;padding:28px 18px;text-align:center;color:var(--text-sec);">
                Пока нет завершённых партий. Когда нажмёшь «✓ Готово → в Архив» в карточке куска, он переедет сюда.
              </div>
            `
          ) : `
            ${store.plans.map(p => `
              <div class="plan-card">
                <div style="min-width:0;">
                  <div style="font-size:15.5px;font-weight:800;">${p.title}</div>
                  <div style="font-size:12px;color:var(--text-sec);margin-top:3px;">${p.note || ''}</div>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0;">
                  <button class="btn-butter" style="padding:9px 14px;font-size:12px;" onclick="launchPlan('${p.id}')">▶ Запустить</button>
                  <button class="circle-btn" style="width:34px;height:34px;font-size:12px;" onclick="deletePlan('${p.id}')">✕</button>
                </div>
              </div>
            `).join('')}

            <button class="btn-soft" style="width:100%;" onclick="addPlanIdea()">＋ Добавить идею в планы</button>
          `}
        </div>
      `;
    }

    // =========================================================================
    // 7. INTERACTIVE HANDLERS
    // =========================================================================
    function setZoneFilter(z) { ui.zoneFilter = z; haptic('light'); render(); }
    function setArchiveTab(t) { ui.archiveTab = t; haptic('light'); render(); }
    function toggleWeighDate() { ui.weighDateMode = ui.weighDateMode === 'today' ? 'yesterday' : 'today'; haptic('light'); render(); }
    function toggleMetricMode() { ui.metricMode = ui.metricMode === 'readiness' ? 'loss' : 'readiness'; haptic('light'); render(); }

    // READ-ONLY TAB SWITCHING (Just inspect, never moves the batch!)
    function inspectStage(phaseId) {
      ui.inspectPhase = phaseId;
      ui.transferPickerFor = null;
      haptic('light');
      render();
    }

    function openTransferPicker(kind) {
      ui.transferPickerFor = ui.transferPickerFor === kind ? null : kind;
      haptic('light');
      render();
    }

    // EXPLICIT TRANSFER TO ANOTHER SECTION
    function moveBatchToPhase(batchId, newPhase) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b || b.phase === newPhase) return;
      const today = daysAgoISO(0);
      const curH = b.phaseHistory[b.phaseHistory.length - 1];
      if (curH && !curH.endDate) curH.endDate = today;

      b.phase = newPhase;
      const pObj = PHASES[newPhase] || PHASES.dry;
      b.locId = (newPhase === 'dry' && b.dryMethod === 'membrane') ? 'fridge_3' : pObj.defLoc;
      if (newPhase === 'dry' && b.weightLogs.length) {
        b.hangWeight = b.weightLogs[b.weightLogs.length - 1].weight;
      }
      b.phaseHistory.push({ phase: newPhase, startDate: today, endDate: null });
      ui.inspectPhase = newPhase;
      ui.transferPickerFor = null;
      ui.draftWeight = null;
      persistStore();
      haptic('success');
      showToast(newPhase === 'done' ? 'Готово! Перенесено в Архив' : `Перенесено: ${pObj.full}`);
      render();
    }

    function transferToFerment(batchId, methodId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.dryMethod = methodId;
      moveBatchToPhase(batchId, 'dry');
      if (methodId === 'membrane') {
        b.locId = 'fridge_3';
        persistStore();
        render();
      }
    }

    function setDryMethod(batchId, mId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.dryMethod = mId;
      if (mId === 'membrane') b.locId = 'fridge_3';
      else if (b.locId === 'fridge_3') b.locId = 'fridge_12';
      persistStore();
      haptic('light');
      render();
    }

    function toggleSmoked(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.smoked = !b.smoked;
      persistStore();
      haptic('light');
      showToast(b.smoked ? 'Отмечено: подкопчено 💨' : 'Снята отметка копчения');
      render();
    }

    function flipLocation(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      if (b.category === 'pepper') {
        b.locId = b.locId === 'room_22' ? 'fridge_12' : (b.locId === 'fridge_12' ? 'fridge_3' : 'room_22');
      } else {
        b.locId = b.locId === 'fridge_3' ? 'fridge_12' : 'fridge_3';
      }
      persistStore();
      haptic('light');
      showToast(LOCATIONS[b.locId].label);
      render();
    }

    function onArcWeightInput(val) {
      const n = parseInt(val, 10);
      if (isNaN(n)) return;
      ui.draftWeight = n;
      const b = getSelectedBatch();
      if (!b) return;
      const an = analyze(b);
      const loss = Math.max(0, ((an.W0 - n) / an.W0) * 100).toFixed(1);
      const badge = document.getElementById('arc-loss-badge');
      if (badge) badge.textContent = `-${loss}%`;
    }

    function stepDraftWeight(delta) {
      const b = getSelectedBatch();
      if (!b) return;
      ui.draftWeight = Math.max(20, (ui.draftWeight || b.initialWeight) + delta);
      haptic('light');
      const inp = document.getElementById('arc-weight-input');
      if (inp) { inp.value = ui.draftWeight; onArcWeightInput(ui.draftWeight); }
      else render();
    }

    function commitWeighIn(batchId) {
      dismissKeyboard();
      const b = store.batches.find(x => x.id === batchId);
      if (!b || b.phase !== 'dry') return;
      const val = parseInt(ui.draftWeight, 10);
      if (isNaN(val) || val < 20) return;

      const d = ui.weighDateMode === 'yesterday' ? daysAgoISO(1) : daysAgoISO(0);
      b.weightLogs.push({ date: d, weight: val, phase: 'dry', note: '' });
      b.weightLogs.sort((a, c) => a.date.localeCompare(c.date));
      ui.draftWeight = null;
      ui.weighDateMode = 'today';
      persistStore();
      haptic('success');
      showToast(`Записано: ${val} г`);
      render();
    }

    function deleteLog(batchId, idx) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b || b.weightLogs.length <= 1) return;
      b.weightLogs.splice(idx, 1);
      ui.draftWeight = null;
      persistStore();
      haptic('light');
      showToast('Замер удалён');
      render();
    }

    function setVerdict(batchId, v) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.verdict = b.verdict === v ? '' : v;
      persistStore();
      haptic('light');
      render();
    }

    function saveTastingNote(batchId, txt) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.tastingNote = txt.trim();
      persistStore();
      showToast('Вывод сохранён');
    }

    function togglePepperGas(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.puffed = !b.puffed;
      if (!b.puffed) b.degasCount = (b.degasCount || 0) + 1;
      persistStore();
      haptic('success');
      showToast(b.puffed ? 'Отмечено вздутие CO₂' : 'CO₂ стравлен!');
      render();
    }

    function promptPepperPh(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      const v = prompt('Введи текущий pH перцев (напр. 3.6):', String(b.phValue || 3.8));
      const n = parseFloat((v || '').replace(',', '.'));
      if (!isNaN(n) && n > 1 && n < 9) {
        b.phValue = Math.round(n * 10) / 10;
        persistStore();
        render();
      }
    }

    // Plans
    function addPlanIdea() {
      const t = prompt('Что планируешь заложить?', 'Вяленая говядина (бастурма)');
      if (!t || !t.trim()) return;
      store.plans.unshift({ id: 'plan-' + Date.now(), title: t.trim(), category: 'meat', cutId: 'beef_bresaola', estWeight: 1000, note: 'Идея из планов' });
      persistStore();
      haptic('light');
      render();
    }

    function deletePlan(id) {
      store.plans = store.plans.filter(p => p.id !== id);
      persistStore();
      render();
    }

    function launchPlan(id) {
      const p = store.plans.find(x => x.id === id);
      if (!p) return;
      openBatchModal({ category: p.category || 'meat', existing: false, presetCut: p.cutId, presetTitle: p.title, presetWeight: p.estWeight, fromPlanId: id });
    }

    // Settings
    function openSettings() {
      document.getElementById('loss-base-btn').textContent = store.settings.lossBase === 'raw' ? 'От сырого' : 'От навески';
      document.getElementById('settings-modal').classList.add('open');
      haptic('light');
      syncAndroidBackState();
    }
    function closeSettings() {
      document.getElementById('settings-modal').classList.remove('open');
      syncAndroidBackState();
    }
    function toggleLossBase() {
      store.settings.lossBase = store.settings.lossBase === 'raw' ? 'hang' : 'raw';
      document.getElementById('loss-base-btn').textContent = store.settings.lossBase === 'raw' ? 'От сырого' : 'От навески';
      persistStore();
      haptic('light');
      render();
    }
    function exportBackup() {
      const txt = JSON.stringify(store, null, 2);
      if (hasAndroid && window.AndroidBridge.shareText) window.AndroidBridge.shareText('Бэкап ferment', txt);
      else showToast('Бэкап готов');
    }
    function reimportSousChef() {
      if (!confirm('Восстановить исходные партии из архива «Су Шеф»?')) return;
      store = createSousChefSeed();
      ui.selectedId = store.batches[0].id;
      persistStore();
      closeSettings();
      showToast('Архив «Су Шеф» загружен');
      navigate('home');
    }
    function clearAllData() {
      if (!confirm('Удалить все партии и планы?')) return;
      store.batches = [];
      store.plans = [];
      ui.selectedId = null;
      persistStore();
      closeSettings();
      showToast('Очищено');
      navigate('home');
    }

    // =========================================================================
    // 8. COMPACT ADD / EDIT MODAL
    // =========================================================================
    function buildMeatOptions(sel) {
      const groups = {};
      Object.entries(MEAT_CATALOG).forEach(([id, it]) => {
        if (!groups[it.group]) groups[it.group] = [];
        groups[it.group].push({ id, ...it });
      });
      return Object.entries(groups).map(([g, arr]) => `
        <optgroup label="${g}">
          ${arr.map(it => `<option value="${it.id}" ${it.id === sel ? 'selected' : ''}>${it.label}</option>`).join('')}
        </optgroup>
      `).join('');
    }

    function openBatchModal(opts) {
      const o = opts || {};
      ui.modal.editingId = o.editId || null;
      ui.modal.fromPlanId = o.fromPlanId || null;

      const modal = document.getElementById('batch-modal');
      const delBtn = document.getElementById('m-delete-btn');
      const existBtn = document.getElementById('exist-toggle-btn');

      if (ui.modal.editingId) {
        const b = store.batches.find(x => x.id === ui.modal.editingId);
        if (!b) return;
        document.getElementById('modal-heading').textContent = 'Редактировать';
        delBtn.classList.remove('hidden');
        existBtn.classList.add('hidden');
        ui.modal.category = b.category;
        ui.modal.existing = false;
        ui.modal.phase = b.phase === 'done' ? 'dry' : b.phase;
        ui.modal.dryMethod = b.dryMethod || 'casing';
        ui.modal.smoked = !!b.smoked;
        ui.modal.locId = b.locId || 'fridge_12';

        syncModalUI(true);
        document.getElementById('m-cut').value = b.cutId || (b.category === 'pepper' ? 'pepper_vac' : 'pork_coppa');
        document.getElementById('m-title').value = b.title;
        document.getElementById('m-weight').value = b.initialWeight;
        document.getElementById('m-target').value = b.category === 'pepper' ? (b.targetDays || 21) : (b.targetLossPct || 34);
        document.getElementById('m-brine').value = b.brineWater || 0;
        document.getElementById('m-notes').value = b.notes || '';
        refreshModalHint();
      } else {
        document.getElementById('modal-heading').textContent = 'Новая закладка';
        delBtn.classList.add('hidden');
        existBtn.classList.remove('hidden');
        ui.modal.category = o.category === 'pepper' ? 'pepper' : 'meat';
        ui.modal.existing = !!o.existing;
        ui.modal.phase = ui.modal.category === 'pepper' ? 'ferm_vac' : (ui.modal.existing ? 'dry' : 'cure');
        ui.modal.dryMethod = 'casing';
        ui.modal.smoked = false;
        ui.modal.locId = ui.modal.category === 'pepper' ? 'room_22' : (ui.modal.phase === 'dry' ? 'fridge_12' : 'fridge_3');

        syncModalUI(false);
        if (o.presetCut) document.getElementById('m-cut').value = o.presetCut;
        document.getElementById('m-title').value = o.presetTitle || '';
        document.getElementById('m-weight').value = o.presetWeight || (ui.modal.category === 'pepper' ? 600 : 1200);
        document.getElementById('m-cur-weight').value = '';
        document.getElementById('m-start-date').value = daysAgoISO(14);
        document.getElementById('m-notes').value = '';
        onModalCutChange();
      }

      modal.classList.add('open');
      document.getElementById('sheet-panel').scrollTop = 0;
      haptic('light');
      syncAndroidBackState();
    }

    function closeBatchModal() {
      document.getElementById('batch-modal').classList.remove('open');
      syncAndroidBackState();
    }

    function setModalCat(c) {
      ui.modal.category = c;
      ui.modal.phase = c === 'pepper' ? 'ferm_vac' : (ui.modal.existing ? 'dry' : 'cure');
      ui.modal.locId = c === 'pepper' ? 'room_22' : (ui.modal.phase === 'dry' ? 'fridge_12' : 'fridge_3');
      document.getElementById('m-weight').value = c === 'pepper' ? 600 : 1200;
      haptic('light');
      syncModalUI(false);
      onModalCutChange();
    }

    function toggleModalExisting() {
      ui.modal.existing = !ui.modal.existing;
      if (ui.modal.category === 'meat' && ui.modal.existing) {
        ui.modal.phase = 'dry';
        ui.modal.locId = 'fridge_12';
      }
      haptic('light');
      syncModalUI(false);
      refreshModalHint();
    }

    function syncModalUI(isEdit) {
      const isMeat = ui.modal.category === 'meat';
      document.getElementById('cat-meat-btn').classList.toggle('active', isMeat);
      document.getElementById('cat-pepper-btn').classList.toggle('active', !isMeat);
      document.getElementById('exist-toggle-btn').classList.toggle('active', ui.modal.existing);
      document.getElementById('m-existing-box').classList.toggle('hidden', isEdit || !ui.modal.existing);
      document.getElementById('m-cur-w-wrap').classList.toggle('hidden', !isMeat);

      const cutSel = document.getElementById('m-cut');
      if (isMeat) {
        document.getElementById('m-cut-lbl').textContent = 'Отруб / вид мяса';
        document.getElementById('m-target-lbl').textContent = 'Усушка (%)';
        cutSel.innerHTML = buildMeatOptions(cutSel.value || 'pork_coppa');
      } else {
        document.getElementById('m-cut-lbl').textContent = 'Способ ферментации';
        document.getElementById('m-target-lbl').textContent = 'Срок (дн)';
        cutSel.innerHTML = Object.entries(PEPPER_CATALOG).map(([id, p]) => `<option value="${id}">${p.label}</option>`).join('');
      }

      renderModalPhasePicker();
      renderModalLocPicker();
    }

    function renderModalPhasePicker() {
      const isMeat = ui.modal.category === 'meat';
      const holder = document.getElementById('m-phase-picker');
      const phases = isMeat ? ['cure', 'dry', 'vacuum'] : ['ferm_vac', 'ferm_brine'];
      holder.className = isMeat ? 'stage-bar-3' : 'seg-toggle';
      holder.style.background = 'var(--white)';
      holder.innerHTML = phases.map(p => `
        <button type="button" class="phase-btn ${ui.modal.phase === p ? 'active' : ''}" onclick="selectModalPhase('${p}')">
          ${PHASES[p].tab}
        </button>
      `).join('');

      document.getElementById('m-dry-method-wrap').classList.toggle('hidden', !(isMeat && ui.modal.phase === 'dry'));
      document.getElementById('m-brine-wrap').classList.toggle('hidden', !(!isMeat && ui.modal.phase === 'ferm_brine'));

      if (isMeat && ui.modal.phase === 'dry') {
        document.getElementById('m-dry-method-chips').innerHTML = Object.values(DRY_METHODS).map(m => `
          <button type="button" class="sub-chip ${ui.modal.dryMethod === m.id ? 'active' : ''}" onclick="selectModalDryMethod('${m.id}')">${m.label}</button>
        `).join('') + `<button type="button" class="sub-chip ${ui.modal.smoked ? 'active' : ''}" onclick="toggleModalSmoked()">💨 Копчёное</button>`;
      }
    }

    function selectModalPhase(p) {
      ui.modal.phase = p;
      ui.modal.locId = (p === 'dry' && ui.modal.dryMethod === 'membrane') ? 'fridge_3' : PHASES[p].defLoc;
      haptic('light');
      renderModalPhasePicker();
      renderModalLocPicker();
      refreshModalHint();
    }

    function selectModalDryMethod(m) {
      ui.modal.dryMethod = m;
      ui.modal.locId = m === 'membrane' ? 'fridge_3' : 'fridge_12';
      haptic('light');
      renderModalPhasePicker();
      renderModalLocPicker();
    }

    function toggleModalSmoked() {
      ui.modal.smoked = !ui.modal.smoked;
      haptic('light');
      renderModalPhasePicker();
    }

    function renderModalLocPicker() {
      const holder = document.getElementById('m-loc-picker');
      const allowed = ui.modal.category === 'pepper' ? ['room_22', 'fridge_12', 'fridge_3'] : ['fridge_3', 'fridge_12'];
      if (!allowed.includes(ui.modal.locId)) ui.modal.locId = allowed[0];
      holder.innerHTML = allowed.map(id => {
        const l = LOCATIONS[id];
        return `<button type="button" class="loc-btn ${ui.modal.locId === id ? 'selected' : ''}" onclick="selectModalLoc('${id}')">${l.icon} ${l.label}</button>`;
      }).join('');
    }

    function selectModalLoc(id) { ui.modal.locId = id; haptic('light'); renderModalLocPicker(); }
    function setStartAgo(d) { document.getElementById('m-start-date').value = daysAgoISO(d); haptic('light'); refreshModalHint(); }

    function onModalCutChange() {
      const val = document.getElementById('m-cut').value;
      if (ui.modal.category === 'meat') {
        const cut = getCut(val);
        document.getElementById('m-target').value = cut.optLoss;
        document.getElementById('m-title').placeholder = cut.defTitle;
        ui.modal.dryMethod = cut.optMethod;
        renderModalPhasePicker();
      } else {
        const p = PEPPER_CATALOG[val] || PEPPER_CATALOG.pepper_vac;
        document.getElementById('m-target').value = p.targetDays;
        document.getElementById('m-brine').value = p.defBrine;
        document.getElementById('m-title').placeholder = p.defTitle;
        ui.modal.phase = p.optPhase;
        renderModalPhasePicker();
      }
      refreshModalHint();
    }

    function refreshModalHint() {
      const box = document.getElementById('m-opt-hint');
      const w = parseInt(document.getElementById('m-weight').value, 10) || 1000;
      const tVal = parseInt(document.getElementById('m-target').value, 10) || 34;

      if (ui.modal.category === 'meat') {
        const cut = getCut(document.getElementById('m-cut').value);
        const saltTotal = (w * cut.saltPct / 100).toFixed(1);
        const finW = Math.round(w * (1 - tVal / 100));
        box.innerHTML = `<b>✨ Оптимально: −${cut.optLoss}% · ${(DRY_METHODS[cut.optMethod] || DRY_METHODS.casing).label}</b> · посол ~${cut.cureDays}д<br/>🧂 Соль ${cut.saltPct}%: <b>${saltTotal} г</b> (нитритная или 50/50) · Цель: <b>${finW} г</b>`;
      } else {
        const p = PEPPER_CATALOG[document.getElementById('m-cut').value] || PEPPER_CATALOG.pepper_vac;
        const brine = ui.modal.phase === 'ferm_brine' ? (parseInt(document.getElementById('m-brine').value, 10) || 0) : 0;
        const pct = ui.modal.phase === 'ferm_brine' ? 3.5 : p.saltPct;
        const saltG = ((w + brine) * pct / 100).toFixed(1);
        box.innerHTML = `<b>🌶 Оптимально: ${pct}% соли · ${p.targetDays} дн</b><br/>🧂 Соль на ${w + brine} г: <b>${saltG} г</b> неиодированной соли`;
      }
    }

    function saveBatchModal() {
      dismissKeyboard();
      const cat = ui.modal.category;
      const cutId = document.getElementById('m-cut').value;
      const cutObj = cat === 'meat' ? getCut(cutId) : (PEPPER_CATALOG[cutId] || PEPPER_CATALOG.pepper_vac);
      const title = document.getElementById('m-title').value.trim() || cutObj.defTitle;
      const w = Math.max(40, parseInt(document.getElementById('m-weight').value, 10) || 1000);
      const targetVal = Math.max(1, parseInt(document.getElementById('m-target').value, 10) || 34);
      const brine = cat === 'pepper' && ui.modal.phase === 'ferm_brine' ? Math.max(0, parseInt(document.getElementById('m-brine').value, 10) || 0) : 0;
      const notes = document.getElementById('m-notes').value.trim();

      if (ui.modal.editingId) {
        const b = store.batches.find(x => x.id === ui.modal.editingId);
        if (b) {
          b.category = cat;
          b.cutId = cutId;
          b.title = title;
          b.initialWeight = w;
          if (b.weightLogs.length === 1) b.weightLogs[0].weight = w;
          b.targetLossPct = cat === 'meat' ? targetVal : 0;
          b.targetDays = cat === 'pepper' ? targetVal : 0;
          b.brineWater = brine;
          b.dryMethod = ui.modal.dryMethod;
          b.smoked = ui.modal.smoked;
          b.locId = ui.modal.locId;
          b.notes = notes;
          if (b.phase !== ui.modal.phase && b.phase !== 'done') moveBatchToPhase(b.id, ui.modal.phase);
        }
        persistStore();
        closeBatchModal();
        ui.draftWeight = null;
        haptic('success');
        showToast('Сохранено');
        render();
        return;
      }

      const today = daysAgoISO(0);
      const rawStart = document.getElementById('m-start-date').value;
      const createdAt = (ui.modal.existing && rawStart && rawStart <= today) ? rawStart : today;
      const phaseHistory = [{ phase: ui.modal.phase, startDate: createdAt, endDate: null }];
      const weightLogs = [{ date: createdAt, weight: w, phase: ui.modal.phase, note: 'Старт' }];

      if (ui.modal.existing && cat === 'meat') {
        const curW = parseInt(document.getElementById('m-cur-weight').value, 10);
        if (!isNaN(curW) && curW > 20 && curW !== w) {
          weightLogs.push({ date: today, weight: curW, phase: ui.modal.phase, note: 'Текущий вес' });
        }
      }

      const id = 'b-' + Date.now();
      store.batches.unshift({
        id,
        category: cat,
        title,
        cutId,
        initialWeight: w,
        hangWeight: w,
        brineWater: brine,
        targetLossPct: cat === 'meat' ? targetVal : 0,
        targetDays: cat === 'pepper' ? targetVal : 0,
        phase: ui.modal.phase,
        dryMethod: ui.modal.dryMethod,
        smoked: ui.modal.smoked,
        locId: ui.modal.locId,
        saltPct: cat === 'meat' ? cutObj.saltPct : (ui.modal.phase === 'ferm_brine' ? 3.5 : cutObj.saltPct),
        puffed: false,
        degasCount: 0,
        phValue: 4.0,
        createdAt,
        notes,
        verdict: '',
        tastingNote: '',
        phaseHistory,
        weightLogs
      });

      if (ui.modal.fromPlanId) {
        store.plans = store.plans.filter(p => p.id !== ui.modal.fromPlanId);
      }

      ui.selectedId = id;
      ui.inspectPhase = ui.modal.phase;
      ui.draftWeight = null;
      ui.zoneFilter = 'all';
      persistStore();
      closeBatchModal();
      haptic('success');
      showToast(`Добавлено: «${title}»`);
      navigate('detail', id);
    }

    function deleteEditingBatch() {
      if (!ui.modal.editingId || !confirm('Удалить эту партию?')) return;
      store.batches = store.batches.filter(x => x.id !== ui.modal.editingId);
      ui.selectedId = store.batches.length ? store.batches[0].id : null;
      persistStore();
      closeBatchModal();
      haptic('medium');
      showToast('Удалено');
      navigate('home');
    }

    // Boot
    loadStore();
    ui.selectedId = store.batches.length ? store.batches[0].id : null;
    ui.inspectPhase = store.batches.length ? store.batches[0].phase : null;
    render();
  </script>
</body>
</html>
