<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ferment</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', 'Segoe UI', sans-serif;
      --font-serif: Georgia, 'Times New Roman', serif;
      --font-mono: 'SF Mono', 'Roboto Mono', ui-monospace, monospace;

      --safe-top: 0px;
      --safe-bottom: 0px;

      /* Signature Pastel Palette */
      --ink: #18191C;
      --text-sec: #686662;
      --text-muted: #98938A;

      --cream-bg: #FAF8F1;
      --cream-card: #F3EFE4;
      --cream-warm: #F5E9DC;
      --white: #FFFFFF;

      --coral: #EA7B72;
      --coral-deep: #C45249;
      --apricot: #EE9D68;
      --apricot-deep: #C8713B;
      --sage: #8FB184;
      --sage-deep: #56794C;
      --teal: #3B7D71;
      --teal-deep: #295D53;
      --butter: #F5D547;
      --butter-soft: #FCF6D8;
      --mustard: #EDA944;
      --lavender: #8884E6;
      --lavender-deep: #5B57B8;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--cream-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    input, select, textarea {
      user-select: text;
      font-family: var(--font-sans);
    }

    .app-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--cream-bg);
    }

    .screen-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(112px + var(--safe-bottom));
    }

    body.kb-open .screen-viewport { padding-bottom: 120px; }
    .screen-viewport::-webkit-scrollbar { width: 0; height: 0; }

    /* COMMON BUTTONS */
    .circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(24, 25, 28, 0.08);
      background: var(--white);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.14s var(--ease);
    }
    .circle-btn:active { transform: scale(0.92); }
    .circle-btn.on-pastel {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.28);
      color: var(--white);
    }

    .btn-butter {
      border: none;
      background: var(--butter);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      padding: 13px 18px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 6px 18px rgba(245, 213, 71, 0.34);
      transition: transform 0.14s var(--ease);
    }
    .btn-butter:active { transform: scale(0.96); }

    .btn-ink {
      border: none;
      background: var(--ink);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      padding: 13px 18px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.14s var(--ease);
    }
    .btn-ink:active { transform: scale(0.96); }

    .btn-soft {
      border: 1.5px solid rgba(24, 25, 28, 0.12);
      background: var(--white);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      padding: 11px 16px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-soft:active { transform: scale(0.96); }

    /* =====================================================================
       HOME SCREEN
       ===================================================================== */
    .home-header {
      padding: calc(14px + var(--safe-top)) 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(24, 25, 28, 0.14);
      flex-shrink: 0;
    }

    .heute-split {
      margin: 4px 18px 14px;
      background: var(--white);
      border-radius: 26px;
      display: grid;
      grid-template-columns: 1fr 112px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(24, 25, 28, 0.05);
    }

    .heute-left {
      padding: 15px 14px 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .heute-right {
      background: var(--butter);
      padding: 14px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .heute-right:active { filter: brightness(0.95); }

    .quick-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 0;
      font-size: 12px;
      cursor: pointer;
    }

    .quick-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid rgba(24, 25, 28, 0.13);
      background: var(--cream-bg);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }
    .quick-pill.urgent {
      background: #E4F2E1;
      border-color: #8FB184;
      color: #3E6634;
    }

    .zone-strip {
      padding: 0 18px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 13px;
    }
    .zone-strip::-webkit-scrollbar { display: none; }

    .zone-chip {
      border: none;
      background: var(--white);
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 99px;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.16s var(--ease);
    }
    .zone-chip.active {
      background: var(--ink);
      color: var(--white);
    }

    .section-row {
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .pastel-grid {
      padding: 0 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .pastel-card {
      border-radius: 26px;
      padding: 12px 13px 14px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(24, 25, 28, 0.08);
      transition: transform 0.15s var(--ease);
    }
    .pastel-card:active { transform: scale(0.97); }

    .card-ring-mini {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 800;
      font-family: var(--font-mono);
    }

    .card-art-slot {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =====================================================================
       DETAIL SCREEN — TAB-FREE PASSPORT + EDITABLE CHRONOLOGY TIMELINE
       ===================================================================== */
    .detail-hero {
      padding: calc(12px + var(--safe-top)) 18px 26px;
      color: var(--white);
      min-height: 244px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.35s var(--ease);
    }

    .detail-sheet {
      background: var(--white);
      border-radius: 30px 30px 0 0;
      margin-top: -18px;
      position: relative;
      z-index: 3;
      padding: 18px 18px 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* BLOCK A: CHRONOLOGY & SUMMARY PILLS */
    .chronology-box {
      background: var(--cream-bg);
      border-radius: 24px;
      padding: 15px 15px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sum-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 99px;
      background: var(--white);
      font-size: 11px;
      font-weight: 800;
      color: var(--ink);
      box-shadow: 0 2px 6px rgba(24, 25, 28, 0.04);
    }

    .timeline-stack {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .tl-row {
      display: flex;
      align-items: stretch;
      gap: 11px;
      cursor: pointer;
      padding: 6px 8px;
      margin: 0 -8px;
      border-radius: 16px;
      transition: background 0.14s;
    }
    .tl-row:active { background: rgba(24, 25, 28, 0.05); }

    .tl-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 16px;
      flex-shrink: 0;
      padding-top: 4px;
    }

    .tl-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2.5px solid var(--white);
      box-shadow: 0 0 0 1.5px rgba(24, 25, 28, 0.15);
    }
    .tl-dot.current {
      width: 14px;
      height: 14px;
      box-shadow: 0 0 0 3px rgba(245, 213, 71, 0.55);
    }

    .tl-line {
      flex: 1;
      width: 2px;
      background: rgba(24, 25, 28, 0.11);
      margin-top: 4px;
      min-height: 18px;
    }
    .tl-row:last-child .tl-line { display: none; }

    .tl-content {
      flex: 1;
      min-width: 0;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tl-row:last-child .tl-content { padding-bottom: 2px; }

    .tl-days-badge {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 99px;
      background: var(--white);
      color: var(--ink);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tl-days-badge.live {
      background: var(--butter);
    }

    /* Sub-chips for casing/smoked */
    .sub-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .sub-chip {
      border: 1.5px solid rgba(24, 25, 28, 0.13);
      background: var(--white);
      color: var(--text-sec);
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 99px;
      cursor: pointer;
    }
    .sub-chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--white);
    }

    /* BLOCK B: LOCKED VACUUM CARD OR ARC WEIGH-IN DIAL */
    .vacuum-locked-card {
      border-radius: 26px;
      padding: 17px 16px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      gap: 11px;
      box-shadow: 0 12px 28px rgba(24, 25, 28, 0.11);
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.18);
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .vac-progress-track {
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
    }
    .vac-progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--butter);
      transition: width 0.35s var(--ease);
    }

    .arc-dial-card {
      border-radius: 28px;
      background: var(--mustard);
      overflow: hidden;
      padding-top: 12px;
      color: var(--white);
      box-shadow: 0 12px 28px rgba(59, 125, 113, 0.18);
    }

    .arc-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px 10px;
    }

    .arc-date-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 99px;
      cursor: pointer;
    }

    .arc-teal-body {
      background: var(--teal);
      border-radius: 50% 50% 0 0 / 38px 38px 0 0;
      padding: 14px 14px 18px;
      text-align: center;
    }

    .weight-inline-input {
      width: 118px;
      background: rgba(255, 255, 255, 0.16);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 14px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 23px;
      font-weight: 800;
      text-align: center;
      padding: 5px 8px;
      outline: none;
    }
    .weight-inline-input:focus {
      background: rgba(255, 255, 255, 0.26);
      border-color: var(--butter);
    }

    .arc-steppers {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 12px;
    }

    .teal-step-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .teal-step-btn:active { background: rgba(255, 255, 255, 0.34); }

    .teal-save-btn {
      height: 44px;
      padding: 0 17px;
      border-radius: 99px;
      border: 3.5px solid rgba(255, 255, 255, 0.25);
      background: var(--cream-bg);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }
    .teal-save-btn:active { transform: scale(0.96); }

    /* TASTING CARD */
    .tasting-card {
      border-radius: 24px;
      background: var(--cream-bg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .verdict-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .verdict-chip {
      border: 1.5px solid rgba(24, 25, 28, 0.12);
      background: var(--white);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 99px;
      cursor: pointer;
    }
    .verdict-chip.selected {
      background: var(--butter);
      border-color: var(--ink);
    }

    /* BLOCK C: WAVE CURVE & EDITABLE WEIGHT JOURNAL */
    .wave-card {
      background: var(--cream-bg);
      border-radius: 24px;
      padding: 14px 13px 12px;
    }

    .journal-list {
      display: flex;
      flex-direction: column;
    }
    .journal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 6px;
      margin: 0 -6px;
      border-bottom: 1px solid rgba(24, 25, 28, 0.06);
      font-size: 12.5px;
      border-radius: 12px;
      cursor: pointer;
    }
    .journal-item:active { background: rgba(24, 25, 28, 0.05); }
    .journal-item:last-child { border-bottom: none; }

    /* =====================================================================
       ARCHIVE & PLANS SCREEN
       ===================================================================== */
    .archive-wrap {
      padding: calc(14px + var(--safe-top)) 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .seg-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      background: var(--cream-card);
      padding: 4px;
      border-radius: 99px;
    }
    .seg-opt {
      border: none;
      background: transparent;
      color: var(--text-sec);
      font-size: 12.5px;
      font-weight: 700;
      padding: 9px 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }
    .seg-opt.active {
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 3px 10px rgba(24, 25, 28, 0.16);
    }

    .archive-card {
      background: var(--white);
      border-radius: 24px;
      padding: 15px 16px;
      box-shadow: 0 8px 24px rgba(24, 25, 28, 0.045);
      display: flex;
      flex-direction: column;
      gap: 9px;
      cursor: pointer;
    }
    .archive-card:active { transform: scale(0.985); }

    .plan-card {
      background: var(--white);
      border-radius: 24px;
      padding: 15px 16px;
      box-shadow: 0 8px 24px rgba(24, 25, 28, 0.045);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* FLOATING 3-ITEM BOTTOM DOCK */
    .bottom-dock {
      position: fixed;
      bottom: calc(14px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 248px;
      height: 60px;
      background: var(--ink);
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      box-shadow: 0 14px 32px rgba(24, 25, 28, 0.28);
      z-index: 40;
      transition: transform 0.2s var(--ease), opacity 0.2s;
    }

    body.kb-open .bottom-dock {
      transform: translate(-50%, 100px);
      opacity: 0;
      pointer-events: none;
    }

    .dock-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.54);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }
    .dock-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
    }

    .dock-fab {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--butter);
      color: var(--ink);
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 213, 71, 0.42);
    }
    .dock-fab:active { transform: scale(0.92); }

    /* FLOATING KEYBOARD DISMISS BUTTON */
    .kb-dismiss-bar {
      position: fixed;
      right: 14px;
      bottom: 10px;
      z-index: 300;
      display: none;
    }
    body.kb-open .kb-dismiss-bar { display: flex; }
    .kb-dismiss-btn {
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      background: var(--ink);
      color: var(--white);
      font-size: 12.5px;
      font-weight: 800;
      padding: 9px 16px;
      border-radius: 99px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* MODAL BOTTOM SHEETS */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 25, 28, 0.5);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 120;
    }
    .sheet-backdrop.open { display: flex; }

    .sheet-panel {
      width: 100%;
      max-width: 500px;
      max-height: 92%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--cream-bg);
      border-radius: 30px 30px 0 0;
      padding: 18px 18px calc(26px + var(--safe-bottom));
      animation: slideUp 0.22s var(--ease);
    }
    body.kb-open .sheet-panel {
      max-height: 98%;
      padding-bottom: 120px;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .f-group { margin-bottom: 11px; }
    .f-lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sec);
      margin-bottom: 4px;
    }
    .f-inp {
      width: 100%;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1.5px solid rgba(24, 25, 28, 0.11);
      background: var(--white);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }
    .f-inp:focus { border-color: var(--ink); }

    .stage-grid-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stage-pick-card {

  <script>
    // =========================================================================
    // 1. NATIVE BRIDGE, KEYBOARD & BACK SWIPE SYNC
    // =========================================================================
    const hasAndroid = typeof window.AndroidBridge !== 'undefined';
    let currentImeDp = 0;

    function isAnyModalOpen() {
      return ['passport-modal', 'stage-modal', 'log-modal', 'settings-modal']
        .some(id => document.getElementById(id).classList.contains('open'));
    }

    function closeAllModals() {
      ['passport-modal', 'stage-modal', 'log-modal', 'settings-modal']
        .forEach(id => document.getElementById(id).classList.remove('open'));
      syncAndroidBackState();
    }

    function syncAndroidBackState() {
      if (!hasAndroid || !window.AndroidBridge.setCanGoBack) return;
      const canGoBack = ui.screen !== 'home' || isAnyModalOpen() || currentImeDp > 40 || isTextFieldFocused();
      try { window.AndroidBridge.setCanGoBack(!!canGoBack); } catch (e) {}
    }

    window.__setAndroidInsets = function(topDp, bottomDp, imeDp) {
      document.documentElement.style.setProperty('--safe-top', Math.max(0, topDp || 0) + 'px');
      document.documentElement.style.setProperty('--safe-bottom', Math.max(0, bottomDp || 0) + 'px');
      currentImeDp = imeDp || 0;
      const isKb = currentImeDp > 40 || isTextFieldFocused();
      document.body.classList.toggle('kb-open', isKb);
      if (currentImeDp > 40) scrollActiveInputIntoView();
      syncAndroidBackState();
    };

    function isTextFieldFocused() {
      const el = document.activeElement;
      return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
    }

    function scrollActiveInputIntoView() {
      const el = document.activeElement;
      if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
      setTimeout(() => {
        try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
      }, 220);
    }

    function dismissKeyboard() {
      const el = document.activeElement;
      if (el && typeof el.blur === 'function') el.blur();
      document.body.classList.remove('kb-open');
      if (hasAndroid && window.AndroidBridge.hideKeyboard) {
        try { window.AndroidBridge.hideKeyboard(); } catch (e) {}
      }
      syncAndroidBackState();
    }

    document.addEventListener('focusin', (ev) => {
      const tag = ev.target && ev.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        document.body.classList.add('kb-open');
        scrollActiveInputIntoView();
        syncAndroidBackState();
      }
    });
    document.addEventListener('focusout', () => {
      setTimeout(() => {
        if (!isTextFieldFocused() && currentImeDp <= 40) {
          document.body.classList.remove('kb-open');
          syncAndroidBackState();
        }
      }, 140);
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && isTextFieldFocused()) {
        ev.preventDefault();
        dismissKeyboard();
      }
    });
    document.addEventListener('click', (ev) => {
      if (!isTextFieldFocused()) return;
      if (!ev.target.closest('input, textarea, select, button, .kb-dismiss-btn')) dismissKeyboard();
    });

    function haptic(k) {
      if (hasAndroid && window.AndroidBridge.haptic) {
        try { window.AndroidBridge.haptic(k || 'light'); } catch (e) {}
      }
    }
    function setStatusBar(hex, darkIcons) {
      if (hasAndroid && window.AndroidBridge.setStatusBar) {
        try { window.AndroidBridge.setStatusBar(hex, !!darkIcons); } catch (e) {}
      }
    }
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(() => el.classList.remove('show'), 1900);
    }

    // =========================================================================
    // 2. DOMAIN MODEL: 3°C FRIDGE + 12°C FERMENTATION CHAMBER
    // =========================================================================
    const LOCATIONS = {
      fridge_3:  { id: 'fridge_3',  label: 'Холодильник 3°C',  short: 'Холод. 3°C', temp: 3,  icon: '❄️' },
      fridge_12: { id: 'fridge_12', label: 'Ферм-камера 12°C', short: 'Ферм. 12°C', temp: 12, icon: '🌡' },
      room_22:   { id: 'room_22',   label: 'Комната ~22°C',    short: 'Комн. 22°C', temp: 22, icon: '🌶' }
    };

    const PHASES = {
      cure:       { id: 'cure',       short: 'Посол',     full: 'Посол в вакууме',       sub: '3°C · в пакете',  hex: '#8884E6', defLoc: 'fridge_3',  isDrying: false },
      dry:        { id: 'dry',        short: 'Ферм. 12°', full: 'Ферм-камера 12°C',      sub: 'вяление / ферм.', hex: '#EE9D68', defLoc: 'fridge_12', isDrying: true  },
      vacuum:     { id: 'vacuum',     short: 'Вакуум',    full: 'Отлёжка в вакууме',     sub: '3°C · корка',     hex: '#3B7D71', defLoc: 'fridge_3',  isDrying: false },
      done:       { id: 'done',       short: 'Готово',    full: 'Готово · в Архиве',     sub: 'дегустация',      hex: '#8FB184', defLoc: 'fridge_3',  isDrying: false },
      ferm_vac:   { id: 'ferm_vac',   short: 'Вакуум',    full: 'Перцы в вакууме',       sub: '22°C · без воды', hex: '#EA7B72', defLoc: 'room_22',   isDrying: false },
      ferm_brine: { id: 'ferm_brine', short: 'Рассол',    full: 'Перцы в рассоле',       sub: '22°C · банка',    hex: '#8FB184', defLoc: 'room_22',   isDrying: false }
    };

    const DRY_METHODS = {
      casing:   { id: 'casing',   label: 'Оболочка',     factor: 0.85, hex: '#EE9D68' },
      naked:    { id: 'naked',    label: 'Без оболочки', factor: 1.00, hex: '#EA7B72' },
      membrane: { id: 'membrane', label: 'Мембрана',     factor: 0.68, hex: '#EDA944' }
    };

    const VERDICTS = [
      '🔥 Идеально',
      '👍 Хорошо',
      '💧 Влажновато',
      '🪨 Суховато',
      '🥓 Как сало',
      '🧂 Солоновато'
    ];

    const MEAT_CATALOG = {
      pork_coppa: {
        group: 'Свинина', label: 'Коппа (свиная шея)', defTitle: 'Коппа',
        factor: 0.78, optLoss: 34, refDiam: 95, refWeight: 1200, optMethod: 'casing',
        cureDays: 14, saltPct: 2.7
      },
      pork_lonzino: {
        group: 'Свинина', label: 'Лонзино (карбонад / корейка)', defTitle: 'Лонзино',
        factor: 1.05, optLoss: 33, refDiam: 78, refWeight: 900, optMethod: 'casing',
        cureDays: 12, saltPct: 2.6

    const MONTHS_RU = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

    function daysAgoISO(daysAgo) {
      return new Date(Date.now() - daysAgo * 86400000).toISOString().slice(0, 10);
    }
    function formatShortDate(iso) {
      if (!iso) return 'Сегодня';
      const p = iso.split('-');
      return p.length === 3 ? `${parseInt(p[2], 10)} ${MONTHS_RU[parseInt(p[1], 10) - 1] || ''}` : iso;
    }
    function diffDays(isoA, isoB) {
      const a = new Date(isoA + 'T12:00:00').getTime();
      const b = new Date((isoB || daysAgoISO(0)) + 'T12:00:00').getTime();
      return Math.max(0, Math.round((b - a) / 86400000));
    }

    // Keep phaseHistory contiguous, sorted, and sync batch.phase + batch.createdAt!
    function normalizeBatchChronology(b) {
      if (!Array.isArray(b.phaseHistory) || !b.phaseHistory.length) {
        b.phaseHistory = [{ phase: b.phase || 'cure', startDate: b.createdAt || daysAgoISO(0), endDate: null }];
      }
      b.phaseHistory.sort((x, y) => (x.startDate || '').localeCompare(y.startDate || ''));
      for (let i = 0; i < b.phaseHistory.length; i++) {
        const cur = b.phaseHistory[i];
        if (i < b.phaseHistory.length - 1) {
          const next = b.phaseHistory[i + 1];
          // Ensure contiguous chain unless user explicitly set something else
          cur.endDate = next.startDate;
        } else {
          cur.endDate = null;
        }
      }
      const first = b.phaseHistory[0];
      const last = b.phaseHistory[b.phaseHistory.length - 1];
      b.createdAt = first.startDate;
      b.phase = last.phase;
      if (last.method) b.dryMethod = last.method;
      if (typeof last.smoked === 'boolean') b.smoked = last.smoked;

      // Sync chamber location to active stage automatically
      if (b.category === 'meat') {
        if (b.phase === 'dry') {
          b.locId = b.dryMethod === 'membrane' ? 'fridge_3' : 'fridge_12';
        } else {
          b.locId = 'fridge_3';
        }
      }

      if (Array.isArray(b.weightLogs) && b.weightLogs.length) {
        b.weightLogs.sort((x, y) => (x.date || '').localeCompare(y.date || ''));
        b.weightLogs[0].date = b.createdAt;
      }
    }

    function loadStore() {
      let raw = '';
      if (hasAndroid && window.AndroidBridge.loadState) {
        try { raw = window.AndroidBridge.loadState(); } catch (e) {}
      }
      if (!raw) {
        try { raw = localStorage.getItem('kamera_store_v1') || ''; } catch (e) {}
      }
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.schemaVersion === 3 && Array.isArray(parsed.batches)) {
            store = parsed;
            if (!store.plans) store.plans = [];
            store.batches.forEach(normalizeBatchChronology);
            return;
          }
        } catch (e) {}
      }
      store = createSousChefSeed();
      persistStore();
    }

    function persistStore() {
      const json = JSON.stringify(store);
      try { localStorage.setItem('kamera_store_v1', json); } catch (e) {}
      if (hasAndroid && window.AndroidBridge.saveState) {
        try { window.AndroidBridge.saveState(json); } catch (e) {}
      }

    // =========================================================================
    // 4. FICK'S LAW FERMENTATION / DRYING ENGINE
    // =========================================================================
    function getCut(cutId) { return MEAT_CATALOG[cutId] || MEAT_CATALOG.pork_coppa; }

    function getPhaseColor(batch, phOverride) {
      const ph = phOverride || batch.phase;
      if (ph === 'dry') return (DRY_METHODS[batch.dryMethod] || DRY_METHODS.casing).hex;
      return (PHASES[ph] || PHASES.dry).hex;
    }

    function analyze(batch) {
      const today = daysAgoISO(0);

      if (batch.category === 'pepper') {
        const elapsed = diffDays(batch.createdAt, today);
        const targetDays = batch.targetDays || 21;
        const remDays = Math.max(0, targetDays - elapsed);
        const readinessPct = batch.phase === 'done' ? 100 : Math.min(100, Math.round((elapsed / targetDays) * 100));
        const totalMass = batch.initialWeight + (batch.brineWater || 0);
        const saltGrams = ((totalMass * (batch.saltPct || 2.8)) / 100).toFixed(1);
        const etaBadge = batch.phase === 'done' || remDays === 0 ? 'Готово!' : (batch.puffed ? 'CO₂!' : `~${remDays} дн`);
        return {
          isPepper: true,
          W0: batch.initialWeight, Wcur: batch.initialWeight, targetWeight: batch.initialWeight,
          lostGrams: 0, lossPct: 0, readinessPct, remDays,
          etaBadge, etaSort: batch.puffed ? 0 : remDays,
          elapsedDays: elapsed, curPhaseDays: elapsed,
          cureDays: 0, dryDays: 0, vacDays: batch.phase === 'ferm_vac' ? elapsed : 0,
          saltGrams, k_eff: 0.04, speedPctDay: 0
        };
      }

      const cut = getCut(batch.cutId);
      const useHang = store.settings.lossBase === 'hang' && batch.hangWeight;
      const W0 = useHang ? batch.hangWeight : batch.initialWeight;
      const lastLog = batch.weightLogs[batch.weightLogs.length - 1] || { date: batch.createdAt, weight: batch.initialWeight };
      const Wcur = lastLog.weight;
      const targetLoss = batch.targetLossPct || cut.optLoss;
      const targetWeight = Math.round(W0 * (1 - targetLoss / 100));
      const lostGrams = Math.max(0, W0 - Wcur);
      const lossPct = Math.max(0, ((W0 - Wcur) / W0) * 100);
      const readinessPct = batch.phase === 'done'
        ? Math.max(100, Math.round((lossPct / targetLoss) * 100))
        : Math.min(100, Math.max(0, Math.round((lossPct / targetLoss) * 100)));

      const estDiam = Math.max(32, Math.min(130, cut.refDiam * Math.pow(Math.max(200, W0) / cut.refWeight, 1 / 3)));
      const W_inf = 0.44 * W0;
      const methodF = (DRY_METHODS[batch.dryMethod] || DRY_METHODS.casing).factor;
      const loc = LOCATIONS[batch.locId] || LOCATIONS.fridge_12;
      const dryTemp = batch.phase === 'dry' ? loc.temp : 12;
      const k_prior = 0.034 * cut.factor * methodF * Math.pow(75 / estDiam, 1.42) * (0.68 + 0.32 * (dryTemp / 12));

      let cureDays = 0, dryDays = 0, vacDays = 0;
      for (const h of batch.phaseHistory) {
        const d = diffDays(h.startDate, h.endDate || today);
        if (h.phase === 'cure') cureDays += d;
        else if (h.phase === 'dry') dryDays += d;
        else if (h.phase === 'vacuum') vacDays += d;
      }

      // Active drying days UP TO the date of the latest weight log (critical for accurate retroactive calibration!)
      let dryDaysAtLastLog = 0;
      for (const h of batch.phaseHistory) {
        if (h.phase === 'dry' && h.startDate < lastLog.date) {
          const endCap = (!h.endDate || h.endDate > lastLog.date) ? lastLog.date : h.endDate;
          dryDaysAtLastLog += diffDays(h.startDate, endCap);
        }
      }

      const curH = batch.phaseHistory[batch.phaseHistory.length - 1];
      const curPhaseDays = curH ? diffDays(curH.startDate, today) : 0;

      let k_emp = null;
      if (dryDaysAtLastLog >= 3 && Wcur < W0 && Wcur > W_inf + 10) {
        const ratio = (Wcur - W_inf) / (W0 - W_inf);
        if (ratio > 0.05 && ratio < 0.99) k_emp = -Math.log(ratio) / dryDaysAtLastLog;
      }
      const empTrust = Math.min(0.85, dryDaysAtLastLog / 14);
      const k_eff = k_emp !== null ? (k_emp * empTrust + k_prior * (1 - empTrust)) : k_prior;

      let remDryingDays = 0;
      if (Wcur > targetWeight && Wcur > W_inf + 5 && targetWeight > W_inf) {
        const rNeed = (targetWeight - W_inf) / (Wcur - W_inf);
        if (rNeed > 0 && rNeed < 1) {
          const fromLastLog = Math.ceil(-Math.log(rNeed) / Math.max(0.004, k_eff));
          const drySinceLastLog = Math.max(0, dryDays - dryDaysAtLastLog);
          remDryingDays = Math.max(1, fromLastLog - drySinceLastLog);
        }
      }

      const recCure = cut.cureDays || 12;
      const cureLeft = Math.max(0, recCure - cureDays);
      const curePct = Math.min(100, Math.round((cureDays / Math.max(1, recCure)) * 100));

      let etaBadge = '';
      let etaSort = remDryingDays;
      if (batch.phase === 'done') {
        etaBadge = 'В архиве';
        etaSort = 999;
      } else if (batch.phase === 'cure') {
        etaBadge = cureLeft === 0 ? 'В ферм-камеру!' : `посол ~${cureLeft}д`;
        etaSort = cureLeft;
      } else if (batch.phase === 'vacuum') {
        etaBadge = curPhaseDays >= 5 ? 'Достать?' : `вак · ${curPhaseDays}д`;
        etaSort = curPhaseDays >= 5 ? 1 : Math.max(2, remDryingDays);
      } else {
        etaBadge = Wcur <= targetWeight ? 'Готово!' : `~${remDryingDays} дн`;
        etaSort = Wcur <= targetWeight ? 0 : remDryingDays;
      }

      return {
        isPepper: false,
        cut, W0, Wcur, targetWeight, lostGrams, lossPct, readinessPct,
        remDays: remDryingDays, cureLeft, recCure, curePct,
        etaBadge, etaSort,
        elapsedDays: diffDays(batch.createdAt, today),
        curPhaseDays, cureDays, dryDays, vacDays, k_eff
      };
    }

    // =========================================================================
    // 6. NAVIGATION & RENDERING
    // =========================================================================
    function getSelectedBatch() {
      if (!store.batches.length) return null;
      return store.batches.find(b => b.id === ui.selectedId) || store.batches[0];
    }

    function navigate(screen, batchId) {
      dismissKeyboard();
      if (screen === 'detail' && ui.screen !== 'detail') {
        ui.prevScreen = ui.screen;
      }
      if (batchId) {
        ui.selectedId = batchId;
        ui.draftWeight = null;
        ui.weighDateISO = daysAgoISO(0);
      }
      ui.screen = screen;
      haptic('light');
      render();
      document.getElementById('viewport').scrollTop = 0;
    }

    window.handleAndroidBack = function() {
      if (isTextFieldFocused() || currentImeDp > 40) { dismissKeyboard(); return true; }
      if (isAnyModalOpen()) { closeAllModals(); return true; }
      if (ui.screen === 'detail') {
        const b = getSelectedBatch();
        const dest = (b && b.phase === 'done') ? 'archive' : (ui.prevScreen === 'archive' ? 'archive' : 'home');
        navigate(dest);
        return true;
      }
      if (ui.screen !== 'home') {
        navigate('home');
        return true;
      }
      return false;
    };

    function render() {
      document.getElementById('dock-home').classList.toggle('active', ui.screen === 'home' || (ui.screen === 'detail' && ui.prevScreen !== 'archive'));
      document.getElementById('dock-archive').classList.toggle('active', ui.screen === 'archive' || (ui.screen === 'detail' && ui.prevScreen === 'archive'));

      const vp = document.getElementById('viewport');
      if (ui.screen === 'home') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildHomeScreen();
      } else if (ui.screen === 'detail') {
        const b = getSelectedBatch();
        setStatusBar(b ? getPhaseColor(b) : '#EE9D68', false);
        vp.innerHTML = buildDetailScreen(b);
      } else if (ui.screen === 'archive') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildArchiveScreen();
      }
      syncAndroidBackState();
    }

    // --- SCREEN 1: HOME ---
    function buildHomeScreen() {
      const active = store.batches.filter(b => b.phase !== 'done');
      const analyzed = active.map(b => ({ b, an: analyze(b) })).sort((a, c) => a.an.etaSort - c.an.etaSort);

      const quickRows = analyzed.slice(0, 4).map(({ b, an }) => {
        const urgent = an.etaBadge === 'В ферм-камеру!' || an.etaBadge === 'Готово!' || an.etaBadge === 'Достать?' || an.etaBadge === 'CO₂!';
        return `
          <div class="quick-row" onclick="navigate('detail', '${b.id}')">
            <div style="display:flex;align-items:center;gap:7px;min-width:0;">
              <span style="width:9px;height:9px;border-radius:50%;background:${getPhaseColor(b)};flex-shrink:0;"></span>
              <span style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.title}</span>

            <span class="quick-pill ${urgent ? 'urgent' : ''}">${an.etaBadge}</span>

      const spotLabel = !spot ? 'Пусто'
        : (spot.an.etaBadge === 'В ферм-камеру!' ? 'В ферм-камеру'
          : (spot.b.phase === 'vacuum' ? 'В вакууме'

      const zones = [
        { id: 'all', lbl: `Все (${active.length})` },

      const cardsHtml = filtered.length ? filtered.map(b => {
        const an = analyze(b);

          ? `${an.elapsedDays}д`
          : (b.phase === 'cure' ? `${an.cureDays}д` : (an.lossPct > 0.4 ? `-${an.lossPct.toFixed(0)}%` : `${an.curPhaseDays}д`));
        const sub = an.isPepper
          ? `${PHASES[b.phase].short} · ${an.etaBadge}`
          : `${an.Wcur} г · ${an.etaBadge}`;
        return `

              <div class="card-ring-mini">${ring}</div>
            </div>
            <div class="card-art-slot">${renderArt(b, 'small')}</div>
            <div>
              <div style="font-size:14px;font-weight:800;letter-spacing:-0.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.title}</div>
              <div style="font-size:11px;opacity:0.92;margin-top:2px;font-weight:600;">${sub}</div>
            </div>
          </div>

      }).join('') : `
        <div style="grid-column:1/-1;background:var(--white);border-radius:24px;padding:28px 18px;text-align:center;color:var(--text-sec);">
          <div style="font-weight:700;margin-bottom:4px;">В этой зоне пусто</div>
          <div style="font-size:12px;">Нажми жёлтый «＋» внизу, чтобы добавить партию</div>
        </div>
      `;

      return `
        <header class="home-header">
          <div style="display:flex;align-items:center;gap:11px;">
            <div class="brand-mark">${renderBrandMarkSVG()}</div>

              <div style="font-size:21px;font-weight:800;letter-spacing:-0.03em;">ferment</div>

            </div>
          </div>
          <button class="circle-btn" onclick="openSettings()" aria-label="Настройки">⚙️</button>

        <section class="heute-split">

              </div>
              <span style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--cream-card);">${formatShortDate(daysAgoISO(0))}</span>

            <div>${quickRows || '<div style="font-size:12px;color:var(--text-muted);padding:8px 0;">Нет активных партий</div>'}</div>

        <div class="zone-strip">

    // --- SCREEN 2: DETAIL — ZERO TABS! CHRONOLOGY + ONE LIVE ACTION + EDITABLE LOGS ---
    function buildDetailScreen(batch) {
      if (!batch) return '';
      const an = analyze(batch);
      const loc = LOCATIONS[batch.locId] || LOCATIONS.fridge_12;
      const bg = getPhaseColor(batch);
      const today = daysAgoISO(0);

      const r = 19;
      const c = 2 * Math.PI * r;
      const ringPct = batch.phase === 'cure' ? an.curePct : an.readinessPct;
      const off = c * (1 - ringPct / 100);

      // --- BLOCK A: FULL EDITABLE STAGE CHRONOLOGY ---
      const summaryPills = an.isPepper
        ? `
          <span class="sum-pill">🌶 Всего: ${an.elapsedDays} дн</span>
          <span class="sum-pill">🧂 Соль ${batch.saltPct}% (${an.saltGrams} г)</span>
        `
        : `
          <span class="sum-pill"><span style="width:7px;height:7px;border-radius:50%;background:#8884E6;"></span>Посол: ${an.cureDays} дн</span>
          <span class="sum-pill"><span style="width:7px;height:7px;border-radius:50%;background:#EE9D68;"></span>Ферм. 12°: ${an.dryDays} дн</span>
          <span class="sum-pill"><span style="width:7px;height:7px;border-radius:50%;background:#3B7D71;"></span>Вакуум: ${an.vacDays} дн</span>
        `;

      const timelineRows = batch.phaseHistory.map((h, idx) => {
        const isCurrent = idx === batch.phaseHistory.length - 1;
        const pObj = PHASES[h.phase] || PHASES.dry;
        const days = diffDays(h.startDate, h.endDate || today);
        const dotColor = getPhaseColor(batch, h.phase);

        let titleTxt = pObj.full;
        if (h.phase === 'dry') {
          const mLbl = (DRY_METHODS[h.method || batch.dryMethod] || DRY_METHODS.casing).label;
          const smk = (typeof h.smoked === 'boolean' ? h.smoked : batch.smoked) ? ' · 💨' : '';
          titleTxt = `Ферм-камера 12°C (${mLbl}${smk})`;
        }

        const rangeTxt = h.endDate
          ? `${formatShortDate(h.startDate)} → ${formatShortDate(h.endDate)}`
          : `с ${formatShortDate(h.startDate)} · идёт сейчас`;

        return `
          <div class="tl-row" onclick="openStageEditor('edit', ${idx})">
            <div class="tl-rail">
              <div class="tl-dot ${isCurrent ? 'current' : ''}" style="background:${dotColor};"></div>
              <div class="tl-line"></div>
            </div>

              <div style="min-width:0;">
                <div style="font-size:13px;font-weight:800;line-height:1.2;">${titleTxt}</div>

              </div>
            </div>
          </div>
        `;
      }).join('');

      // --- BLOCK B: ONE CONTEXTUAL LIVE ACTION CARD ---
      let actionCardHtml = '';
      if (an.isPepper && batch.phase !== 'done') {
        actionCardHtml = `
          <div class="vacuum-locked-card" style="background:${batch.phase === 'ferm_vac' ? '#C45249' : '#56794C'};">

    function buildSplineSVG(batch, an) {
      const W = 300, H = 114, padX = 14, padTop = 28, padBot = 12;
      const plotW = W - padX * 2, plotH = H - padTop - padBot;

      const logs = batch.weightLogs;
      const startD = batch.createdAt;
      const lastD = logs[logs.length - 1].date;
      const elapsed = Math.max(1, diffDays(startD, lastD));
      const span = Math.max(elapsed + Math.min(35, an.remDays), 10);

      const pts = logs.map(l => {
        const d = diffDays(startD, l.date);
        const loss = Math.max(0, ((an.W0 - l.weight) / an.W0) * 100);
        const pct = Math.min(105, (loss / Math.max(1, batch.targetLossPct)) * 100);
        return { x: padX + (d / span) * plotW, y: padTop + plotH * (1 - pct / 105) };
      });

      const lastPt = pts[pts.length - 1];
      let dPath = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i], p1 = pts[i + 1];
        const cx = ((p0.x + p1.x) / 2).toFixed(1);
        dPath += ` C ${cx} ${p0.y.toFixed(1)}, ${cx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
      }
      const areaD = pts.length >= 2
        ? `${dPath} L ${lastPt.x.toFixed(1)} ${H - padBot} L ${pts[0].x.toFixed(1)} ${H - padBot} Z`
        : '';

      const showProj = batch.phase !== 'done' && an.remDays > 0 && an.Wcur > an.targetWeight;
      const projX = W - padX, projY = padTop + 4;
      const projD = showProj
        ? `M ${lastPt.x.toFixed(1)} ${lastPt.y.toFixed(1)} Q ${((lastPt.x + projX) / 2).toFixed(1)} ${(lastPt.y - 8).toFixed(1)} ${projX} ${projY}`
        : '';

      const bx = Math.min(W - 34, Math.max(34, lastPt.x));
      const by = Math.max(24, lastPt.y);

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" fill="none">
          <defs>
            <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#D96B68" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#D96B68" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <line x1="${padX}" y1="${padTop + 4}" x2="${W - padX}" y2="${padTop + 4}" stroke="rgba(86,121,76,0.3)" stroke-dasharray="4 4"/>
          ${areaD ? `<path d="${areaD}" fill="url(#wg)"/>` : ''}
          ${projD ? `<path d="${projD}" stroke="#8FB184" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>` : ''}
          <path d="${dPath}" stroke="#C86464" stroke-width="2.6" stroke-linecap="round"/>
          ${showProj ? `<circle cx="${projX}" cy="${projY}" r="4" fill="#8FB184"/>` : ''}
          <circle cx="${lastPt.x.toFixed(1)}" cy="${lastPt.y.toFixed(1)}" r="5" fill="#18191C" stroke="#FFFFFF" stroke-width="2"/>
          <rect x="${(bx - 28).toFixed(1)}" y="${(by - 28).toFixed(1)}" width="56" height="20" rx="10" fill="#18191C"/>
          <text x="${bx.toFixed(1)}" y="${(by - 14.5).toFixed(1)}" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800">−${an.lossPct.toFixed(1)}%</text>
        </svg>
      `;
    }

    // --- SCREEN 3: ARCHIVE & PLANS ---

            ${store.plans.map(p => `

    // =========================================================================
    // 7. CHRONOLOGY STAGE EDITOR & WEIGHT LOG EDITOR (RETROACTIVE DATES!)
    // =========================================================================
    function setInputDateAgo(inputId, daysAgo) {
      document.getElementById(inputId).value = daysAgoISO(daysAgo);
      haptic('light');
    }

    function openStageEditor(mode, index, presetPhase) {
      const b = getSelectedBatch();
      if (!b) return;
      ui.sm.mode = mode;
      ui.sm.index = index;

      const isPepper = b.category === 'pepper';
      const delBtn = document.getElementById('sm-delete-btn');
      const endWrap = document.getElementById('sm-end-wrap');
      const weightWrap = document.getElementById('sm-weight-wrap');

      if (mode === 'edit' && index >= 0 && index < b.phaseHistory.length) {
        const entry = b.phaseHistory[index];
        const isLast = index === b.phaseHistory.length - 1;
        document.getElementById('sm-heading').textContent = 'Изменить этап и даты';
        ui.sm.phase = entry.phase;
        ui.sm.dryMethod = entry.method || b.dryMethod || 'casing';
        ui.sm.smoked = typeof entry.smoked === 'boolean' ? entry.smoked : !!b.smoked;
        document.getElementById('sm-start-date').value = entry.startDate;

        if (!isLast) {
          endWrap.classList.remove('hidden');
          document.getElementById('sm-end-date').value = entry.endDate || daysAgoISO(0);
        } else {
          endWrap.classList.add('hidden');
        }
        weightWrap.classList.add('hidden');
        delBtn.classList.toggle('hidden', b.phaseHistory.length <= 1);
      } else {
        document.getElementById('sm-heading').textContent = 'Перевести на этап';
        // Smart default next stage
        let nextPh = presetPhase;
        if (!nextPh) {
          if (isPepper) nextPh = b.phase === 'done' ? 'ferm_vac' : 'done';
          else if (b.phase === 'cure') nextPh = 'dry';
          else if (b.phase === 'dry') nextPh = 'vacuum';
          else if (b.phase === 'vacuum') nextPh = 'done';
          else nextPh = 'dry';
        }
        ui.sm.phase = nextPh;
        ui.sm.dryMethod = b.dryMethod || getCut(b.cutId).optMethod || 'casing';
        ui.sm.smoked = !!b.smoked;
        document.getElementById('sm-start-date').value = daysAgoISO(0);
        document.getElementById('sm-weight').value = '';
        endWrap.classList.add('hidden');
        weightWrap.classList.toggle('hidden', isPepper);
        delBtn.classList.add('hidden');
      }

      renderStageModalPickers(isPepper);
      document.getElementById('stage-modal').classList.add('open');
      haptic('light');
      syncAndroidBackState();
    }

    function renderStageModalPickers(isPepper) {
      const phases = isPepper ? ['ferm_vac', 'ferm_brine', 'done'] : ['cure', 'dry', 'vacuum', 'done'];
      document.getElementById('sm-phase-grid').innerHTML = phases.map(pId => {
        const p = PHASES[pId];
        return `
          <button type="button" class="stage-pick-card ${ui.sm.phase === pId ? 'selected' : ''}" onclick="selectSmPhase('${pId}', ${isPepper})">
            <span>${p.short}</span>
            <span style="font-size:10.5px;font-weight:600;opacity:0.7;">${p.sub}</span>
          </button>
        `;
      }).join('');

      const showMethod = !isPepper && ui.sm.phase === 'dry';
      document.getElementById('sm-method-wrap').classList.toggle('hidden', !showMethod);
      if (showMethod) {
        document.getElementById('sm-method-chips').innerHTML = Object.values(DRY_METHODS).map(m => `
          <button type="button" class="sub-chip ${ui.sm.dryMethod === m.id ? 'active' : ''}" onclick="selectSmMethod('${m.id}', ${isPepper})">${m.label}</button>
        `).join('') + `<button type="button" class="sub-chip ${ui.sm.smoked ? 'active' : ''}" onclick="toggleSmSmoked(${isPepper})">💨 Копчёное</button>`;
      }
    }

    function selectSmPhase(pId, isPepper) { ui.sm.phase = pId; haptic('light'); renderStageModalPickers(isPepper); }
    function selectSmMethod(mId, isPepper) { ui.sm.dryMethod = mId; haptic('light'); renderStageModalPickers(isPepper); }
    function toggleSmSmoked(isPepper) { ui.sm.smoked = !ui.sm.smoked; haptic('light'); renderStageModalPickers(isPepper); }

    function saveStageEntry() {
      dismissKeyboard();
      const b = getSelectedBatch();
      if (!b) return;
      const startDate = document.getElementById('sm-start-date').value || daysAgoISO(0);

      if (ui.sm.mode === 'edit' && ui.sm.index >= 0) {
        const idx = ui.sm.index;
        const entry = b.phaseHistory[idx];
        entry.phase = ui.sm.phase;
        entry.startDate = startDate;
        if (ui.sm.phase === 'dry') {
          entry.method = ui.sm.dryMethod;
          entry.smoked = ui.sm.smoked;
          b.dryMethod = ui.sm.dryMethod;
          b.smoked = ui.sm.smoked;
        }
        // Keep previous stage's endDate synced to this stage's startDate
        if (idx > 0) {
          b.phaseHistory[idx - 1].endDate = startDate;
        }
        // If user also edited endDate of a middle stage, sync next stage's startDate!
        if (idx < b.phaseHistory.length - 1) {
          const endVal = document.getElementById('sm-end-date').value;
          if (endVal && endVal >= startDate) {
            entry.endDate = endVal;
            b.phaseHistory[idx + 1].startDate = endVal;
          }
        }
        normalizeBatchChronology(b);
        persistStore();
        closeAllModals();
        haptic('success');
        showToast('Хронология обновлена');
        render();
        return;
      }

      // APPEND NEW STAGE (even retroactively!)
      const newEntry = {
        phase: ui.sm.phase,
        startDate,
        endDate: null
      };
      if (ui.sm.phase === 'dry') {
        newEntry.method = ui.sm.dryMethod;
        newEntry.smoked = ui.sm.smoked;
        b.dryMethod = ui.sm.dryMethod;
        b.smoked = ui.sm.smoked;
      }

      b.phaseHistory.push(newEntry);

      // Optional transition weight
      const wVal = parseInt(document.getElementById('sm-weight').value, 10);
      if (!isNaN(wVal) && wVal > 20) {
        b.weightLogs.push({ date: startDate, weight: wVal, phase: ui.sm.phase, note: PHASES[ui.sm.phase].short });
        if (ui.sm.phase === 'dry') b.hangWeight = wVal;
      } else if (ui.sm.phase === 'dry' && b.weightLogs.length) {
        b.hangWeight = b.weightLogs[b.weightLogs.length - 1].weight;
      }

      normalizeBatchChronology(b);
      ui.draftWeight = null;
      persistStore();
      closeAllModals();
      haptic('success');
      showToast(b.phase === 'done' ? 'Готово! Кусок в Архиве' : `Этап: ${PHASES[b.phase].full}`);
      render();
    }

    function deleteStageEntry() {
      const b = getSelectedBatch();
      if (!b || b.phaseHistory.length <= 1 || ui.sm.index < 0) return;
      if (!confirm('Удалить этот этап из хронологии?')) return;
      b.phaseHistory.splice(ui.sm.index, 1);
      normalizeBatchChronology(b);
      ui.draftWeight = null;
      persistStore();
      closeAllModals();
      haptic('medium');
      showToast('Этап удалён');
      render();
    }

    // --- WEIGHT LOG EDITOR (EDIT ANY PAST LOG OR ADD RETROACTIVE LOG) ---
    function openWeightLogEditor(idx) {
      const b = getSelectedBatch();
      if (!b) return;
      ui.lm.index = idx;
      const delBtn = document.getElementById('lm-delete-btn');

      if (idx >= 0 && idx < b.weightLogs.length) {
        const log = b.weightLogs[idx];
        document.getElementById('lm-weight').value = log.weight;
        document.getElementById('lm-date').value = log.date;
        document.getElementById('lm-note').value = log.note || '';
        delBtn.classList.toggle('hidden', b.weightLogs.length <= 1);
      } else {
        const an = analyze(b);
        document.getElementById('lm-weight').value = an.Wcur;
        document.getElementById('lm-date').value = daysAgoISO(1);
        document.getElementById('lm-note').value = '';
        delBtn.classList.add('hidden');
      }
      document.getElementById('log-modal').classList.add('open');
      haptic('light');
      syncAndroidBackState();
    }

    function saveWeightLogModal() {
      dismissKeyboard();
      const b = getSelectedBatch();
      if (!b) return;
      const w = parseInt(document.getElementById('lm-weight').value, 10);
      const d = document.getElementById('lm-date').value || daysAgoISO(0);
      const note = document.getElementById('lm-note').value.trim();
      if (isNaN(w) || w < 20) return;

      if (ui.lm.index >= 0 && ui.lm.index < b.weightLogs.length) {
        b.weightLogs[ui.lm.index].weight = w;
        b.weightLogs[ui.lm.index].date = d;
        b.weightLogs[ui.lm.index].note = note;
        if (ui.lm.index === 0) b.initialWeight = w;
      } else {
        b.weightLogs.push({ date: d, weight: w, phase: b.phase, note });
      }

      b.weightLogs.sort((x, y) => x.date.localeCompare(y.date));
      ui.draftWeight = null;
      persistStore();
      closeAllModals();
      haptic('success');
      showToast('Замер сохранён');
      render();
    }

    function deleteWeightLogModal() {
      const b = getSelectedBatch();
      if (!b || b.weightLogs.length <= 1 || ui.lm.index < 0) return;
      b.weightLogs.splice(ui.lm.index, 1);
      ui.draftWeight = null;
      persistStore();
      closeAllModals();
      haptic('light');
      showToast('Замер удалён');
      render();
    }

    // =========================================================================
    // 8. QUICK INTERACTIONS ON DETAIL SCREEN
    // =========================================================================
    function setZoneFilter(z) { ui.zoneFilter = z; haptic('light'); render(); }
    function setArchiveTab(t) { ui.archiveTab = t; haptic('light'); render(); }
    function toggleMetricMode() { ui.metricMode = ui.metricMode === 'readiness' ? 'loss' : 'readiness'; haptic('light'); render(); }

    function onWeighDatePick(isoVal) {
      if (!isoVal) return;
      ui.weighDateISO = isoVal;
      haptic('light');
      render();
    }

    function flipLocation(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      if (b.category === 'pepper') {
        b.locId = b.locId === 'room_22' ? 'fridge_12' : (b.locId === 'fridge_12' ? 'fridge_3' : 'room_22');
      } else {
        b.locId = b.locId === 'fridge_3' ? 'fridge_12' : 'fridge_3';
      }
      persistStore();
      haptic('light');
      showToast(LOCATIONS[b.locId].label);
      render();
    }

    function onArcWeightInput(val) {
      const n = parseInt(val, 10);
      if (isNaN(n)) return;
      ui.draftWeight = n;
      const b = getSelectedBatch();
      if (!b) return;
      const an = analyze(b);
      const loss = Math.max(0, ((an.W0 - n) / an.W0) * 100).toFixed(1);
      const badge = document.getElementById('arc-loss-badge');
      if (badge) badge.textContent = `-${loss}%`;
    }

    function stepDraftWeight(delta) {
      const b = getSelectedBatch();
      if (!b) return;
      ui.draftWeight = Math.max(20, (ui.draftWeight || b.initialWeight) + delta);
      haptic('light');
      const inp = document.getElementById('arc-weight-input');
      if (inp) { inp.value = ui.draftWeight; onArcWeightInput(ui.draftWeight); }
      else render();
    }

    function commitWeighIn(batchId) {
      dismissKeyboard();
      const b = store.batches.find(x => x.id === batchId);
      if (!b || b.phase !== 'dry') return;
      const val = parseInt(ui.draftWeight, 10);
      if (isNaN(val) || val < 20) return;

      const d = ui.weighDateISO || daysAgoISO(0);
      b.weightLogs.push({ date: d, weight: val, phase: 'dry', note: '' });
      b.weightLogs.sort((a, c) => a.date.localeCompare(c.date));
      ui.draftWeight = null;
      ui.weighDateISO = daysAgoISO(0);
      persistStore();
      haptic('success');
      showToast(`Записано: ${val} г (${formatShortDate(d)})`);
      render();
    }

    function setVerdict(batchId, v) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.verdict = b.verdict === v ? '' : v;
      persistStore();
      haptic('light');
      render();
    }

    function saveTastingNote(batchId, txt) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.tastingNote = txt.trim();
      persistStore();
      showToast('Вывод сохранён');
    }

    function togglePepperGas(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      b.puffed = !b.puffed;
      if (!b.puffed) b.degasCount = (b.degasCount || 0) + 1;
      persistStore();
      haptic('success');
      showToast(b.puffed ? 'Отмечено вздутие CO₂' : 'CO₂ стравлен!');
      render();
    }

    function promptPepperPh(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      const v = prompt('Введи текущий pH перцев (напр. 3.6):', String(b.phValue || 3.8));
      const n = parseFloat((v || '').replace(',', '.'));
      if (!isNaN(n) && n > 1 && n < 9) {
        b.phValue = Math.round(n * 10) / 10;
        persistStore();
        render();
      }
    }

    // Plans & Settings
    function addPlanIdea() {
      const t = prompt('Что планируешь заложить?', 'Вяленая говядина (бастурма)');
      if (!t || !t.trim()) return;
      store.plans.unshift({ id: 'plan-' + Date.now(), title: t.trim(), category: 'meat', cutId: 'beef_bresaola', estWeight: 1000, note: 'Идея из планов' });
      persistStore();
      haptic('light');
      render();
    }
    function deletePlan(id) { store.plans = store.plans.filter(p => p.id !== id); persistStore(); render(); }
    function launchPlan(id) {
      const p = store.plans.find(x => x.id === id);
      if (!p) return;
      openPassportModal({ mode: 'new', category: p.category || 'meat', presetCut: p.cutId, presetTitle: p.title, presetWeight: p.estWeight, fromPlanId: id });
    }

    function openSettings() {
      document.getElementById('loss-base-btn').textContent = store.settings.lossBase === 'raw' ? 'От сырого' : 'От навески';
      document.getElementById('settings-modal').classList.add('open');
      haptic('light');
      syncAndroidBackState();
    }
    function toggleLossBase() {
      store.settings.lossBase = store.settings.lossBase === 'raw' ? 'hang' : 'raw';
      document.getElementById('loss-base-btn').textContent = store.settings.lossBase === 'raw' ? 'От сырого' : 'От навески';
      persistStore();
      haptic('light');
      render();
    }
    function exportBackup() {
      const txt = JSON.stringify(store, null, 2);
      if (hasAndroid && window.AndroidBridge.shareText) window.AndroidBridge.shareText('Бэкап ferment', txt);
      else showToast('Бэкап готов');
    }
    function reimportSousChef() {
      if (!confirm('Восстановить исходные партии из архива «Су Шеф»?')) return;
      store = createSousChefSeed();
      ui.selectedId = store.batches[0].id;
      persistStore();
      closeAllModals();
      showToast('Архив «Су Шеф» загружен');
      navigate('home');
    }
    function clearAllData() {
      if (!confirm('Удалить все партии и планы?')) return;
      store.batches = [];
      store.plans = [];
      ui.selectedId = null;
      persistStore();
      closeAllModals();
      showToast('Очищено');
      navigate('home');
    }

    // =========================================================================
    // 9. CLEAN PASSPORT MODAL (ADD NEW OR EDIT BASIC PASSPORT)
    // =========================================================================
    function buildMeatOptions(sel) {
      const groups = {};
      Object.entries(MEAT_CATALOG).forEach(([id, it]) => {
        if (!groups[it.group]) groups[it.group] = [];
        groups[it.group].push({ id, ...it });
      });
      return Object.entries(groups).map(([g, arr]) => `
        <optgroup label="${g}">
          ${arr.map(it => `<option value="${it.id}" ${it.id === sel ? 'selected' : ''}>${it.label}</option>`).join('')}
        </optgroup>
      `).join('');
    }

    function openPassportModal(opts) {
      const o = opts || {};
      ui.pm.editingId = o.editId || null;
      ui.pm.fromPlanId = o.fromPlanId || null;

      const isEdit = !!ui.pm.editingId;
      document.getElementById('pm-cat-bar').classList.toggle('hidden', isEdit);
      document.getElementById('pm-initial-stage-section').classList.toggle('hidden', isEdit);
      document.getElementById('pm-delete-btn').classList.toggle('hidden', !isEdit);

      if (isEdit) {
        const b = store.batches.find(x => x.id === ui.pm.editingId);
        if (!b) return;
        document.getElementById('pm-heading').textContent = 'Паспорт куска';
        ui.pm.category = b.category;
        populatePmCutDropdown(b.cutId);
        document.getElementById('pm-title').value = b.title;
        document.getElementById('pm-weight').value = b.initialWeight;
        document.getElementById('pm-target').value = b.category === 'pepper' ? (b.targetDays || 21) : (b.targetLossPct || 34);
        document.getElementById('pm-notes').value = b.notes || '';
        refreshPmHint();
      } else {
        document.getElementById('pm-heading').textContent = 'Новая закладка';
        ui.pm.category = o.category === 'pepper' ? 'pepper' : 'meat';
        ui.pm.phase = ui.pm.category === 'pepper' ? 'ferm_vac' : 'cure';
        ui.pm.dryMethod = 'casing';
        ui.pm.smoked = false;

        document.getElementById('pm-cat-meat').classList.toggle('active', ui.pm.category === 'meat');
        document.getElementById('pm-cat-pepper').classList.toggle('active', ui.pm.category === 'pepper');
        populatePmCutDropdown(o.presetCut);
        document.getElementById('pm-title').value = o.presetTitle || '';
        document.getElementById('pm-weight').value = o.presetWeight || (ui.pm.category === 'pepper' ? 600 : 1200);
        document.getElementById('pm-start-date').value = daysAgoISO(0);
        document.getElementById('pm-cur-weight').value = '';
        document.getElementById('pm-notes').value = '';
        onPmCutChange();
      }

      document.getElementById('passport-modal').classList.add('open');
      document.getElementById('passport-panel').scrollTop = 0;
      haptic('light');
      syncAndroidBackState();
    }

    function populatePmCutDropdown(sel) {
      const cutSel = document.getElementById('pm-cut');
      if (ui.pm.category === 'meat') {
        document.getElementById('pm-cut-lbl').textContent = 'Отруб / вид мяса';
        document.getElementById('pm-target-lbl').textContent = 'Цель усушки (%)';
        cutSel.innerHTML = buildMeatOptions(sel || 'pork_coppa');
      } else {
        document.getElementById('pm-cut-lbl').textContent = 'Способ ферментации';
        document.getElementById('pm-target-lbl').textContent = 'Срок (дн)';
        cutSel.innerHTML = Object.entries(PEPPER_CATALOG).map(([id, p]) => `<option value="${id}" ${id===sel?'selected':''}>${p.label}</option>`).join('');
      }
    }

    function setPmCat(cat) {
      ui.pm.category = cat;
      ui.pm.phase = cat === 'pepper' ? 'ferm_vac' : 'cure';
      document.getElementById('pm-cat-meat').classList.toggle('active', cat === 'meat');
      document.getElementById('pm-cat-pepper').classList.toggle('active', cat === 'pepper');
      document.getElementById('pm-weight').value = cat === 'pepper' ? 600 : 1200;
      haptic('light');
      populatePmCutDropdown();
      onPmCutChange();
    }

    function renderPmPhasePicker() {
      const isMeat = ui.pm.category === 'meat';
      const phases = isMeat ? ['cure', 'dry', 'vacuum'] : ['ferm_vac', 'ferm_brine'];
      document.getElementById('pm-phase-grid').style.gridTemplateColumns = isMeat ? 'repeat(3, 1fr)' : '1fr 1fr';
      document.getElementById('pm-phase-grid').innerHTML = phases.map(pId => {
        const p = PHASES[pId];
        return `
          <button type="button" class="stage-pick-card ${ui.pm.phase === pId ? 'selected' : ''}" style="padding:9px 8px;text-align:center;align-items:center;" onclick="selectPmPhase('${pId}')">
            <span>${p.short}</span>
          </button>
        `;
      }).join('');

      document.getElementById('pm-dry-method-wrap').classList.toggle('hidden', !(isMeat && ui.pm.phase === 'dry'));
      document.getElementById('pm-brine-wrap').classList.toggle('hidden', !(!isMeat && ui.pm.phase === 'ferm_brine'));
      document.getElementById('pm-cur-w-wrap').classList.toggle('hidden', !isMeat);

      if (isMeat && ui.pm.phase === 'dry') {
        document.getElementById('pm-dry-chips').innerHTML = Object.values(DRY_METHODS).map(m => `
          <button type="button" class="sub-chip ${ui.pm.dryMethod === m.id ? 'active' : ''}" onclick="selectPmDryMethod('${m.id}')">${m.label}</button>
        `).join('') + `<button type="button" class="sub-chip ${ui.pm.smoked ? 'active' : ''}" onclick="togglePmSmoked()">💨 Копчёное</button>`;
      }
    }

    function selectPmPhase(p) { ui.pm.phase = p; haptic('light'); renderPmPhasePicker(); refreshPmHint(); }
    function selectPmDryMethod(m) { ui.pm.dryMethod = m; haptic('light'); renderPmPhasePicker(); }
    function togglePmSmoked() { ui.pm.smoked = !ui.pm.smoked; haptic('light'); renderPmPhasePicker(); }

    function onPmCutChange() {
      const val = document.getElementById('pm-cut').value;
      if (ui.pm.category === 'meat') {
        const cut = getCut(val);
        document.getElementById('pm-target').value = cut.optLoss;
        document.getElementById('pm-title').placeholder = cut.defTitle;
        ui.pm.dryMethod = cut.optMethod;
      } else {
        const p = PEPPER_CATALOG[val] || PEPPER_CATALOG.pepper_vac;
        document.getElementById('pm-target').value = p.targetDays;
        document.getElementById('pm-brine').value = p.defBrine;
        document.getElementById('pm-title').placeholder = p.defTitle;
        ui.pm.phase = p.optPhase;
      }
      renderPmPhasePicker();
      refreshPmHint();
    }

    function refreshPmHint() {
      const box = document.getElementById('pm-opt-hint');
      const w = parseInt(document.getElementById('pm-weight').value, 10) || 1000;
      const tVal = parseInt(document.getElementById('pm-target').value, 10) || 34;

      if (ui.pm.category === 'meat') {
        const cut = getCut(document.getElementById('pm-cut').value);
        const saltTotal = (w * cut.saltPct / 100).toFixed(1);
        const finW = Math.round(w * (1 - tVal / 100));
        box.innerHTML = `<b>✨ Оптимально: −${cut.optLoss}% · ${(DRY_METHODS[cut.optMethod] || DRY_METHODS.casing).label}</b> · посол ~${cut.cureDays}д<br/>🧂 Соль ${cut.saltPct}%: <b>${saltTotal} г</b> · Готовый вес: <b>${finW} г</b>`;
      } else {
        const p = PEPPER_CATALOG[document.getElementById('pm-cut').value] || PEPPER_CATALOG.pepper_vac;
        const brine = ui.pm.phase === 'ferm_brine' ? (parseInt(document.getElementById('pm-brine').value, 10) || 0) : 0;
        const pct = ui.pm.phase === 'ferm_brine' ? 3.5 : p.saltPct;
        const saltG = ((w + brine) * pct / 100).toFixed(1);
        box.innerHTML = `<b>🌶 Оптимально: ${pct}% соли · ${p.targetDays} дн</b><br/>🧂 Соль на ${w + brine} г: <b>${saltG} г</b> неиодированной соли`;
      }
    }

    function savePassportModal() {
      dismissKeyboard();
      const cat = ui.pm.category;
      const cutId = document.getElementById('pm-cut').value;
      const cutObj = cat === 'meat' ? getCut(cutId) : (PEPPER_CATALOG[cutId] || PEPPER_CATALOG.pepper_vac);
      const title = document.getElementById('pm-title').value.trim() || cutObj.defTitle;
      const w = Math.max(40, parseInt(document.getElementById('pm-weight').value, 10) || 1000);
      const targetVal = Math.max(1, parseInt(document.getElementById('pm-target').value, 10) || 34);
      const notes = document.getElementById('pm-notes').value.trim();

      if (ui.pm.editingId) {
        const b = store.batches.find(x => x.id === ui.pm.editingId);
        if (b) {
          b.cutId = cutId;
          b.title = title;
          b.initialWeight = w;
          if (b.weightLogs.length) b.weightLogs[0].weight = w;
          if (cat === 'meat') b.targetLossPct = targetVal;
          else b.targetDays = targetVal;
          b.notes = notes;
        }
        persistStore();
        closeAllModals();
        ui.draftWeight = null;
        haptic('success');
        showToast('Паспорт сохранён');
        render();
        return;
      }

      const today = daysAgoISO(0);
      const startDate = document.getElementById('pm-start-date').value || today;
      const brine = cat === 'pepper' && ui.pm.phase === 'ferm_brine' ? Math.max(0, parseInt(document.getElementById('pm-brine').value, 10) || 0) : 0;

      const firstEntry = { phase: ui.pm.phase, startDate, endDate: null };
      if (ui.pm.phase === 'dry') {
        firstEntry.method = ui.pm.dryMethod;
        firstEntry.smoked = ui.pm.smoked;
      }
      const weightLogs = [{ date: startDate, weight: w, phase: ui.pm.phase, note: 'Старт' }];

      if (cat === 'meat') {
        const curW = parseInt(document.getElementById('pm-cur-weight').value, 10);
        if (!isNaN(curW) && curW > 20 && curW !== w) {
          weightLogs.push({ date: today, weight: curW, phase: ui.pm.phase, note: 'Вес при добавлении' });
        }
      }

      const id = 'b-' + Date.now();
      const newBatch = {
        id,
        category: cat,
        title,
        cutId,
        initialWeight: w,
        hangWeight: w,
        brineWater: brine,
        targetLossPct: cat === 'meat' ? targetVal : 0,
        targetDays: cat === 'pepper' ? targetVal : 0,
        phase: ui.pm.phase,
        dryMethod: ui.pm.dryMethod,
        smoked: ui.pm.smoked,
        locId: cat === 'pepper' ? 'room_22' : (ui.pm.phase === 'dry' && ui.pm.dryMethod !== 'membrane' ? 'fridge_12' : 'fridge_3'),
        saltPct: cat === 'meat' ? cutObj.saltPct : (ui.pm.phase === 'ferm_brine' ? 3.5 : cutObj.saltPct),
        puffed: false,
        degasCount: 0,
        phValue: 4.0,
        createdAt: startDate,
        notes,
        verdict: '',
        tastingNote: '',
        phaseHistory: [firstEntry],
        weightLogs
      };
      normalizeBatchChronology(newBatch);
      store.batches.unshift(newBatch);

      if (ui.pm.fromPlanId) {
        store.plans = store.plans.filter(p => p.id !== ui.pm.fromPlanId);
      }

      ui.selectedId = id;
      ui.draftWeight = null;
      ui.zoneFilter = 'all';
      persistStore();
      closeAllModals();
      haptic('success');
      showToast(`Добавлено: «${title}»`);
      navigate('detail', id);
    }

    function deleteEditingBatch() {
      if (!ui.pm.editingId || !confirm('Удалить эту партию навсегда?')) return;
      store.batches = store.batches.filter(x => x.id !== ui.pm.editingId);
      ui.selectedId = store.batches.length ? store.batches[0].id : null;
      persistStore();
      closeAllModals();
      haptic('medium');
      showToast('Удалено');
      navigate('home');
    }

    // Boot
    loadStore();
    ui.selectedId = store.batches.length ? store.batches[0].id : null;
    ui.weighDateISO = daysAgoISO(0);
    render();
  </script>
</body>
</html>
