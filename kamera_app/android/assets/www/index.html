<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>КАМЕРА</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', 'Roboto Mono', ui-monospace, monospace;

      --safe-top: 0px;
      --safe-bottom: 0px;

      /* Signature Pastel Palette */
      --ink: #18191C;
      --ink-soft: #2A2C32;
      --text-sec: #686662;
      --text-muted: #98938A;

      --cream-bg: #FAF8F1;
      --cream-card: #F3EFE4;
      --cream-warm: #F5E9DC;
      --white: #FFFFFF;

      --coral: #EA7B72;
      --coral-deep: #C45249;
      --apricot: #EE9D68;
      --apricot-deep: #C8713B;
      --sage: #8FB184;
      --sage-deep: #56794C;
      --teal: #3B7D71;
      --teal-deep: #295D53;
      --butter: #F5D547;
      --butter-soft: #FCF6D8;
      --mustard: #EDA944;
      --lavender: #8884E6;
      --lavender-deep: #5B57B8;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--cream-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    input, select, textarea {
      user-select: text;
      font-family: var(--font-sans);
    }

    .app-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--cream-bg);
    }

    .screen-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(114px + var(--safe-bottom));
    }

    body.kb-open .screen-viewport {
      padding-bottom: 120px;
    }

    .screen-viewport::-webkit-scrollbar { width: 0; height: 0; }

    /* COMMON BUTTONS */
    .circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(24, 25, 28, 0.08);
      background: var(--white);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.14s var(--ease);
    }
    .circle-btn:active { transform: scale(0.92); }
    .circle-btn.on-pastel {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.28);
      color: var(--white);
    }

    .btn-butter {
      border: none;
      background: var(--butter);
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 800;
      padding: 13px 20px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 6px 18px rgba(245, 213, 71, 0.35);
      transition: transform 0.14s var(--ease);
    }
    .btn-butter:active { transform: scale(0.96); }

    .btn-ink {
      border: none;
      background: var(--ink);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      padding: 13px 18px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.14s var(--ease);
    }
    .btn-ink:active { transform: scale(0.96); }

    /* =====================================================================
       SCREEN 1: HOME (ПОГРЕБ)
       ===================================================================== */
    .home-header {
      padding: calc(14px + var(--safe-top)) 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .avatar-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--butter);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      border: 2.5px solid var(--white);
      box-shadow: 0 5px 14px rgba(24, 25, 28, 0.08);
      flex-shrink: 0;
    }

    .heute-split {
      margin: 4px 18px 16px;
      background: var(--white);
      border-radius: 26px;
      display: grid;
      grid-template-columns: 1fr 110px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(24, 25, 28, 0.05);
    }

    .heute-left {
      padding: 15px 14px 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .heute-right {
      background: var(--butter);
      padding: 14px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .heute-right:active { filter: brightness(0.95); }

    .quick-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 0;
      font-size: 12.5px;
      cursor: pointer;
    }

    .quick-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid rgba(24, 25, 28, 0.13);
      background: var(--cream-bg);
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }
    .quick-pill.ready {
      background: #E4F2E1;
      border-color: #8FB184;
      color: #3E6634;
    }

    .zone-strip {
      padding: 0 18px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 14px;
    }
    .zone-strip::-webkit-scrollbar { display: none; }

    .zone-chip {
      border: none;
      background: var(--white);
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 99px;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.18s var(--ease);
    }
    .zone-chip.active {
      background: var(--ink);
      color: var(--white);
    }

    .section-row {
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
    }

    .pastel-grid {
      padding: 0 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .pastel-card {
      border-radius: 26px;
      padding: 13px 13px 14px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 184px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(24, 25, 28, 0.08);
      transition: transform 0.16s var(--ease);
    }
    .pastel-card:active { transform: scale(0.97); }

    .card-ring-mini {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      font-family: var(--font-mono);
    }

    .card-art-slot {
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    /* BEAUTIFUL EMPTY STATE CARD */
    .empty-hero-card {
      margin: 8px 18px 16px;
      border-radius: 30px;
      background: linear-gradient(155deg, #EE9D68 0%, #EA7B72 100%);
      color: var(--white);
      padding: 24px 20px 22px;
      text-align: center;
      box-shadow: 0 14px 32px rgba(234, 123, 114, 0.25);
    }

    .empty-actions-card {
      margin: 0 18px;
      background: var(--white);
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 10px 28px rgba(24, 25, 28, 0.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* =====================================================================
       SCREEN 2: FULL-BLEED PASTEL HERO + ARC WEIGH-IN DIAL
       ===================================================================== */
    .detail-hero {
      padding: calc(12px + var(--safe-top)) 18px 26px;
      color: var(--white);
      min-height: 274px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.35s var(--ease);
      position: relative;
    }

    .detail-sheet {
      background: var(--white);
      border-radius: 30px 30px 0 0;
      margin-top: -20px;
      position: relative;
      z-index: 3;
      padding: 18px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stage-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stage-pill {
      border: 1.5px solid rgba(24, 25, 28, 0.16);
      background: transparent;
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.16s var(--ease);
    }
    .stage-pill:active { transform: scale(0.95); }
    .stage-pill.active-yellow {
      background: var(--butter);
      border-color: var(--butter);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(245, 213, 71, 0.4);
    }

    .meta-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(24, 25, 28, 0.06);
    }

    .meta-cell {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 14px;
      background: var(--cream-bg);
    }
    .meta-cell.clickable { cursor: pointer; }
    .meta-cell.clickable:active { transform: scale(0.97); }

    .meta-ico {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .diag-banner {
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(24, 25, 28, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }

    /* LAYERED MUSTARD + TEAL ARC DIAL */
    .arc-dial-card {
      border-radius: 28px;
      background: var(--mustard);
      overflow: hidden;
      padding-top: 12px;
      color: var(--white);
      box-shadow: 0 12px 28px rgba(59, 125, 113, 0.18);
    }

    .arc-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px 10px;
    }

    .arc-chip-btn {
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 99px;
      cursor: pointer;
    }

    .arc-teal-body {
      background: var(--teal);
      border-radius: 50% 50% 0 0 / 38px 38px 0 0;
      padding: 14px 14px 18px;
      text-align: center;
    }

    .weight-inline-input {
      width: 118px;
      background: rgba(255, 255, 255, 0.16);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 14px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 23px;
      font-weight: 800;
      text-align: center;
      padding: 5px 8px;
      outline: none;
    }
    .weight-inline-input:focus {
      background: rgba(255, 255, 255, 0.26);
      border-color: var(--butter);
    }

    .arc-steppers {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 12px;
    }

    .teal-step-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .teal-step-btn:active { background: rgba(255, 255, 255, 0.34); }

    .teal-save-btn {
      height: 44px;
      padding: 0 17px;
      border-radius: 99px;
      border: 3.5px solid rgba(255, 255, 255, 0.25);
      background: var(--cream-bg);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }
    .teal-save-btn:active { transform: scale(0.96); }

    /* =====================================================================
       SCREEN 3: ANALYTICS ("78% LEARNING PLAN" + WAVE + CAPSULES)
       ===================================================================== */
    .analytics-wrap {
      padding: calc(14px + var(--safe-top)) 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .capsules-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-cap {
      background: var(--cream-card);
      border-radius: 28px;
      padding: 12px 8px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-cap-ico {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      margin-bottom: 7px;
    }

    .stat-cap-num {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-family: var(--font-mono);
    }

    .stat-cap-lbl {
      font-size: 10.5px;
      color: var(--text-sec);
      font-weight: 600;
      margin-top: 2px;
    }

    .giant-pct-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
    }

    .giant-num {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.94;
    }

    .wave-card {
      background: var(--white);
      border-radius: 26px;
      padding: 15px 14px 13px;
      box-shadow: 0 8px 24px rgba(24, 25, 28, 0.045);
    }

    .month-pills-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      gap: 4px;
    }

    .m-pill {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sec);
      padding: 4px 8px;
      border-radius: 99px;
      border: 1.5px solid transparent;
      white-space: nowrap;
    }
    .m-pill.active-ring {
      border-color: var(--ink);
      color: var(--ink);
      font-weight: 800;
    }

    .caps-bar-card {
      background: var(--cream-warm);
      border-radius: 26px;
      padding: 16px;
    }

    .caps-stage {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      align-items: end;
      height: 118px;
      padding-top: 8px;
    }

    .v-bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      height: 100%;
      justify-content: flex-end;
    }

    .v-bar-pill {
      width: 34px;
      border-radius: 99px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 6px;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--white);
      transition: height 0.35s var(--ease);
    }

    .journal-card {
      background: var(--white);
      border-radius: 24px;
      padding: 15px;
      box-shadow: 0 6px 20px rgba(24, 25, 28, 0.04);
    }

    .journal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(24, 25, 28, 0.06);
      font-size: 12.5px;
    }
    .journal-item:last-child { border-bottom: none; }

    /* =====================================================================
       SCREEN 4: SIMULATOR & SETTINGS
       ===================================================================== */
    .sim-card {
      background: var(--white);
      border-radius: 26px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(24, 25, 28, 0.045);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input[type="range"].craft-range {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 99px;
      background: var(--cream-card);
      outline: none;
    }
    input[type="range"].craft-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      border: 3px solid var(--butter);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    /* FLOATING BLACK BOTTOM DOCK — 4 CLEAN ITEMS (NO SCALES TAB!) */
    .bottom-dock {
      position: fixed;
      bottom: calc(14px + var(--safe-bottom));
      left: 24px;
      right: 24px;
      max-width: 390px;
      margin: 0 auto;
      height: 60px;
      background: var(--ink);
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 12px;
      box-shadow: 0 14px 32px rgba(24, 25, 28, 0.28);
      z-index: 40;
      transition: transform 0.2s var(--ease), opacity 0.2s;
    }

    /* Hide bottom dock when soft keyboard is open so it never floats over inputs! */
    body.kb-open .bottom-dock {
      transform: translateY(100px);
      opacity: 0;
      pointer-events: none;
    }

    .dock-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s var(--ease);
    }
    .dock-btn.active {
      background: rgba(255, 255, 255, 0.17);
      color: var(--white);
    }

    .dock-fab {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--butter);
      color: var(--ink);
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 213, 71, 0.42);
    }
    .dock-fab:active { transform: scale(0.92); }

    /* FLOATING "СКРЫТЬ КЛАВИАТУРУ" BAR (appears whenever keyboard/input is focused!) */
    .kb-dismiss-bar {
      position: fixed;
      right: 14px;
      bottom: 10px;
      z-index: 300;
      display: none;
    }
    body.kb-open .kb-dismiss-bar {
      display: flex;
    }
    .kb-dismiss-btn {
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      background: var(--ink);
      color: var(--white);
      font-size: 12.5px;
      font-weight: 800;
      padding: 9px 16px;
      border-radius: 99px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .kb-dismiss-btn:active { transform: scale(0.95); }

    /* MODAL BOTTOM SHEET */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 25, 28, 0.5);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 120;
    }
    .sheet-backdrop.open { display: flex; }

    .sheet-panel {
      width: 100%;
      max-width: 500px;
      max-height: 92%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--cream-bg);
      border-radius: 30px 30px 0 0;
      padding: 18px 18px calc(26px + var(--safe-bottom));
      animation: slideUp 0.24s var(--ease);
    }

    body.kb-open .sheet-panel {
      max-height: 98%;
      padding-bottom: 120px;
    }

    @keyframes slideUp {
      from { transform: translateY(32px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .seg-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      background: var(--cream-card);
      padding: 4px;
      border-radius: 99px;
      margin-bottom: 14px;
    }
    .seg-opt {
      border: none;
      background: transparent;
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 700;
      padding: 9px 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.18s var(--ease);
    }
    .seg-opt.active {
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 3px 10px rgba(24, 25, 28, 0.16);
    }

    .loc-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .loc-btn {
      flex: 1;
      min-width: 128px;
      border: 1.5px solid rgba(24, 25, 28, 0.12);
      background: var(--white);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      padding: 11px 12px;

    window.__setAndroidInsets = function(topDp, bottomDp, imeDp) {
      document.documentElement.style.setProperty('--safe-top', Math.max(0, topDp || 0) + 'px');
      document.documentElement.style.setProperty('--safe-bottom', Math.max(0, bottomDp || 0) + 'px');
      currentImeDp = imeDp || 0;
      const isKb = currentImeDp > 40 || isTextFieldFocused();
      document.body.classList.toggle('kb-open', isKb);
      if (currentImeDp > 40) {
        scrollActiveInputIntoView();
      }
    };

    function isTextFieldFocused() {
      const el = document.activeElement;
      if (!el) return false;
      return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA';
    }

    function scrollActiveInputIntoView() {
      const el = document.activeElement;
      if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
      setTimeout(() => {
        try {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (e) {}
      }, 220);
    }

    function dismissKeyboard() {
      const el = document.activeElement;
      if (el && typeof el.blur === 'function') el.blur();
      document.body.classList.remove('kb-open');
      if (hasAndroid && window.AndroidBridge.hideKeyboard) {
        try { window.AndroidBridge.hideKeyboard(); } catch (e) {}
      }
    }

    document.addEventListener('focusin', (ev) => {
      const tag = ev.target && ev.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        document.body.classList.add('kb-open');
        scrollActiveInputIntoView();
      }
    });

    document.addEventListener('focusout', () => {
      setTimeout(() => {
        if (!isTextFieldFocused() && currentImeDp <= 40) {
          document.body.classList.remove('kb-open');
        }
      }, 140);
    });

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' && isTextFieldFocused()) {
        ev.preventDefault();
        dismissKeyboard();
      }
    });

    // Tap empty background to close keyboard cleanly

      if (!isTextFieldFocused()) return;
      const t = ev.target;
      if (!t.closest('input, textarea, select, button, .kb-dismiss-btn')) {
        dismissKeyboard();
      }
    });

      if (hasAndroid && window.AndroidBridge.haptic) {

    const MONTHS_RU = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    const OLD_DEMO_IDS = new Set(['coppa-1', 'bresaola-2', 'habanero-vac', 'jalapeno-brine', 'pancetta-3']);

    function daysAgoISO(daysAgo) {
      const d = new Date(Date.now() - daysAgo * 86400000);
      return d.toISOString().slice(0, 10);
    }

    function formatShortDate(iso) {
      if (!iso) return 'Сегодня';
      const p = iso.split('-');
      if (p.length !== 3) return iso;
      return `${parseInt(p[2], 10)} ${MONTHS_RU[parseInt(p[1], 10) - 1] || ''}`;
    }

    function diffDays(isoStart, isoEnd) {
      const a = new Date(isoStart + 'T12:00:00').getTime();
      const b = new Date((isoEnd || daysAgoISO(0)) + 'T12:00:00').getTime();
      return Math.max(0, Math.round((b - a) / 86400000));
    }

    // =========================================================================

    let store = null;

    function createEmptyStore() {
      return {

    function loadStore() {
      let raw = '';
      if (hasAndroid && window.AndroidBridge.loadState) {
        try { raw = window.AndroidBridge.loadState(); } catch (e) {}
      }
      if (!raw) {
        try { raw = localStorage.getItem('kamera_store_v1') || ''; } catch (e) {}
      }
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.batches)) {
            store = parsed;
            if (!store.settings) store.settings = { lossBase: 'raw' };
            // Migrate v0.1 -> v0.2: automatically strip the 5 preloaded demo pieces
            if (store.schemaVersion !== 2) {
              store.batches = store.batches.filter(b => !OLD_DEMO_IDS.has(b.id));
              store.schemaVersion = 2;
              persistStore();
            }
            return;
          }
        } catch (e) {}
      }
      store = createEmptyStore();
      persistStore();
    }

    function persistStore() {
      const json = JSON.stringify(store);
      try { localStorage.setItem('kamera_store_v1', json); } catch (e) {}

    // =========================================================================
    // 4. FICK'S LAW DRYING ENGINE & SMART ETA
    // =========================================================================
    function resolveCut(meatType) {
      if (MEAT_CATALOG[meatType]) return MEAT_CATALOG[meatType];
      // Legacy v0.1 mappings
      if (meatType === 'pork_marbled') return MEAT_CATALOG.pork_coppa;
      if (meatType === 'pork_lean') return MEAT_CATALOG.pork_lomo;
      if (meatType === 'beef_lean') return MEAT_CATALOG.beef_bresaola;
      if (meatType === 'pork_fat') return MEAT_CATALOG.pork_pancetta;
      if (meatType === 'duck') return MEAT_CATALOG.duck_breast;
      return MEAT_CATALOG.pork_coppa;
    }

    function getBatchLocId(b) {
      if (b.locId && LOCATIONS[b.locId]) return b.locId;
      if (b.category === 'pepper' && b.tempC >= 17) return 'room_22';
      return (b.tempC <= 7) ? 'fridge_3' : 'fridge_12';
    }

    function getZoneKey(b) {
      if (b.currentStage === 'done') return 'done';
      if (b.category === 'pepper') return 'pepper';
      return getBatchLocId(b); // 'fridge_3' | 'fridge_12'
    }

    function analyze(batch) {
      const today = daysAgoISO(0);
      if (batch.category === 'pepper') {
        const elapsedDays = Math.max(0, diffDays(batch.createdAt, today));
        const targetDays = batch.targetDays || 21;
        const readinessPct = Math.min(100, Math.round((elapsedDays / targetDays) * 100));
        const remDays = Math.max(0, targetDays - elapsedDays);
        const totalMass = batch.initialWeight + (batch.brineWater || 0);
        const saltGrams = ((totalMass * (batch.saltPct || 2.8)) / 100).toFixed(1);
        const etaBadge = batch.currentStage === 'done' || remDays === 0 ? 'Готово!' : `~${remDays} дн`;
        return {
          isPepper: true,
          W0: batch.initialWeight,
          Wcur: batch.initialWeight,
          targetWeight: batch.initialWeight,
          lostGrams: 0,
          lossPct: 0,
          readinessPct,
          remDays,
          etaSort: remDays,
          etaBadge,
          elapsedDays,
          activeDryingDays: elapsedDays,
          vacuumDays: batch.currentStage === 'ferm_vac' ? elapsedDays : 0,
          cureDays: 0,
          saltGrams,
          speedPctDay: 0,
          k_eff: 0.04,
          crustDiag: null
        };
      }

      const cut = resolveCut(batch.meatType);
      const useHang = store.settings.lossBase === 'hang' && batch.hangWeight;
      const W0 = useHang ? batch.hangWeight : batch.initialWeight;
      const lastLog = batch.weightLogs[batch.weightLogs.length - 1] || { date: batch.createdAt, netWeight: batch.initialWeight };
      const Wcur = lastLog.netWeight;
      const targetLoss = batch.targetLossPct || cut.optimalLoss;
      const targetWeight = Math.round(W0 * (1 - targetLoss / 100));
      const lostGrams = Math.max(0, W0 - Wcur);
      const lossPct = Math.max(0, ((W0 - Wcur) / W0) * 100);
      const readinessPct = Math.min(100, Math.max(0, Math.round((lossPct / targetLoss) * 100)));

      // Physical prior k_prior
      const W_inf = 0.44 * W0;
      const stg = STAGES[batch.currentStage] || STAGES.dry_casing;
      const methodF = stg.methodF || (STAGES[cut.optimalStage] ? STAGES[cut.optimalStage].methodF : 0.85) || 0.85;
      const diamF = Math.pow(75 / Math.max(30, batch.diameterMm || cut.defaultDiam), 1.42);
      const tempVal = batch.currentStage === 'cure_vac' ? 12 : (batch.tempC || 12);
      const tempF = 0.68 + 0.32 * (tempVal / 12);
      const k_prior = 0.034 * cut.factor * methodF * diamF * tempF;

      let activeDryingDays = 0;
      let vacuumDays = 0;
      let cureDays = 0;
      for (const h of batch.stageHistory) {
        const dur = Math.max(0, diffDays(h.startDate, h.endDate || today));
        if (STAGES[h.stage] && STAGES[h.stage].isDrying) activeDryingDays += dur;
        if (h.stage === 'rehydrate_vac') vacuumDays += dur;
        if (h.stage === 'cure_vac') cureDays += dur;
      }

      // Empirical calibration from real drying weight logs
      let k_emp = null;
      if (activeDryingDays >= 3 && Wcur < W0 && Wcur > W_inf + 10) {
        const ratio = (Wcur - W_inf) / (W0 - W_inf);
        if (ratio > 0.05 && ratio < 0.99) {
          k_emp = -Math.log(ratio) / activeDryingDays;
        }
      }
      const empTrust = Math.min(0.85, activeDryingDays / 14);
      const k_eff = k_emp !== null ? (k_emp * empTrust + k_prior * (1 - empTrust)) : k_prior;

      let remDryingDays = 0;
      if (Wcur > targetWeight && Wcur > W_inf + 5 && targetWeight > W_inf) {
        const rNeed = (targetWeight - W_inf) / (Wcur - W_inf);
        if (rNeed > 0 && rNeed < 1) {
          remDryingDays = Math.ceil(-Math.log(rNeed) / Math.max(0.004, k_eff));
        }
      }

      // Estimate remaining cure days if currently in cure_vac
      const recCureDays = cut.cureDays || 12;
      const cureLeft = Math.max(0, recCureDays - cureDays);

      let etaBadge = '';
      let etaSort = remDryingDays;
      if (batch.currentStage === 'done' || (Wcur <= targetWeight && batch.currentStage !== 'cure_vac')) {
        etaBadge = 'Готово!';
        etaSort = 0;
      } else if (batch.currentStage === 'cure_vac') {
        etaBadge = cureLeft === 0 ? 'На навеску!' : `посол ~${cureLeft}д`;
        etaSort = cureLeft;
      } else if (batch.currentStage === 'rehydrate_vac') {
        etaBadge = `вак · ~${remDryingDays}д`;
        etaSort = Math.max(1, remDryingDays - 2);
      } else {
        etaBadge = `~${remDryingDays} дн`;
        etaSort = remDryingDays;
      }

      let speedPctDay = 0;
      if (batch.weightLogs.length >= 2) {
        const prev = batch.weightLogs[batch.weightLogs.length - 2];
        const dt = Math.max(1, diffDays(prev.date, lastLog.date));
        speedPctDay = Math.max(0, (((prev.netWeight - lastLog.netWeight) / W0) * 100) / dt);
      }

      let crustDiag = null;
      if (batch.currentStage === 'rehydrate_vac') {
        crustDiag = {
          kind: 'rehyd',
          title: 'Регидратация в вакууме',
          text: `В вакууме ${vacuumDays} дн. Таймер сушки на паузе — когда корка размягчится, верни на подвес.`,
          cta: 'Довяливать',
          targetStage: cut.optimalStage === 'dry_naked' ? 'dry_naked' : 'dry_casing'
        };
      } else if (batch.currentStage === 'dry_naked' && (batch.diameterMm || 85) >= 75 && speedPctDay >= 1.65) {
        crustDiag = {
          kind: 'risk',
          title: 'Риск закала корки',
          text: `Высокий темп (${speedPctDay.toFixed(2)}%/сут) без оболочки при Ø${batch.diameterMm}мм. Можно запаять в вакуум на 5–7 дн.`,
          cta: 'В вакуум',
          targetStage: 'rehydrate_vac'
        };
      } else if (batch.currentStage === 'cure_vac' && cureLeft === 0) {
        crustDiag = {
          kind: 'rehyd',
          title: `Посол завершён (${cureDays} дн)`,
          text: `Оптимальный следующий шаг для «${cut.label}»: ${(STAGES[cut.optimalStage] || STAGES.dry_casing).pill}.`,
          cta: 'Вывесить',
          targetStage: cut.optimalStage
        };
      }

      return {
        isPepper: false,
        cut, W0, Wcur, W_inf, targetWeight, lostGrams,
        lossPct, readinessPct,
        remDays: remDryingDays,
        cureLeft,
        etaBadge, etaSort,
        elapsedDays: diffDays(batch.createdAt, today),
        activeDryingDays, vacuumDays, cureDays,
        k_eff, speedPctDay, crustDiag
      };
    }

    function getSelectedBatch() {
      if (!store.batches.length) return null;
      const found = store.batches.find(b => b.id === ui.selectedId);
      if (found) return found;
      ui.selectedId = store.batches[0].id;
      return store.batches[0];
    }

    function navigate(screen, batchId) {
      dismissKeyboard();
      if (batchId) {
        ui.selectedId = batchId;
        ui.draftWeight = null;
        ui.weighDateMode = 'today';
      }
      if ((screen === 'detail' || screen === 'analytics') && !store.batches.length) {
        showToast('Добавь первую партию');
        openBatchModal({ mode: 'new', category: 'meat' });
        return;
      }
      ui.screen = screen;
      haptic('light');
      render();
      document.getElementById('viewport').scrollTop = 0;
    }

    window.handleAndroidBack = function() {
      if (isTextFieldFocused() || currentImeDp > 40) {
        dismissKeyboard();
        return true;
      }
      if (document.getElementById('batch-modal').classList.contains('open')) {
        closeBatchModal();
        return true;
      }
      if (ui.screen !== 'home') {
        navigate('home');
        return true;
      }
      return false;
    };

    function render() {
      ['home', 'analytics', 'sim'].forEach(k => {
        const btn = document.getElementById('dock-' + k);
        if (btn) btn.classList.toggle('active', ui.screen === k || (k === 'home' && ui.screen === 'detail'));
      });

      const vp = document.getElementById('viewport');
      if (ui.screen === 'home') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildHomeScreen();
      } else if (ui.screen === 'detail') {
        const b = getSelectedBatch();
        const stg = b ? (STAGES[b.currentStage] || STAGES.dry_casing) : STAGES.dry_casing;
        setStatusBar(stg.hex, false);
        vp.innerHTML = buildDetailScreen(b);
      } else if (ui.screen === 'analytics') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildAnalyticsScreen(getSelectedBatch());
      } else if (ui.screen === 'sim') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildSimScreen();
      }
    }

            <h1 style="font-size:23px;font-weight:800;letter-spacing:-0.02em;">Камера пока пустая</h1>
            <p style="font-size:13px;opacity:0.92;margin-top:6px;line-height:1.45;">
              Добавь свежий кусок мяса, банку перцев — или запиши то, что уже сейчас висит в холодильнике.
            </p>
          </section>

          <section class="empty-actions-card">
            <button class="btn-butter" style="width:100%;" onclick="openBatchModal({ mode: 'new', category: 'meat' })">
              🥩 Заложить новое мясо
            </button>
            <button class="btn-ink" style="width:100%;" onclick="openBatchModal({ mode: 'existing', category: 'meat' })">
              📦 Записать кусок, который уже лежит
            </button>
            <button style="width:100%;border:1.5px solid rgba(24,25,28,0.12);background:var(--cream-bg);color:var(--ink);font-size:13px;font-weight:700;padding:12px;border-radius:99px;cursor:pointer;"
              onclick="openBatchModal({ mode: 'new', category: 'pepper' })">
              🌶 Поставить острые перцы на ферментацию
            </button>
          </section>
        `;
      }

      // Sort active batches by soonest ETA so "Сегодня" shows most urgent first!
      const analyzedActive = activeBatches.map(b => ({ b, an: analyze(b) }))
        .sort((x, y) => x.an.etaSort - y.an.etaSort);

      const quickRows = analyzedActive.slice(0, 4).map(({ b, an }) => {
        const stg = STAGES[b.currentStage] || STAGES.dry_casing;
        const isReady = an.etaBadge === 'Готово!' || an.etaBadge === 'На навеску!';
        return `
          <div class="quick-row" onclick="navigate('detail', '${b.id}')">
            <div style="display:flex;align-items:center;gap:7px;min-width:0;">
              <span style="width:9px;height:9px;border-radius:50%;background:${stg.hex};flex-shrink:0;"></span>
              <span style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.title}</span>
            </div>
            <span class="quick-pill ${isReady ? 'ready' : ''}">${an.etaBadge}</span>
          </div>
        `;
      }).join('');

      // Smart spotlight for the right yellow card
      const spotlight = store.batches.find(b => b.currentStage === 'rehydrate_vac')
        || store.batches.find(b => b.category === 'pepper' && b.puffed)
        || (analyzedActive[0] && analyzedActive[0].b)
        || store.batches[0];
      const spotAn = spotlight ? analyze(spotlight) : null;
      const spotTitle = !spotlight ? 'Пусто'
        : (spotlight.currentStage === 'rehydrate_vac' ? 'Регидратация'
          : (spotlight.puffed ? 'Газ CO₂!'
            : (spotAn.etaBadge === 'На навеску!' ? 'На навеску!' : 'Ближе всех')));
      const spotSub = !spotlight ? ''
        : (spotlight.currentStage === 'rehydrate_vac' ? `Вакуум · ${spotAn.vacuumDays}д`
          : (spotlight.puffed ? 'Стравить пакет' : spotAn.etaBadge));

      const zones = [
        { id: 'all', lbl: 'Все' },
        { id: 'fridge_3', lbl: 'Холод. 3°C' },
        { id: 'fridge_12', lbl: 'Холод. 12°C' },
        { id: 'pepper', lbl: 'Перцы' },
        { id: 'done', lbl: 'Готово' }
      ];

      const filtered = store.batches.filter(b => ui.zoneFilter === 'all' || getZoneKey(b) === ui.zoneFilter);

      const cardsHtml = filtered.length ? filtered.map(b => {
        const stg = STAGES[b.currentStage] || STAGES.dry_casing;
        const an = analyze(b);
        const loc = LOCATIONS[getBatchLocId(b)] || LOCATIONS.fridge_12;
        const ring = an.isPepper ? `${an.elapsedDays}д` : `-${an.lossPct.toFixed(0)}%`;
        const sub = an.isPepper
          ? `${stg.short} · ${an.etaBadge}`
          : `${an.Wcur} г · ${an.etaBadge}`;
        return `
          <div class="pastel-card" style="background:${stg.hex};" onclick="navigate('detail', '${b.id}')">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:10.5px;font-weight:800;background:rgba(0,0,0,0.14);padding:3px 9px;border-radius:99px;">${loc.temp}°C</span>
              <div class="card-ring-mini">${ring}</div>
            </div>
            <div class="card-art-slot">${renderArt(b, 'small')}</div>
            <div>
              <div style="font-size:15px;font-weight:800;letter-spacing:-0.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.title}</div>
              <div style="font-size:11px;opacity:0.92;margin-top:2px;font-weight:600;">${sub}</div>
            </div>
          </div>
        `;
      }).join('') : `
        <div style="grid-column:1/-1;background:var(--white);border-radius:24px;padding:24px 18px;text-align:center;color:var(--text-sec);">
          <div style="font-weight:700;">В этой зоне пока ничего нет</div>
        </div>
      `;

      return `
        <header class="home-header">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="avatar-badge">🧑‍🍳</div>
            <div>
              <div style="font-size:19px;font-weight:800;letter-spacing:-0.02em;">КАМЕРА</div>
              <div style="font-size:12px;color:var(--text-sec);font-weight:600;">Активных партий: ${activeBatches.length}</div>
            </div>
          </div>
          <button class="circle-btn" onclick="openBatchModal({ mode: 'new', category: 'meat' })">＋</button>
        </header>

        <!-- "Сегодня — осталось до цели" Split Card -->
        <section class="heute-split">
          <div class="heute-left">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <div>
                <div style="font-size:17px;font-weight:800;">Сегодня</div>
                <div style="font-size:11px;color:var(--text-muted);font-weight:600;">Осталось до цели</div>
              </div>
              <span style="font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--cream-card);">${formatShortDate(daysAgoISO(0))}</span>
            </div>
            <div>${quickRows || '<div style="font-size:12px;color:var(--text-muted);padding:8px 0;">Все партии завершены!</div>'}</div>
          </div>

          <div class="heute-right" onclick="${spotlight ? `navigate('detail', '${spotlight.id}')` : `openBatchModal({mode:'new',category:'meat'})`}">
            <div>
              <div style="font-size:12px;font-weight:800;line-height:1.15;">${spotTitle}</div>
              <div style="font-size:10px;opacity:0.75;font-weight:700;margin-top:2px;">${spotSub}</div>
            </div>
            <div style="text-align:center;font-size:23px;margin:4px 0;">${!spotlight ? '✨' : (spotlight.puffed || spotlight.currentStage === 'rehydrate_vac' || spotlight.currentStage === 'cure_vac' ? '🫧' : (spotlight.category === 'pepper' ? '🌶' : '🥩'))}</div>
            <div>
              <div style="font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${spotlight ? spotlight.title : 'Добавить'}</div>
              <div style="font-size:10px;opacity:0.8;font-weight:700;">Открыть →</div>
            </div>
          </div>
        </section>

        <!-- Zone Filters -->
        <div class="zone-strip">
          ${zones.map(z => `
            <button class="zone-chip ${ui.zoneFilter === z.id ? 'active' : ''}" onclick="setZoneFilter('${z.id}')">${z.lbl}</button>
          `).join('')}
        </div>

        <div class="section-row">
          <span style="font-size:16px;font-weight:800;">Моя камера</span>
          <span style="font-size:12px;color:var(--text-sec);font-weight:600;">${filtered.length} шт</span>
        </div>

        <section class="pastel-grid">${cardsHtml}</section>
      `;
    }

    // --- SCREEN 2: DETAIL HERO + STAGE SWITCHER + CLEAN ARC WEIGH-IN ---
    function buildDetailScreen(batch) {
      if (!batch) return '';
      const stg = STAGES[batch.currentStage] || STAGES.dry_casing;
      const an = analyze(batch);
      const loc = LOCATIONS[getBatchLocId(batch)] || LOCATIONS.fridge_12;

      const r = 20;
      const c = 2 * Math.PI * r;
      const off = c * (1 - an.readinessPct / 100);

      const stageList = batch.category === 'pepper'
        ? ['ferm_vac', 'ferm_brine', 'done']
        : ['cure_vac', 'smoke', 'dry_casing', 'dry_naked', 'dry_membrane', 'rehydrate_vac', 'done'];

      if (ui.draftWeight === null) ui.draftWeight = an.Wcur;
      const draftLoss = Math.max(0, ((an.W0 - ui.draftWeight) / an.W0) * 100).toFixed(1);

      let ticks = '';
      for (let i = 0; i <= 24; i++) {
        const angle = Math.PI + (i / 24) * Math.PI;
        const active = (i / 24) * 100 <= an.readinessPct;
        const x1 = 130 + Math.cos(angle) * 86;
        const y1 = 92 + Math.sin(angle) * 86;
        const x2 = 130 + Math.cos(angle) * 94;
        const y2 = 92 + Math.sin(angle) * 94;
        ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${active ? '#FFFFFF' : 'rgba(255,255,255,0.28)'}" stroke-width="2.4" stroke-linecap="round"/>`;
      }
      const ka = Math.PI + (Math.min(100, Math.max(0, an.readinessPct)) / 100) * Math.PI;
      const kx = 130 + Math.cos(ka) * 72;
      const ky = 92 + Math.sin(ka) * 72;

      return `
        <div class="detail-hero" style="background:${stg.hex};">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;gap:8px;margin-bottom:8px;">
                <button class="circle-btn on-pastel" onclick="navigate('home')">←</button>
                <button class="circle-btn on-pastel" onclick="openBatchModal({ editId: '${batch.id}' })" title="Редактировать">✎</button>
              </div>
              <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.88;font-weight:700;">
                ${loc.icon} ${loc.label} · ${formatShortDate(batch.createdAt)}
              </div>
              <h1 style="font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.12;margin-top:2px;">${batch.title}</h1>
            </div>

            <div style="display:flex;flex-direction:column;align-items:center;text-align:center;" onclick="navigate('analytics')">
              <div style="position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;">
                <svg width="52" height="52" viewBox="0 0 52 52" style="transform:rotate(-90deg);">
                  <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="3.4"/>
                  <circle cx="26" cy="26" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"
                    stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
                </svg>
                <span style="position:absolute;font-size:11px;font-weight:800;font-family:var(--font-mono);">${an.readinessPct}%</span>
              </div>
              <span style="font-size:10px;font-weight:700;opacity:0.95;margin-top:2px;">${an.etaBadge}</span>
            </div>
          </div>

          <div style="height:152px;display:flex;align-items:center;justify-content:center;">
            ${renderArt(batch, 'large')}
          </div>
        </div>

        <div class="detail-sheet">
          <!-- Stage Switcher Pills -->
          <div>
            <div style="font-size:12px;font-weight:800;margin-bottom:7px;">Этап куска (можно менять туда-обратно)</div>
            <div class="stage-pill-row">
              ${stageList.map(sId => {
                const sObj = STAGES[sId];
                const isAct = batch.currentStage === sId;
                return `<button class="stage-pill ${isAct ? 'active-yellow' : ''}" onclick="changeStage('${batch.id}', '${sId}')">${sObj.pill}</button>`;
              }).join('')}
            </div>
          </div>

          <!-- Two-Column Metadata (Click location to toggle 3°C ⇄ 12°C!) -->
          <div class="meta-duo">
            <div class="meta-cell clickable" onclick="cycleBatchLocation('${batch.id}')" title="Нажми, чтобы сменить холодильник">
              <div class="meta-ico">${loc.icon}</div>
              <div>
                <div style="font-size:10px;color:var(--text-muted);font-weight:700;">Где лежит ⇄</div>
                <div style="font-weight:800;">${loc.short}</div>
              </div>
            </div>
            <div class="meta-cell">
              <div class="meta-ico">${an.isPepper ? '🧂' : '📏'}</div>
              <div>
                <div style="font-size:10px;color:var(--text-muted);font-weight:700;">${an.isPepper ? 'Соль' : 'Калибр и цель'}</div>
                <div style="font-weight:800;">${an.isPepper ? `${batch.saltPct}% (${an.saltGrams} г)` : `Ø${batch.diameterMm}мм · -${batch.targetLossPct}%`}</div>
              </div>
            </div>
          </div>

          <!-- Smart Diagnostic Banner (Vacuum Rehydration / Case Hardening / Cure Done) -->
          ${an.crustDiag ? `
            <div class="diag-banner" style="background:${an.crustDiag.kind === 'risk' ? '#FBE9E7' : '#E6F2F0'};">
              <div>
                <div style="font-weight:800;font-size:12.5px;">${an.crustDiag.title}</div>
                <div style="color:var(--text-sec);font-size:11.5px;margin-top:2px;">${an.crustDiag.text}</div>
              </div>
              <button class="btn-ink" style="padding:8px 13px;font-size:11.5px;white-space:nowrap;" onclick="changeStage('${batch.id}', '${an.crustDiag.targetStage}')">${an.crustDiag.cta}</button>
            </div>
          ` : ''}

          <!-- LAYERED MUSTARD + TEAL ARC WEIGH-IN (NO TARE!) -->
          ${!an.isPepper ? `
            <div class="arc-dial-card">
              <div class="arc-top-row">
                <button class="arc-chip-btn" onclick="toggleWeighDateMode()">
                  📅 ${ui.weighDateMode === 'today' ? 'Замер: Сегодня' : 'Замер: Вчера'} ⇄
                </button>
                <span id="arc-loss-badge" style="font-size:11.5px;font-weight:800;color:var(--ink);background:rgba(255,255,255,0.52);padding:4px 10px;border-radius:99px;font-family:var(--font-mono);">
                  -${draftLoss}%
                </span>
              </div>

              <div class="arc-teal-body">
                <svg viewBox="0 0 260 84" width="100%" height="74" style="overflow:visible;margin-bottom:-20px;">
                  ${ticks}
                  <path d="M 58 92 A 72 72 0 0 1 202 92" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="5" stroke-linecap="round"/>
                  <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="8.5" fill="#18191C" stroke="#FFFFFF" stroke-width="2.5"/>
                </svg>

                <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;">
                  <input id="arc-weight-input" type="number" inputmode="numeric" enterkeyhint="done" class="weight-inline-input"
                    value="${ui.draftWeight}" oninput="onArcWeightInput(this.value)" />
                  <span style="font-size:16px;font-weight:800;opacity:0.9;">г</span>
                </div>
                <div id="arc-net-caption" style="font-size:11px;opacity:0.84;margin-top:4px;font-weight:600;">
                  Старт: ${an.W0} г → Цель: ${an.targetWeight} г (-${batch.targetLossPct}%)
                </div>

                <div class="arc-steppers">
                  <button class="teal-step-btn" onclick="stepDraftWeight(-10)">−10</button>
                  <button class="teal-step-btn" onclick="stepDraftWeight(-1)">−1</button>
                  <button class="teal-save-btn" onclick="commitWeighIn('${batch.id}')">▶ Записать</button>
                  <button class="teal-step-btn" onclick="stepDraftWeight(1)">+1</button>
                  <button class="teal-step-btn" onclick="stepDraftWeight(10)">+10</button>
                </div>
              </div>
            </div>
          ` : `
            <div class="arc-dial-card">
              <div class="arc-top-row">
                <span style="font-size:11.5px;font-weight:800;color:var(--ink);background:rgba(255,255,255,0.9);padding:5px 11px;border-radius:99px;">
                  🫧 ${batch.puffed ? 'Подушка CO₂ — пора стравить' : 'Давление в норме'}
                </span>
                <button class="arc-chip-btn" onclick="promptPepperPh('${batch.id}')">pH ${batch.phValue} ✎</button>
              </div>
              <div class="arc-teal-body">
                <div style="font-size:23px;font-weight:800;">День ${an.elapsedDays} из ${batch.targetDays}</div>
                <div style="font-size:12px;opacity:0.86;margin:4px 0 13px;">Осталось: ${an.etaBadge} · Дегазаций: ${batch.degasCount || 0}</div>
                ${batch.currentStage === 'ferm_vac' ? `
                  <button class="teal-save-btn" onclick="togglePepperGas('${batch.id}')">
                    ${batch.puffed ? '🫧 Стравить CO₂ и перепаять' : '🎈 Отметить вздутие пакета'}
                  </button>
                ` : ''}
              </div>
            </div>

            <div style="padding:14px 15px;border-radius:20px;background:var(--cream-bg);font-size:12px;">
              <div style="font-weight:800;margin-bottom:8px;">🌶 Пробивка в острый соус (финиш)</div>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
                <div><div style="color:var(--text-muted);font-size:10.5px;">Ябл. уксус 15%</div><div style="font-weight:800;font-family:var(--font-mono);font-size:14px;">${Math.round(batch.initialWeight * 0.15)} мл</div></div>
                <div><div style="color:var(--text-muted);font-size:10.5px;">Ксантан 0.2%</div><div style="font-weight:800;font-family:var(--font-mono);font-size:14px;">${(batch.initialWeight * 0.002).toFixed(1)} г</div></div>
                <div><div style="color:var(--text-muted);font-size:10.5px;">Выход соуса</div><div style="font-weight:800;font-family:var(--font-mono);font-size:14px;color:var(--coral-deep);">~${Math.round(batch.initialWeight * 1.1)} мл</div></div>
              </div>
            </div>
          `}

          ${batch.notes ? `
            <div style="padding:12px 14px;border-radius:16px;background:var(--cream-bg);font-size:12.5px;color:var(--text-sec);line-height:1.45;">
              <strong style="color:var(--ink);">Заметки:</strong> ${batch.notes}
            </div>
          ` : ''}

          <button class="btn-ink" style="width:100%;" onclick="navigate('analytics')">
            Кривая сушки (${an.readinessPct}%) и журнал →
          </button>
        </div>
      `;
    }

    // --- SCREEN 3: ANALYTICS ---
    function buildAnalyticsScreen(batch) {
      if (!batch) return '';
      const stg = STAGES[batch.currentStage] || STAGES.dry_casing;
      const an = analyze(batch);

      const bigVal = an.isPepper
        ? `${an.readinessPct}%`
        : (ui.metricMode === 'readiness' ? `${an.readinessPct}%` : `-${an.lossPct.toFixed(1)}%`);

      const bigSub = an.isPepper
        ? `Готовность (${an.elapsedDays} из ${batch.targetDays} дн · pH ${batch.phValue})`
        : (ui.metricMode === 'readiness'
            ? `Готовность к цели -${batch.targetLossPct}% (${an.targetWeight} г)`
            : `Фактическая потеря от ${an.W0} г (−${an.lostGrams} г)`);

      // Normalized vertical capsule bar heights (34px to 96px)
      const rawBars = an.isPepper
        ? [
            { lbl: 'Старт', val: '0д', num: 2, c1: '#E6C7A8', c2: '#D8AD84' },
            { lbl: 'Нед 1', val: '7д', num: 7, c1: '#EE9D68', c2: '#C8713B' },
            { lbl: 'Нед 2', val: '14д', num: 14, c1: '#EA7B72', c2: '#C45249' },
            { lbl: 'Сейчас', val: `${an.elapsedDays}д`, num: Math.max(2, an.elapsedDays), c1: '#3B7D71', c2: '#295D53' },
            { lbl: 'Цель', val: `${batch.targetDays}д`, num: batch.targetDays, c1: '#8FB184', c2: '#56794C' }
          ]
        : [
            { lbl: 'Посол', val: `${an.cureDays}д`, num: an.cureDays, c1: '#8884E6', c2: '#5B57B8' },
            { lbl: 'Сушка', val: `${an.activeDryingDays}д`, num: an.activeDryingDays, c1: '#EE9D68', c2: '#C8713B' },
            { lbl: 'Вакуум', val: `${an.vacuumDays}д`, num: an.vacuumDays, c1: '#3B7D71', c2: '#295D53' },
            { lbl: 'Ушло', val: `${an.lossPct.toFixed(0)}%`, num: an.lossPct, c1: '#EA7B72', c2: '#C45249' },
            { lbl: 'Ещё', val: `~${an.remDays}д`, num: an.remDays, c1: '#8FB184', c2: '#56794C' }
          ];
      const maxBarNum = Math.max(10, ...rawBars.map(x => x.num));

      const logsHtml = batch.weightLogs.slice().reverse().map((w, revIdx) => {
        const realIdx = batch.weightLogs.length - 1 - revIdx;
        const loss = (((an.W0 - w.netWeight) / an.W0) * 100).toFixed(1);
        const sObj = STAGES[w.stage] || stg;
        return `
          <div class="journal-item">
            <div>
              <div style="font-weight:800;font-family:var(--font-mono);">
                ${w.netWeight} г <span style="color:var(--coral-deep);margin-left:4px;">-${loss}%</span>
              </div>
              <div style="font-size:11.5px;color:var(--text-sec);">${formatShortDate(w.date)} · ${sObj.short}${w.note ? ` · ${w.note}` : ''}</div>
            </div>
            ${batch.weightLogs.length > 1 ? `
              <button style="border:none;background:var(--cream-card);color:var(--text-sec);width:28px;height:28px;border-radius:50%;font-size:12px;cursor:pointer;" onclick="deleteWeighLog('${batch.id}', ${realIdx})">✕</button>
            ` : ''}
          </div>
        `;
      }).join('');

      const firstStageLbl = (STAGES[batch.stageHistory[0]?.stage] || stg).short;

      return `
        <div class="analytics-wrap">
          <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;">
            ${store.batches.map(b => `
              <button class="zone-chip ${b.id === batch.id ? 'active' : ''}" onclick="navigate('analytics', '${b.id}')">${b.title}</button>

    function buildDynamicSplineSVG(batch, an) {
      const W = 310, H = 136, padX = 16, padTop = 34, padBot = 16;
      const plotW = W - padX * 2, plotH = H - padTop - padBot;

      let rawPts = [];
      if (an.isPepper) {
        rawPts = [
          { t: 0, pct: 0 },
          { t: 0.35, pct: Math.min(100, an.readinessPct * 0.45) },
          { t: 0.72, pct: an.readinessPct },
          { t: 1, pct: 100, projected: true }
        ];
      } else {
        const logs = batch.weightLogs;
        const startDate = batch.createdAt;
        const lastLogDate = logs[logs.length - 1].date;
        const totalElapsed = Math.max(1, diffDays(startDate, lastLogDate));
        const totalSpan = Math.max(totalElapsed + Math.min(35, an.remDays), 10);

        logs.forEach(l => {
          const d = diffDays(startDate, l.date);
          const loss = Math.max(0, ((an.W0 - l.netWeight) / an.W0) * 100);
          const normPct = Math.min(105, (loss / Math.max(1, batch.targetLossPct || 35)) * 100);
          rawPts.push({ t: d / totalSpan, pct: normPct });
        });

        if (an.remDays > 0 && an.Wcur > an.targetWeight) {
          rawPts.push({ t: 1, pct: 100, projected: true });
        }
      }

      const coords = rawPts.map(p => ({
        x: padX + p.t * plotW,
        y: padTop + plotH * (1 - Math.min(105, Math.max(0, p.pct)) / 105),
        ...p
      }));

      const actualCoords = coords.filter(c => !c.projected);
      const activePt = actualCoords[actualCoords.length - 1] || coords[0];

      function smoothPath(list) {
        if (list.length < 2) return `M ${list[0].x.toFixed(1)} ${list[0].y.toFixed(1)}`;
        let d = `M ${list[0].x.toFixed(1)} ${list[0].y.toFixed(1)}`;
        for (let i = 0; i < list.length - 1; i++) {
          const p0 = list[i], p1 = list[i + 1];
          const cx = ((p0.x + p1.x) / 2).toFixed(1);
          d += ` C ${cx} ${p0.y.toFixed(1)}, ${cx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
        }
        return d;
      }

      const actualD = smoothPath(actualCoords);
      const areaD = actualCoords.length >= 2
        ? `${actualD} L ${activePt.x.toFixed(1)} ${H - padBot} L ${actualCoords[0].x.toFixed(1)} ${H - padBot} Z`
        : '';

      const projPt = coords.find(c => c.projected);
      const projD = projPt
        ? `M ${activePt.x.toFixed(1)} ${activePt.y.toFixed(1)} Q ${((activePt.x + projPt.x)/2).toFixed(1)} ${(activePt.y - 10).toFixed(1)} ${projPt.x.toFixed(1)} ${projPt.y.toFixed(1)}`
        : '';

      const bubbleTxt = an.isPepper ? `${an.readinessPct}%` : `-${an.lossPct.toFixed(1)}%`;
      const bx = Math.min(W - 36, Math.max(36, activePt.x));
      const by = Math.max(26, activePt.y);

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" fill="none">
          <defs>
            <linearGradient id="wf-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#D96B68" stop-opacity="0.24"/>
              <stop offset="100%" stop-color="#D96B68" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <line x1="${padX}" y1="${padTop + 4}" x2="${W - padX}" y2="${padTop + 4}" stroke="rgba(86,121,76,0.28)" stroke-dasharray="4 4"/>
          ${areaD ? `<path d="${areaD}" fill="url(#wf-grad)"/>` : ''}
          ${projD ? `<path d="${projD}" stroke="#8FB184" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>` : ''}
          <path d="${actualD}" stroke="#C86464" stroke-width="2.8" stroke-linecap="round"/>
          <line x1="${activePt.x.toFixed(1)}" y1="${activePt.y.toFixed(1)}" x2="${activePt.x.toFixed(1)}" y2="${H - padBot}" stroke="rgba(24,25,28,0.14)" stroke-dasharray="2 2"/>
          ${actualCoords.slice(1, -1).map(pt => `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.5" fill="#FAF8F1" stroke="#C86464" stroke-width="2"/>`).join('')}
          ${projPt ? `<circle cx="${projPt.x.toFixed(1)}" cy="${projPt.y.toFixed(1)}" r="4.5" fill="#8FB184"/>` : ''}
          <circle cx="${activePt.x.toFixed(1)}" cy="${activePt.y.toFixed(1)}" r="5.5" fill="#18191C" stroke="#FFFFFF" stroke-width="2.2"/>
          <rect x="${(bx - 30).toFixed(1)}" y="${(by - 31).toFixed(1)}" width="60" height="22" rx="11" fill="#18191C"/>
          <text x="${bx.toFixed(1)}" y="${(by - 16.5).toFixed(1)}" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="800">${bubbleTxt}</text>
        </svg>
      `;
    }

    function buildMeatSelectOptions(selectedId) {
      const groups = {};
      Object.entries(MEAT_CATALOG).forEach(([id, item]) => {
        if (!groups[item.group]) groups[item.group] = [];
        groups[item.group].push({ id, ...item });
      });
      return Object.entries(groups).map(([grp, items]) => `
        <optgroup label="${grp}">
          ${items.map(it => `<option value="${it.id}" ${it.id === selectedId ? 'selected' : ''}>${it.label}</option>`).join('')}
        </optgroup>
      `).join('');
    }

      const cut = resolveCut(s.cutId);
      const W_inf = 0.44 * s.weight;
      const targetW = Math.round(s.weight * (1 - s.target / 100));
      const k = 0.034 * cut.factor * s.method * Math.pow(75 / s.diam, 1.42) * (0.68 + 0.32 * (s.temp / 12));
      const pureDays = Math.ceil(-Math.log(Math.max(0.05, (targetW - W_inf) / (s.weight - W_inf))) / k);
      const totalDays = pureDays + s.vacDays;

      return `
        <div class="analytics-wrap">
          <h2 style="font-size:24px;font-weight:800;letter-spacing:-0.02em;">Симулятор и настройки</h2>

            </div>

              <div class="stat-cap" style="padding:10px 6px;">

              </div>

                <div class="stat-cap-num" style="font-size:17px;color:var(--coral-deep);">${pureDays}д</div>
                <div class="stat-cap-lbl">Чистая сушка</div>
              </div>
              <div class="stat-cap" style="padding:10px 6px;">
                <div class="stat-cap-num" style="font-size:17px;color:var(--teal);">+${s.vacDays}д</div>
                <div class="stat-cap-lbl">Вакуум-пауза</div>
              </div>
            </div>

            <div>
              <label class="f-lbl">Отруб / вид мяса</label>
              <select class="f-inp" onchange="onSimCutChange(this.value)">
                ${buildMeatSelectOptions(s.cutId)}
              </select>
            </div>

            <div>
              <label class="f-lbl">Способ вяления</label>
              <select class="f-inp" onchange="updateSim('method', parseFloat(this.value))">
                <option value="1.00" ${s.method===1.00?'selected':''}>Подвес без оболочки (1.0×)</option>
                <option value="0.85" ${s.method===0.85?'selected':''}>В оболочке: коллаген / черева (0.85×)</option>
                <option value="0.68" ${s.method===0.68?'selected':''}>Мембранный пакет Айцел (0.68×)</option>
              </select>
            </div>

            <div>
              <label class="f-lbl">Холодильник</label>
              <div class="loc-picker">
                <button type="button" class="loc-btn ${s.temp===3?'selected':''}" onclick="updateSim('temp', 3)">❄️ Холодильник 3°C</button>
                <button type="button" class="loc-btn ${s.temp===12?'selected':''}" onclick="updateSim('temp', 12)">🌡 Холодильник 12°C</button>
              </div>
            </div>

            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px;">
                <span>Калибр / толщина куска</span><span>${s.diam} мм</span>
              </div>
              <input type="range" min="35" max="140" step="5" value="${s.diam}" class="craft-range" oninput="updateSim('diam', parseInt(this.value,10))"/>
            </div>

            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px;">
                <span>Стартовый вес</span><span>${s.weight} г</span>
              </div>
              <input type="range" min="300" max="3000" step="50" value="${s.weight}" class="craft-range" oninput="updateSim('weight', parseInt(this.value,10))"/>

                <span>Целевая потеря веса</span><span>-${s.target}%</span>
              </div>
              <input type="range" min="22" max="45" step="1" value="${s.target}" class="craft-range" oninput="updateSim('target', parseInt(this.value,10))"/>
            </div>

            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px;">

        </div>
      `;

    // =========================================================================
    // 7. INTERACTIVE HANDLERS
    // =========================================================================
    function setZoneFilter(z) {
      ui.zoneFilter = z;
      haptic('light');
      render();
    }

    function changeStage(batchId, newStageId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b || b.currentStage === newStageId) return;
      const today = daysAgoISO(0);
      const curH = b.stageHistory[b.stageHistory.length - 1];
      if (curH && !curH.endDate) curH.endDate = today;

      const stg = STAGES[newStageId];
      const defLoc = LOCATIONS[stg.defaultLocId] || LOCATIONS.fridge_12;
      b.currentStage = newStageId;
      b.locId = defLoc.id;
      b.tempC = defLoc.temp;
      b.location = defLoc.label;
      if (newStageId.startsWith('dry_') && b.weightLogs.length) {
        b.hangWeight = b.weightLogs[b.weightLogs.length - 1].netWeight;
      }
      b.stageHistory.push({ stage: newStageId, startDate: today, endDate: null, tempC: defLoc.temp });
      persistStore();
      haptic('medium');
      showToast(`Этап: ${stg.short} (${defLoc.temp}°C)`);
      render();
    }

    function cycleBatchLocation(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      const cur = getBatchLocId(b);
      let nextId;
      if (b.category === 'pepper') {
        nextId = cur === 'room_22' ? 'fridge_12' : (cur === 'fridge_12' ? 'fridge_3' : 'room_22');
      } else {
        nextId = cur === 'fridge_3' ? 'fridge_12' : 'fridge_3';
      }
      const loc = LOCATIONS[nextId];
      b.locId = loc.id;
      b.tempC = loc.temp;
      b.location = loc.label;
      persistStore();
      haptic('light');
      showToast(`Перенесено: ${loc.label}`);
      render();
    }

    function toggleWeighDateMode() {
      ui.weighDateMode = ui.weighDateMode === 'today' ? 'yesterday' : 'today';
      haptic('light');
      render();
    }

    function onArcWeightInput(val) {
      const n = parseInt(val, 10);
      if (isNaN(n)) return;
      ui.draftWeight = n;
      const b = getSelectedBatch();
      if (!b) return;
      const an = analyze(b);
      const loss = Math.max(0, ((an.W0 - n) / an.W0) * 100).toFixed(1);
      const badge = document.getElementById('arc-loss-badge');
      if (badge) badge.textContent = `-${loss}%`;
    }

    function stepDraftWeight(delta) {
      const b = getSelectedBatch();
      if (!b) return;
      ui.draftWeight = Math.max(20, (ui.draftWeight || b.initialWeight) + delta);
      haptic('light');
      const inp = document.getElementById('arc-weight-input');
      if (inp) {
        inp.value = ui.draftWeight;
        onArcWeightInput(ui.draftWeight);
      } else {
        render();
      }
    }

    function commitWeighIn(batchId) {
      dismissKeyboard();
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      const val = parseInt(ui.draftWeight, 10);
      if (isNaN(val) || val < 20) return;

      const dateStr = ui.weighDateMode === 'yesterday' ? daysAgoISO(1) : daysAgoISO(0);
      b.weightLogs.push({
        date: dateStr,
        netWeight: val,
        stage: b.currentStage,
        note: ''
      });
      b.weightLogs.sort((a, c) => a.date.localeCompare(c.date));
      ui.draftWeight = null;
      ui.weighDateMode = 'today';
      persistStore();
      haptic('success');
      showToast(`Записано: ${val} г`);
      render();
    }

    function deleteWeighLog(batchId, idx) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b || b.weightLogs.length <= 1) return;
      b.weightLogs.splice(idx, 1);
      ui.draftWeight = null;
      persistStore();
      haptic('light');
      showToast('Замер удалён');
      render();
    }

    function togglePepperGas(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      if (b.puffed) {
        b.puffed = false;
        b.degasCount = (b.degasCount || 0) + 1;
        showToast('CO₂ стравлен, пакет перепаян!');
      } else {
        b.puffed = true;
        showToast('Отмечена подушка CO₂');
      }
      persistStore();
      haptic('success');
      render();
    }

    function promptPepperPh(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      const val = prompt('Введи текущий pH перцев (напр. 3.6):', String(b.phValue || 3.8));
      const num = parseFloat((val || '').replace(',', '.'));
      if (!isNaN(num) && num > 1 && num < 9) {
        b.phValue = Math.round(num * 10) / 10;
        persistStore();
        haptic('light');
        render();
      }
    }

    function toggleMetricMode() {
      ui.metricMode = ui.metricMode === 'readiness' ? 'loss' : 'readiness';
      haptic('light');
      render();
    }

    function onSimCutChange(cutId) {
      const cut = resolveCut(cutId);
      ui.sim.cutId = cutId;
      ui.sim.diam = cut.defaultDiam;
      ui.sim.target = cut.optimalLoss;
      ui.sim.method = (STAGES[cut.optimalStage] && STAGES[cut.optimalStage].methodF) || 0.85;
      render();
    }

    function updateSim(key, val) {
      ui.sim[key] = val;
      render();
    }

    function toggleLossBase() {
      store.settings.lossBase = store.settings.lossBase === 'raw' ? 'hang' : 'raw';
      persistStore();
      haptic('light');
      showToast(store.settings.lossBase === 'raw' ? 'База: сырой вес до посола' : 'База: вес перед навеской');
      render();
    }

    function exportBackup() {
      const txt = JSON.stringify(store, null, 2);
      if (hasAndroid && window.AndroidBridge.shareText) {
        window.AndroidBridge.shareText('Бэкап КАМЕРА (JSON)', txt);
      } else {
        navigator.clipboard && navigator.clipboard.writeText(txt);
        showToast('JSON скопирован');
      }
    }

    function clearAllBatches() {
      if (!confirm('Удалить все партии и очистить камеру?')) return;
      store.batches = [];
      ui.selectedId = null;
      persistStore();
      haptic('medium');
      showToast('Камера очищена');
      navigate('home');
    }
