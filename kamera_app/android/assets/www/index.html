    function openBatchModal(opts) {
      const o = opts || {};
      ui.modal.editingId = o.editId || null;

      const modal = document.getElementById('batch-modal');
      const delBtn = document.getElementById('m-delete-btn');
      const modeToggle = document.getElementById('modal-mode-toggle');
      const heading = document.getElementById('modal-heading');

      if (ui.modal.editingId) {
        const b = store.batches.find(x => x.id === ui.modal.editingId);
        if (!b) return;
        heading.textContent = 'Редактировать партию';
        delBtn.classList.remove('hidden');
        modeToggle.classList.add('hidden');
        ui.modal.entryMode = 'new';
        ui.modal.category = b.category;
        ui.modal.locId = getBatchLocId(b);

        syncModalControls(true);
        if (b.category === 'meat') {
          document.getElementById('m-cut').value = MEAT_CATALOG[b.meatType] ? b.meatType : 'pork_coppa';
          document.getElementById('m-diam').value = b.diameterMm || 85;
          document.getElementById('m-target').value = b.targetLossPct || 34;
        } else {
          document.getElementById('m-cut').value = b.pepperPreset || 'pepper_vac_hot';
          document.getElementById('m-brine').value = b.brineWater || 0;
          document.getElementById('m-target').value = b.targetDays || 21;
        }
        document.getElementById('m-title').value = b.title;
        document.getElementById('m-weight').value = b.initialWeight;
        document.getElementById('m-stage').value = b.currentStage;
        document.getElementById('m-notes').value = b.notes || '';
        renderLocPicker();
        refreshModalCalc();
      } else {
        heading.textContent = 'Новая закладка';
        delBtn.classList.add('hidden');
        modeToggle.classList.remove('hidden');
        ui.modal.entryMode = o.mode === 'existing' ? 'existing' : 'new';
        ui.modal.category = o.category === 'pepper' ? 'pepper' : 'meat';
        ui.modal.locId = ui.modal.category === 'pepper' ? 'room_22' : (ui.modal.entryMode === 'existing' ? 'fridge_12' : 'fridge_3');

        document.getElementById('m-title').value = '';
        document.getElementById('m-weight').value = ui.modal.category === 'pepper' ? 600 : 1200;
        document.getElementById('m-cur-weight').value = '';
        document.getElementById('m-prior-vac-days').value = '0';
        document.getElementById('m-start-date').value = daysAgoISO(14);
        document.getElementById('m-notes').value = '';

        syncModalControls(false);
        onCutPresetChange();
      }

      modal.classList.add('open');
      document.getElementById('sheet-panel').scrollTop = 0;
      haptic('light');
    }

    function closeBatchModal() {
      document.getElementById('batch-modal').classList.remove('open');
    }

    function setModalEntryMode(mode) {
      ui.modal.entryMode = mode;
      haptic('light');
      syncModalControls(false);
      if (ui.modal.category === 'meat') {
        const cut = resolveCut(document.getElementById('m-cut').value);
        if (mode === 'existing') {
          document.getElementById('m-stage').value = cut.optimalStage;
          ui.modal.locId = (STAGES[cut.optimalStage] || STAGES.dry_casing).defaultLocId;
          document.getElementById('m-prior-vac-days').value = String(cut.cureDays || 0);
        } else {
          document.getElementById('m-stage').value = 'cure_vac';
          ui.modal.locId = 'fridge_3';
        }
        renderLocPicker();
      }
      refreshModalCalc();
    }

    function setModalCategory(cat) {
      ui.modal.category = cat;
      haptic('light');
      document.getElementById('m-weight').value = cat === 'pepper' ? 600 : 1200;
      syncModalControls(false);
      onCutPresetChange();
    }

    function syncModalControls(isEdit) {
      const isMeat = ui.modal.category === 'meat';
      const isExisting = !isEdit && ui.modal.entryMode === 'existing';

      document.getElementById('mode-new-btn').classList.toggle('active', !isExisting);
      document.getElementById('mode-exist-btn').classList.toggle('active', isExisting);
      document.getElementById('cat-meat-btn').classList.toggle('active', isMeat);
      document.getElementById('cat-pepper-btn').classList.toggle('active', !isMeat);

      document.getElementById('m-backdate-panel').classList.toggle('hidden', !isExisting);
      document.getElementById('m-exist-meat-extra').classList.toggle('hidden', !isMeat);
      document.getElementById('m-diam-wrap').classList.toggle('hidden', !isMeat);
      document.getElementById('m-brine-wrap').classList.toggle('hidden', isMeat);

      const cutSel = document.getElementById('m-cut');
      const stgSel = document.getElementById('m-stage');

      if (isMeat) {
        document.getElementById('m-cut-lbl').textContent = 'Отруб / вид мяса';
        document.getElementById('m-target-lbl').textContent = 'Цель усушки (%)';
        cutSel.innerHTML = buildMeatSelectOptions('pork_coppa');
        stgSel.innerHTML = `
          <option value="cure_vac">Посол в вакууме</option>
          <option value="dry_casing">Вяление в оболочке</option>
          <option value="dry_naked">Подвес без оболочки</option>
          <option value="dry_membrane">Мембранный пакет (Айцел)</option>
          <option value="rehydrate_vac">Регидратация в вакууме</option>
          <option value="smoke">Копчение</option>
        `;
      } else {
        document.getElementById('m-cut-lbl').textContent = 'Способ ферментации перцев';
        document.getElementById('m-target-lbl').textContent = 'Срок (дней)';
        cutSel.innerHTML = Object.entries(PEPPER_CATALOG)
          .map(([id, p]) => `<option value="${id}">${p.label}</option>`).join('');
        stgSel.innerHTML = `
          <option value="ferm_vac">Ферментация в вакууме</option>
          <option value="ferm_brine">Ферментация в рассоле (банка)</option>
        `;
      }

      renderLocPicker();
    }

    function renderLocPicker() {
      const holder = document.getElementById('m-loc-picker');
      const allowed = ui.modal.category === 'pepper'
        ? ['room_22', 'fridge_12', 'fridge_3']
        : ['fridge_3', 'fridge_12'];
      if (!allowed.includes(ui.modal.locId)) ui.modal.locId = allowed[0];

      holder.innerHTML = allowed.map(id => {
        const loc = LOCATIONS[id];
        return `
          <button type="button" class="loc-btn ${ui.modal.locId === id ? 'selected' : ''}" onclick="selectModalLoc('${id}')">
            <span>${loc.icon}</span>
            <span>${loc.label}</span>
          </button>
        `;
      }).join('');
    }

    function selectModalLoc(id) {
      ui.modal.locId = id;
      haptic('light');
      renderLocPicker();
    }

    function setStartDaysAgo(days) {
      document.getElementById('m-start-date').value = daysAgoISO(days);
      haptic('light');
      refreshModalCalc();
    }

    function onCutPresetChange() {
      const val = document.getElementById('m-cut').value;
      if (ui.modal.category === 'meat') {
        const cut = resolveCut(val);
        document.getElementById('m-target').value = cut.optimalLoss;
        document.getElementById('m-diam').value = cut.defaultDiam;
        document.getElementById('m-title').placeholder = cut.defaultTitle;

        if (!ui.modal.editingId) {
          if (ui.modal.entryMode === 'existing') {
            document.getElementById('m-stage').value = cut.optimalStage;
            ui.modal.locId = (STAGES[cut.optimalStage] || STAGES.dry_casing).defaultLocId;
          } else {
            document.getElementById('m-stage').value = 'cure_vac';
            ui.modal.locId = 'fridge_3';
          }
          renderLocPicker();
        }
      } else {
        const p = PEPPER_CATALOG[val] || PEPPER_CATALOG.pepper_vac_hot;
        document.getElementById('m-stage').value = p.optimalStage;
        document.getElementById('m-target').value = p.targetDays;
        document.getElementById('m-brine').value = p.defaultBrine;
        document.getElementById('m-title').placeholder = p.defaultTitle;
        ui.modal.locId = 'room_22';
        renderLocPicker();
      }
      refreshModalCalc();
    }

    function onModalStageChange() {
      const sId = document.getElementById('m-stage').value;
      const stg = STAGES[sId];
      if (stg && stg.defaultLocId) {
        ui.modal.locId = stg.defaultLocId;
        renderLocPicker();
      }
      refreshModalCalc();
    }

    function refreshModalCalc() {
      const optBox = document.getElementById('m-optimal-card');
      const calcBox = document.getElementById('m-calc-box');
      const w = parseInt(document.getElementById('m-weight').value, 10) || 1000;
      const tVal = parseInt(document.getElementById('m-target').value, 10) || 34;

      if (ui.modal.category === 'meat') {
        const cut = resolveCut(document.getElementById('m-cut').value);
        const optStg = STAGES[cut.optimalStage] || STAGES.dry_casing;
        optBox.innerHTML = `
          <div style="font-weight:800;margin-bottom:2px;">✨ Оптимальная сушка: −${cut.optimalLoss}% · ${optStg.pill}</div>
          <div style="color:var(--text-sec);">${cut.tip} Посол: ~${cut.cureDays} дн.</div>
        `;

        const saltHalf = (w * (cut.saltPct / 200)).toFixed(1);
        const finW = Math.round(w * (1 - tVal / 100));
        let extraLine = '';
        if (ui.modal.entryMode === 'existing' && !ui.modal.editingId) {
          const curW = parseInt(document.getElementById('m-cur-weight').value, 10);
          if (!isNaN(curW) && curW > 0 && curW < w) {
            const curLoss = (((w - curW) / w) * 100).toFixed(1);
            extraLine = `<br/>📉 Уже потеряно: <b>−${curLoss}%</b> (${w - curW} г) — прогноз сразу откалибруется!`;
          }
        }
        calcBox.innerHTML = `
          🧂 Посол ${cut.saltPct}%: <b>${saltHalf} г</b> нитритной + <b>${saltHalf} г</b> морской соли.<br/>
          🎯 Цель (−${tVal}%): <b>${finW} г</b> (испарить ${w - finW} г).${extraLine}
        `;
      } else {
        const p = PEPPER_CATALOG[document.getElementById('m-cut').value] || PEPPER_CATALOG.pepper_vac_hot;
        const stg = document.getElementById('m-stage').value;
        const brine = stg === 'ferm_vac' ? 0 : (parseInt(document.getElementById('m-brine').value, 10) || 0);
        const pct = stg === 'ferm_vac' ? p.saltPct : 3.5;
        const mass = w + brine;
        const salt = (mass * pct / 100).toFixed(1);
        optBox.innerHTML = `
          <div style="font-weight:800;margin-bottom:2px;">🌶 Оптимально: ${pct}% соли · ${p.targetDays} дней</div>
          <div style="color:var(--text-sec);">${p.tip}</div>
        `;
        calcBox.innerHTML = `🧂 Соль (${pct}% от ${mass} г): <b>${salt} г</b> неиодированной соли · Срок: <b>${tVal} дн</b>.`;
      }
    }

    function saveBatchModal() {
      dismissKeyboard();
      const cat = ui.modal.category;
      const cutVal = document.getElementById('m-cut').value;
      const cutObj = cat === 'meat' ? resolveCut(cutVal) : (PEPPER_CATALOG[cutVal] || PEPPER_CATALOG.pepper_vac_hot);

      const title = document.getElementById('m-title').value.trim() || cutObj.defaultTitle;
      const w = Math.max(40, parseInt(document.getElementById('m-weight').value, 10) || 1000);
      const stgId = document.getElementById('m-stage').value;
      const targetVal = Math.max(1, parseInt(document.getElementById('m-target').value, 10) || 34);
      const loc = LOCATIONS[ui.modal.locId] || LOCATIONS.fridge_12;
      const notes = document.getElementById('m-notes').value.trim();
      const diam = Math.max(20, parseInt(document.getElementById('m-diam').value, 10) || 85);
      const brine = cat === 'pepper' ? Math.max(0, parseInt(document.getElementById('m-brine').value, 10) || 0) : 0;

      if (ui.modal.editingId) {
        const b = store.batches.find(x => x.id === ui.modal.editingId);
        if (b) {
          b.category = cat;
          b.title = title;
          b.initialWeight = w;
          if (b.weightLogs.length === 1) b.weightLogs[0].netWeight = w;
          b.locId = loc.id;
          b.tempC = loc.temp;
          b.location = loc.label;
          b.notes = notes;
          if (cat === 'meat') {
            b.meatType = cutVal;
            b.diameterMm = diam;
            b.targetLossPct = targetVal;
          } else {
            b.pepperPreset = cutVal;
            b.brineWater = brine;
            b.targetDays = targetVal;
            b.saltPct = stgId === 'ferm_vac' ? cutObj.saltPct : 3.5;
          }
          if (b.currentStage !== stgId) {
            changeStage(b.id, stgId);
          }
        }
        persistStore();
        closeBatchModal();
        ui.draftWeight = null;
        haptic('success');
        showToast('Сохранено');
        render();
        return;
      }

      const today = daysAgoISO(0);
      const isExisting = ui.modal.entryMode === 'existing';
      const startDateInput = document.getElementById('m-start-date').value;
      const createdAt = (isExisting && startDateInput && startDateInput <= today) ? startDateInput : today;

      const stageHistory = [];
      const weightLogs = [];

      if (isExisting && createdAt < today) {
        const elapsedTotal = diffDays(createdAt, today);
        const priorVacDays = cat === 'meat'
          ? Math.min(elapsedTotal, Math.max(0, parseInt(document.getElementById('m-prior-vac-days').value, 10) || 0))
          : 0;

        if (cat === 'meat' && priorVacDays > 0 && stgId !== 'cure_vac') {
          const dryStart = daysAgoISO(Math.max(0, elapsedTotal - priorVacDays));
          stageHistory.push({ stage: 'cure_vac', startDate: createdAt, endDate: dryStart, tempC: 3 });
          stageHistory.push({ stage: stgId, startDate: dryStart, endDate: null, tempC: loc.temp });
        } else {
          stageHistory.push({ stage: stgId, startDate: createdAt, endDate: null, tempC: loc.temp });
        }

        weightLogs.push({ date: createdAt, netWeight: w, stage: stageHistory[0].stage, note: 'Стартовый вес' });

        if (cat === 'meat') {
          const curW = parseInt(document.getElementById('m-cur-weight').value, 10);
          if (!isNaN(curW) && curW > 20 && curW !== w) {
            weightLogs.push({ date: today, netWeight: curW, stage: stgId, note: 'Текущий вес при добавлении' });
          }
        }
      } else {
        stageHistory.push({ stage: stgId, startDate: today, endDate: null, tempC: loc.temp });
        weightLogs.push({ date: today, netWeight: w, stage: stgId, note: 'Старт партии' });
      }

      const id = 'b-' + Date.now();
      const newBatch = {
        id,
        category: cat,
        title,
        meatType: cat === 'meat' ? cutVal : null,
        pepperPreset: cat === 'pepper' ? cutVal : null,
        diameterMm: cat === 'meat' ? diam : null,
        initialWeight: w,
        hangWeight: w,
        brineWater: brine,
        targetLossPct: cat === 'meat' ? targetVal : 0,
        currentStage: stgId,
        locId: loc.id,
        tempC: loc.temp,
        location: loc.label,
        saltPct: cat === 'meat' ? cutObj.saltPct : (stgId === 'ferm_vac' ? cutObj.saltPct : 3.5),
        puffed: false,
        degasCount: 0,
        phValue: 4.1,
        targetDays: cat === 'pepper' ? targetVal : 0,
        createdAt,
        notes,
        stageHistory,
        weightLogs
      };

      store.batches.unshift(newBatch);
      ui.selectedId = id;
      ui.draftWeight = null;
      ui.zoneFilter = 'all';
      persistStore();
      closeBatchModal();
      haptic('success');
      showToast(`Добавлено: «${title}»`);
      navigate('detail', id);
    }

    function deleteEditingBatch() {
      if (!ui.modal.editingId) return;
      if (!confirm('Удалить эту партию навсегда?')) return;
      store.batches = store.batches.filter(x => x.id !== ui.modal.editingId);
      ui.selectedId = store.batches.length ? store.batches[0].id : null;
      persistStore();
      closeBatchModal();
      haptic('medium');
      showToast('Партия удалена');
      navigate('home');
    }

    // Boot
    loadStore();
    ui.selectedId = store.batches.length ? store.batches[0].id : null;
    render();
  </script>
</body>
</html>
