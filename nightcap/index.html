<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05050d" />
  <title>nightcap. — Космическая туманность коктейлей</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="cosmos-app">
    <!-- ==================== VAUL SCALABLE APP STAGE ==================== -->
    <div id="app-stage" class="app-stage">
      <!-- ==================== TAB 1: COSMOS NEBULA ==================== -->
      <section id="screen-nebula" class="tab-screen nebula-screen is-active" data-tab="nebula">
        <canvas id="nebula-canvas" aria-hidden="true"></canvas>
        <div id="tag-layer" aria-label="Вращающаяся туманность тегов"></div>

        <!-- Floating Top Chrome: Sci-Fi Brand + Minimal Utility Pills + Lens Rail -->
        <div id="nebula-top-chrome" class="nebula-top-chrome">
          <header class="app-header">
            <div class="brand-mark">
              <span class="brand-text">nightcap<span class="brand-dot">.</span></span>
              <svg class="brand-spark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <defs>
                  <linearGradient id="logoSpark" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f7b2d9" />
                    <stop offset="52%" stop-color="#c79bff" />
                    <stop offset="100%" stop-color="#7dd3fc" />
                  </linearGradient>
                </defs>
                <path d="M12 1L14.4 9.6L23 12L14.4 14.4L12 23L9.6 14.4L1 12L9.6 9.6L12 1Z" fill="url(#logoSpark)" />
              </svg>
            </div>

            <div class="header-actions">
              <button id="spin-surprise-btn" type="button" class="glass-pill surprise-btn" data-tactile>
                <span data-icon="sparkles" data-icon-class="icon-xs text-neon"></span>
                <span>Удиви меня</span>
              </button>

              <button id="pause-btn" type="button" class="glass-pill circle-pill-btn" data-tactile title="Пауза / вращение" aria-label="Пауза вращения">
                <span id="pause-icon" data-icon="pause" data-icon-class="icon-sm"></span>
              </button>
            </div>
          </header>

          <div id="lens-strip" class="lens-strip" role="tablist" aria-label="Фильтр настроения"></div>
        </div>
      </section>

      <!-- ==================== TAB 2: MENU (КАРТА) ==================== -->
      <section id="screen-menu" class="tab-screen content-screen hidden" data-tab="menu"></section>

      <!-- ==================== TAB 3: SAVED (ТАЙНИК) ==================== -->
      <section id="screen-saved" class="tab-screen content-screen hidden" data-tab="saved"></section>

      <!-- ==================== FLOATING BOTTOM STACK ==================== -->
      <div id="bottom-stack" class="bottom-stack">
        <div id="orbit-hint" class="orbit-hint">
          Крути туманность · жми «Заебенить»
        </div>

        <!-- Bottom Console: Always-Armed Vibe Confirm -> Optional Compact Word Search -->
        <div id="cosmos-console" class="cosmos-console glass-chrome">
          <!-- State A (Default): Always armed with the centered star -->
          <div id="console-confirm" class="console-confirm">
            <div class="selected-vibe-bar">
              <div class="selected-vibe-info">
                <span id="selected-vibe-dot" class="selected-vibe-dot"></span>
                <div class="selected-vibe-texts">
                  <div id="selected-vibe-title" class="selected-vibe-title"></div>
                  <div id="selected-vibe-sub" class="selected-vibe-sub"></div>
                </div>
              </div>
              <div class="caught-controls">
                <button id="clear-custom-btn" type="button" class="clear-x-btn hidden" data-tactile aria-label="Сбросить свой запрос">
                  <span data-icon="x" data-icon-class="icon-xs"></span>
                </button>
                <button id="open-search-btn" type="button" class="console-search-btn" data-tactile aria-label="Поиск по слову">
                  <span data-icon="search" data-icon-class="icon-xs"></span>
                </button>
              </div>
            </div>

            <button id="mix-btn" type="button" class="confirm-cta-btn" data-tactile>
              <span class="confirm-cta-shimmer" aria-hidden="true"></span>
              <span data-icon="zap" data-icon-class="icon-sm confirm-cta-zap"></span>
              <span class="confirm-cta-label">Заебенить</span>
            </button>
          </div>

          <!-- State B (Only when user taps 🔍): Compact custom word search -->
          <div id="console-search" class="console-search hidden">
            <div id="word-suggestions" class="word-suggestions hidden" role="listbox" aria-label="Подсказки"></div>
            <div class="console-search-row">
              <form id="word-form" class="word-form" novalidate>
                <span data-icon="search" data-icon-class="icon-xs text-muted"></span>
                <input id="word-input" type="search" enterkeyhint="search" maxlength="45" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Слово: джин, маракуйя, 0%…" />
                <button type="submit" class="word-submit-btn" data-tactile aria-label="Найти вайб">+</button>
              </form>
              <button id="close-search-btn" type="button" class="clear-x-btn" data-tactile aria-label="Закрыть поиск">
                <span data-icon="x" data-icon-class="icon-xs"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Minimalist Understated 3-Tab Cosmic Navigation Dock -->
        <nav id="cosmic-dock" aria-label="Навигация" class="cosmic-dock-wrap">
          <div class="cosmic-dock">
            <span id="dock-pill-indicator" class="dock-pill-indicator" aria-hidden="true"></span>

            <button type="button" data-nav="nebula" class="nav-item active" data-tactile>
              <span data-icon="orbit" data-icon-class="icon-nav"></span>
              <span>Космос</span>
            </button>

            <button type="button" data-nav="menu" class="nav-item" data-tactile>
              <span data-icon="book-open" data-icon-class="icon-nav"></span>
              <span>Карта</span>
            </button>

            <button type="button" data-nav="saved" class="nav-item" data-tactile>
              <span class="nav-icon-wrap">
                <span data-icon="heart" data-icon-class="icon-nav"></span>
                <span id="nav-badge-saved" class="nav-badge hidden"></span>
              </span>
              <span>Тайник</span>
            </button>
          </div>
        </nav>
      </div>
    </div>

    <!-- ==================== 1-SECOND COSMIC SHAKER RITUAL OVERLAY ==================== -->
    <div id="mix-ritual" class="mix-ritual hidden" aria-hidden="true">
      <div class="ritual-mist ritual-mist-a" aria-hidden="true"></div>
      <div class="ritual-mist ritual-mist-b" aria-hidden="true"></div>

      <div class="ritual-stage">
        <div class="ritual-shaker-wrap" aria-hidden="true">
          <svg class="ritual-shaker-svg" viewBox="0 0 140 190" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="shakerMetal" x1="20%" y1="0%" x2="88%" y2="100%">
                <stop offset="0%" stop-color="#f7f4ff" stop-opacity="0.92" />
                <stop offset="28%" stop-color="#c9c2e8" stop-opacity="0.62" />
                <stop offset="62%" stop-color="#4e4776" stop-opacity="0.58" />
                <stop offset="100%" stop-color="#9e96cc" stop-opacity="0.72" />
              </linearGradient>
              <linearGradient id="shakerCapMetal" x1="15%" y1="0%" x2="90%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
                <stop offset="42%" stop-color="#d2cbf0" stop-opacity="0.74" />
                <stop offset="100%" stop-color="#60578a" stop-opacity="0.72" />
              </linearGradient>
              <linearGradient id="shakerCoreLiquid" x1="25%" y1="0%" x2="75%" y2="100%">
                <stop offset="0%" stop-color="var(--ritual-c1, #f7b2d9)" stop-opacity="0.92" />
                <stop offset="55%" stop-color="var(--ritual-c2, #7dd3fc)" stop-opacity="0.78" />
                <stop offset="100%" stop-color="var(--ritual-c1, #c79bff)" stop-opacity="0.95" />
              </linearGradient>
              <linearGradient id="shakerRib" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88" />
                <stop offset="50%" stop-color="#ffffff" stop-opacity="0.34" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
              </linearGradient>
              <radialGradient id="shakerInnerHalo" cx="50%" cy="54%" r="48%">
                <stop offset="0%" stop-color="var(--ritual-c1, #c79bff)" stop-opacity="0.46" />
                <stop offset="60%" stop-color="var(--ritual-c2, #7dd3fc)" stop-opacity="0.16" />
                <stop offset="100%" stop-color="#000000" stop-opacity="0" />
              </radialGradient>
            </defs>

            <!-- Soft zero-blur aura behind shaker -->
            <ellipse cx="70" cy="108" rx="56" ry="62" fill="url(#shakerInnerHalo)" />

            <!-- Top Cobbler Cap -->
            <path d="M55 26 C55 20.5 61.5 18 70 18 C78.5 18 85 20.5 85 26 L86 42 L54 42 Z" fill="url(#shakerCapMetal)" stroke="rgba(255,255,255,0.62)" stroke-width="1.2" />
            <ellipse cx="70" cy="24" rx="11.5" ry="2.6" fill="rgba(255,255,255,0.52)" />

            <!-- Strainer Shoulder Dome -->
            <path d="M52 42 L88 42 C96 48 103 58 105 68 L35 68 C37 58 44 48 52 42 Z" fill="url(#shakerMetal)" stroke="rgba(255,255,255,0.48)" stroke-width="1.2" />

            <!-- Main Tapered Tin Body -->
            <path d="M35 68 L105 68 L95 162 C94 169 84 174 70 174 C56 174 46 169 45 162 Z" fill="url(#shakerMetal)" stroke="rgba(255,255,255,0.46)" stroke-width="1.35" />

            <!-- Glowing Cosmic Liquid Core Window -->
            <path d="M44 77 L96 77 L88.5 156 C87.8 161 80 165 70 165 C60 165 52.2 161 51.5 156 Z" fill="url(#shakerCoreLiquid)" opacity="0.88" />
            <ellipse cx="70" cy="77" rx="26" ry="3.6" fill="rgba(255,255,255,0.44)" />

            <!-- Suspended Crystal Ice Facets Inside Core -->
            <g opacity="0.72">
              <rect x="54" y="92" width="14" height="14" rx="3" transform="rotate(-14 61 99)" fill="rgba(255,255,255,0.34)" stroke="rgba(255,255,255,0.72)" stroke-width="0.9" />
              <rect x="72" y="108" width="13" height="13" rx="3" transform="rotate(18 78 114)" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.65)" stroke-width="0.9" />
              <rect x="57" y="128" width="12" height="12" rx="2.5" transform="rotate(11 63 134)" fill="rgba(255,255,255,0.24)" stroke="rgba(255,255,255,0.58)" stroke-width="0.85" />
            </g>

            <!-- Specular Brushed-Metal Ribs & Seam Rings -->
            <path d="M44 72 L52 159" stroke="url(#shakerRib)" stroke-width="4.2" stroke-linecap="round" />
            <path d="M95 74 L89 156" stroke="rgba(255,255,255,0.24)" stroke-width="1.6" stroke-linecap="round" />
            <ellipse cx="70" cy="68" rx="35" ry="4.4" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.3" />
            <ellipse cx="70" cy="42" rx="18" ry="2.4" fill="none" stroke="rgba(255,255,255,0.52)" stroke-width="1.1" />
            <path d="M51 163 Q70 171 89 163" stroke="rgba(255,255,255,0.44)" stroke-width="1.2" stroke-linecap="round" />

            <!-- Twin Twinkling Starlight Accents -->
            <path class="shaker-spark shaker-spark-1" d="M113 30 L115.2 37.8 L123 40 L115.2 42.2 L113 50 L110.8 42.2 L103 40 L110.8 37.8 Z" fill="#fff7ff" />
            <path class="shaker-spark shaker-spark-2" d="M24 96 L25.6 101.4 L31 103 L25.6 104.6 L24 110 L22.4 104.6 L17 103 L22.4 101.4 Z" fill="var(--ritual-c2, #7dd3fc)" />
          </svg>
        </div>

        <div class="ritual-caption">
          <div id="ritual-vibe" class="ritual-vibe"></div>
          <div id="ritual-status" class="ritual-status">Ловим вайб…</div>
        </div>
      </div>
    </div>

    <!-- ==================== OVERLAYS (OUTSIDE VAUL SCALED STAGE) ==================== -->
    <div id="results-sheet" class="sheet-overlay hidden" role="dialog" aria-modal="true" aria-label="Подборка коктейлей"></div>
    <div id="recipe-modal" class="recipe-overlay hidden" role="dialog" aria-modal="true" aria-label="Рецепт коктейля"></div>

    <!-- Floating Sonner-style Toast -->
    <div id="toast" class="toast" aria-live="polite">
      <div class="toast-pill glass-chrome">
        <span data-icon="sparkles" data-icon-class="icon-xs text-neon"></span>
        <span id="toast-text"></span>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
