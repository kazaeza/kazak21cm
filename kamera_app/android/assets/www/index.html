<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>КАМЕРА</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', 'Roboto Mono', ui-monospace, monospace;

      --safe-top: 0px;
      --safe-bottom: 0px;

      /* Signature Pastel Palette (from user reference boards) */
      --ink: #18191C;
      --ink-soft: #2A2C32;
      --text-sec: #686662;
      --text-muted: #98938A;

      --cream-bg: #FAF8F1;
      --cream-card: #F3EFE4;
      --cream-warm: #F5E9DC;
      --white: #FFFFFF;

      --coral: #EA7B72;
      --coral-deep: #C45249;
      --apricot: #EE9D68;
      --apricot-deep: #C8713B;
      --sage: #8FB184;
      --sage-deep: #56794C;
      --teal: #3B7D71;
      --teal-deep: #295D53;
      --butter: #F5D547;
      --butter-soft: #FCF6D8;
      --mustard: #EDA944;
      --lavender: #8884E6;
      --lavender-deep: #5B57B8;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--cream-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    input, select, textarea {
      user-select: text;
      font-family: var(--font-sans);
    }

    .app-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--cream-bg);
    }

    .screen-viewport {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(92px + var(--safe-bottom));
    }

    .screen-viewport::-webkit-scrollbar { width: 0; height: 0; }

    .safe-top-pad {
      padding-top: calc(14px + var(--safe-top));
    }

    /* COMMON BUTTONS & PILLS */
    .circle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(24, 25, 28, 0.08);
      background: var(--white);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.14s var(--ease);
    }
    .circle-btn:active { transform: scale(0.92); }

    .circle-btn.on-pastel {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.25);
      color: var(--white);
    }

    .btn-butter {
      border: none;
      background: var(--butter);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      padding: 12px 20px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 6px 18px rgba(245, 213, 71, 0.35);
      transition: transform 0.14s var(--ease);
    }
    .btn-butter:active { transform: scale(0.96); }

    .btn-ink {
      border: none;
      background: var(--ink);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.14s var(--ease);
    }
    .btn-ink:active { transform: scale(0.96); }

    /* =====================================================================
       SCREEN 1: HOME (ПОГРЕБ)
       ===================================================================== */
    .home-header {
      padding: calc(14px + var(--safe-top)) 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .avatar-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--butter);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      border: 2.5px solid var(--white);
      box-shadow: 0 5px 14px rgba(24, 25, 28, 0.08);
      flex-shrink: 0;
    }

    .heute-split {
      margin: 4px 18px 16px;
      background: var(--white);
      border-radius: 26px;
      display: grid;
      grid-template-columns: 1fr 108px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(24, 25, 28, 0.05);
    }

    .heute-left {
      padding: 16px 15px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .heute-right {
      background: var(--butter);
      padding: 15px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .heute-right:active { filter: brightness(0.95); }

    .quick-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 0;
      font-size: 12.5px;
      cursor: pointer;
    }

    .quick-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid rgba(24, 25, 28, 0.13);
      background: var(--cream-bg);
      font-size: 11px;
      font-weight: 800;
      min-width: 60px;
      font-family: var(--font-mono);
    }

    .zone-strip {
      padding: 0 18px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 14px;
    }
    .zone-strip::-webkit-scrollbar { display: none; }

    .zone-chip {
      border: none;
      background: var(--white);
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 99px;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
      transition: all 0.18s var(--ease);
    }
    .zone-chip.active {
      background: var(--ink);
      color: var(--white);
    }

    .section-row {
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
    }

    .pastel-grid {
      padding: 0 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .pastel-card {
      border-radius: 26px;
      padding: 13px 13px 14px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 184px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(24, 25, 28, 0.08);
      transition: transform 0.18s var(--ease);
    }
    .pastel-card:active { transform: scale(0.97); }

    .card-ring-mini {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      font-family: var(--font-mono);
    }

    .card-art-slot {
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    /* =====================================================================
       SCREEN 2: FULL-BLEED PASTEL HERO + ARC WEIGH-IN DIAL
       ===================================================================== */
    .detail-hero {
      padding: calc(14px + var(--safe-top)) 18px 28px;
      color: var(--white);
      min-height: 325px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.35s var(--ease);
      position: relative;
    }

    .detail-sheet {
      background: var(--white);
      border-radius: 30px 30px 0 0;
      margin-top: -20px;
      position: relative;
      z-index: 3;
      padding: 20px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: calc(100vh - 310px);
    }

    .stage-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .stage-pill {
      border: 1.5px solid rgba(24, 25, 28, 0.16);
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.18s var(--ease);
    }
    .stage-pill:active { transform: scale(0.95); }
    .stage-pill.active-yellow {
      background: var(--butter);
      border-color: var(--butter);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(245, 213, 71, 0.4);
    }

    .meta-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 6px;
      border-top: 1px solid rgba(24, 25, 28, 0.06);
    }

    .meta-cell {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
    }

    .meta-ico {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--cream-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .diag-banner {
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--cream-bg);
      border: 1px solid rgba(24, 25, 28, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }

    /* LAYERED MUSTARD + TEAL ARC DIAL (from image.png top-left) */
    .arc-dial-card {
      border-radius: 28px;
      background: var(--mustard);
      overflow: hidden;
      padding-top: 13px;
      color: var(--white);
      box-shadow: 0 12px 28px rgba(59, 125, 113, 0.18);
    }

    .arc-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px 10px;
    }

    .gross-toggle {
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 99px;
      cursor: pointer;
    }

    .arc-teal-body {
      background: var(--teal);
      border-radius: 50% 50% 0 0 / 40px 40px 0 0;
      padding: 16px 16px 18px;
      text-align: center;
    }

    .weight-inline-input {
      width: 112px;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      padding: 4px 6px;
      outline: none;
    }
    .weight-inline-input:focus {
      background: rgba(255, 255, 255, 0.24);
      border-color: var(--butter);
    }

    .arc-steppers {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 12px;
    }

    .teal-step-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .teal-step-btn:active { background: rgba(255, 255, 255, 0.32); }

    .teal-save-btn {
      height: 44px;
      padding: 0 16px;
      border-radius: 99px;
      border: 3.5px solid rgba(255, 255, 255, 0.24);
      background: var(--cream-bg);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }
    .teal-save-btn:active { transform: scale(0.96); }

    /* =====================================================================
       SCREEN 3: ANALYTICS & WAVE CURVE ("78% LEARNING PLAN" from image.png)
       ===================================================================== */
    .analytics-wrap {
      padding: calc(14px + var(--safe-top)) 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .capsules-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-cap {
      background: var(--cream-card);
      border-radius: 28px;
      padding: 12px 8px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-cap-ico {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .stat-cap-num {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-family: var(--font-mono);
    }

    .stat-cap-lbl {
      font-size: 11px;
      color: var(--text-sec);
      font-weight: 600;
      margin-top: 2px;
    }

    .giant-pct-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
    }

    .giant-num {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.94;
    }

    .wave-card {
      background: var(--white);
      border-radius: 26px;
      padding: 15px 14px 13px;
      box-shadow: 0 8px 24px rgba(24, 25, 28, 0.045);
    }

    .month-pills-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      gap: 4px;
    }

    .m-pill {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-sec);
      padding: 4px 8px;
      border-radius: 99px;
      border: 1.5px solid transparent;
    }
    .m-pill.active-ring {
      border-color: var(--ink);
      color: var(--ink);
      font-weight: 800;
    }

    .caps-bar-card {
      background: var(--cream-warm);
      border-radius: 26px;
      padding: 16px;
    }

    .caps-stage {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      align-items: end;
      height: 116px;
      padding-top: 8px;
    }

    .v-bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      height: 100%;
      justify-content: flex-end;
    }

    .v-bar-pill {
      width: 32px;
      border-radius: 99px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 6px;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--white);
      transition: height 0.35s var(--ease);
    }

    .journal-card {
      background: var(--white);
      border-radius: 24px;
      padding: 15px;
      box-shadow: 0 6px 20px rgba(24, 25, 28, 0.04);
    }

    .journal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(24, 25, 28, 0.06);
      font-size: 12.5px;
    }
    .journal-item:last-child { border-bottom: none; }

    /* =====================================================================
       SCREEN 4: SIMULATOR & SETTINGS
       ===================================================================== */
    .sim-card {
      background: var(--white);
      border-radius: 26px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(24, 25, 28, 0.045);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input[type="range"].craft-range {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 99px;
      background: var(--cream-card);
      outline: none;
    }
    input[type="range"].craft-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      border: 3px solid var(--butter);
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    /* FLOATING BLACK PILL BOTTOM NAV (from image.png!) */
    .bottom-dock {
      position: fixed;
      bottom: calc(12px + var(--safe-bottom));
      left: 18px;
      right: 18px;
      max-width: 440px;
      margin: 0 auto;
      height: 60px;
      background: var(--ink);
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      box-shadow: 0 14px 32px rgba(24, 25, 28, 0.28);
      z-index: 40;
    }

    .dock-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.18s var(--ease);
    }
    .dock-btn.active {
      background: rgba(255, 255, 255, 0.16);
      color: var(--white);
    }

    .dock-fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--butter);
      color: var(--ink);
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 213, 71, 0.4);
    }
    .dock-fab:active { transform: scale(0.92); }

    /* MODAL BOTTOM SHEET */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 25, 28, 0.48);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .sheet-backdrop.open { display: flex; }

    .sheet-panel {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--cream-bg);
      border-radius: 32px 32px 0 0;
      padding: 22px 20px calc(24px + var(--safe-bottom));
      animation: slideUp 0.25s var(--ease);
    }

    @keyframes slideUp {
      from { transform: translateY(36px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .f-group { margin-bottom: 12px; }
    .f-lbl {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sec);
      margin-bottom: 5px;
    }
    .f-inp {
      width: 100%;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1.5px solid rgba(24, 25, 28, 0.1);
      background: var(--white);
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }
    .f-inp:focus { border-color: var(--ink); }

    /* TOAST FEEDBACK */
    .toast-pill {
      position: fixed;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--ink);
      color: var(--white);
      font-size: 12.5px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 99px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      z-index: 200;
      transition: transform 0.28s var(--ease);
      white-space: nowrap;
    }
    .toast-pill.show { transform: translateX(-50%) translateY(0); }

    @keyframes floatBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .floating-3d { animation: floatBob 4.2s ease-in-out infinite; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-root">
    <div class="screen-viewport" id="viewport"></div>

    <!-- Floating Black Bottom Navigation Pill -->
    <nav class="bottom-dock">
      <button class="dock-btn active" id="dock-home" onclick="navigate('home')" aria-label="Погреб">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></svg>
      </button>
      <button class="dock-btn" id="dock-detail" onclick="navigate('detail')" aria-label="Кусок и весы">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-2 6h4l-2-6z"/><path d="M19 7l-2 6h4l-2-6z"/></svg>
      </button>
      <button class="dock-fab" onclick="openBatchModal(null)" aria-label="Новая закладка">＋</button>
      <button class="dock-btn" id="dock-analytics" onclick="navigate('analytics')" aria-label="Кривая">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3 0 4-6 7-6s4 4 7-3 4-4 4-4"/><circle cx="17" cy="8" r="2"/></svg>
      </button>
      <button class="dock-btn" id="dock-sim" onclick="navigate('sim')" aria-label="Симулятор и настройки">

      if (!iso) return 'Сегодня';

      const a = new Date(isoStart + 'T12:00:00').getTime();

    let store = null;

    function loadStore() {
      let raw = '';
      if (hasAndroid && window.AndroidBridge.loadState) {
        try { raw = window.AndroidBridge.loadState(); } catch (e) {}
      }
      if (!raw) {
        try { raw = localStorage.getItem('kamera_store_v1') || ''; } catch (e) {}
      }
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.batches)) {
            store = parsed;
            if (!store.settings) store.settings = { lossBase: 'raw' };
            return;
          }
        } catch (e) {}
      }
      store = createDemoData();
      persistStore();
    }

    function persistStore() {
      const json = JSON.stringify(store);
      try { localStorage.setItem('kamera_store_v1', json); } catch (e) {}
      if (hasAndroid && window.AndroidBridge.saveState) {
        try { window.AndroidBridge.saveState(json); } catch (e) {}
      }
    }

    let ui = {
      screen: 'home', // 'home' | 'detail' | 'analytics' | 'sim'
      selectedId: null,
      zoneFilter: 'all',
      weighMode: 'gross', // 'gross' (с тарой) | 'net' (чистый)
      draftWeightInput: null, // numeric value currently shown in arc dial (in active weighMode)
      metricMode: 'readiness', // 'readiness' | 'loss'
      editingBatchId: null,
      sim: {
        meat: 0.78,

    // =========================================================================
    // 4. NON-LINEAR FICK'S LAW DRYING ENGINE
    // =========================================================================
    function getZoneOfBatch(b) {
      if (b.currentStage === 'done') return 'done';
      if (b.category === 'pepper' || b.tempC >= 17) return 'warm';
      if (b.tempC <= 7) return 'fridge';
      return 'chamber';
    }

    function analyze(batch) {
      const today = daysAgoISO(0);
      if (batch.category === 'pepper') {
        const elapsedDays = Math.max(1, diffDays(batch.createdAt, today));
        const targetDays = batch.targetDays || 21;
        const readinessPct = Math.min(100, Math.round((elapsedDays / targetDays) * 100));
        const remDays = Math.max(0, targetDays - elapsedDays);
        const totalMass = batch.initialWeight + (batch.brineWater || 0);
        const saltGrams = ((totalMass * (batch.saltPct || 2.8)) / 100).toFixed(1);
        return {
          isPepper: true,
          W0: batch.initialWeight,
          Wcur: batch.initialWeight,
          targetWeight: batch.initialWeight,
          lostGrams: 0,
          lossPct: 0,
          readinessPct,
          remDays,
          elapsedDays,
          activeDryingDays: elapsedDays,
          vacuumDays: batch.currentStage === 'ferm_vac' ? elapsedDays : 0,
          saltGrams,
          speedPctDay: 0,
          k_eff: 0.04,
          crustDiag: null
        };
      }

      const useHang = store.settings.lossBase === 'hang' && batch.hangWeight;
      const W0 = useHang ? batch.hangWeight : batch.initialWeight;
      const lastLog = batch.weightLogs[batch.weightLogs.length - 1] || { date: batch.createdAt, netWeight: batch.initialWeight };
      const Wcur = lastLog.netWeight;
      const targetWeight = Math.round(W0 * (1 - (batch.targetLossPct || 35) / 100));
      const lostGrams = Math.max(0, W0 - Wcur);
      const lossPct = Math.max(0, ((W0 - Wcur) / W0) * 100);
      const readinessPct = Math.min(100, Math.max(0, Math.round((lossPct / (batch.targetLossPct || 35)) * 100)));

      // Prior Fick diffusion coefficient from meat type, casing, diameter, temp
      const W_inf = 0.44 * W0;
      const meatF = (MEAT_TYPES[batch.meatType] || { factor: 1.0 }).factor;
      const stg = STAGES[batch.currentStage] || STAGES.dry_casing;
      const methodF = stg.methodF || 0.85;
      const diamF = Math.pow(75 / Math.max(32, batch.diameterMm || 85), 1.42);
      const tempF = 0.68 + 0.32 * ((batch.tempC || 12) / 12);
      const k_prior = 0.034 * meatF * methodF * diamF * tempF;

      let activeDryingDays = 0;
      let vacuumDays = 0;
      let cureDays = 0;
      for (const h of batch.stageHistory) {
        const dur = Math.max(0, diffDays(h.startDate, h.endDate || today));
        if (STAGES[h.stage] && STAGES[h.stage].isDrying) activeDryingDays += dur;
        if (h.stage === 'rehydrate_vac') vacuumDays += dur;
        if (h.stage === 'cure_vac') cureDays += dur;
      }

      let k_emp = null;
      if (activeDryingDays >= 3 && Wcur < W0 && Wcur > W_inf + 10) {
        const ratio = (Wcur - W_inf) / (W0 - W_inf);
        if (ratio > 0.05 && ratio < 0.99) {
          k_emp = -Math.log(ratio) / activeDryingDays;
        }
      }

      const empTrust = Math.min(0.85, activeDryingDays / 14);
      const k_eff = k_emp !== null ? (k_emp * empTrust + k_prior * (1 - empTrust)) : k_prior;

      let remDays = 0;
      if (Wcur > targetWeight && Wcur > W_inf + 5 && targetWeight > W_inf) {
        const rNeed = (targetWeight - W_inf) / (Wcur - W_inf);
        if (rNeed > 0 && rNeed < 1) {
          remDays = Math.ceil(-Math.log(rNeed) / Math.max(0.004, k_eff));
        }
      }

      let speedPctDay = 0;
      if (batch.weightLogs.length >= 2) {
        const prev = batch.weightLogs[batch.weightLogs.length - 2];
        const dt = Math.max(1, diffDays(prev.date, lastLog.date));
        speedPctDay = Math.max(0, (((prev.netWeight - lastLog.netWeight) / W0) * 100) / dt);
      }

      let crustDiag = null;
      if (batch.currentStage === 'rehydrate_vac') {
        crustDiag = {
          kind: 'rehyd',
          title: 'Идёт регидратация оболочки',
          text: `В вакууме ${vacuumDays} дн. Таймер сушки на паузе — когда корка станет мягкой, верни на подвес.`,
          cta: 'На довяливание',
          targetStage: 'dry_casing'
        };
      } else if (batch.currentStage === 'dry_naked' && (batch.diameterMm || 85) >= 75 && speedPctDay >= 1.65) {
        crustDiag = {
          kind: 'risk',
          title: 'Риск закала корки!',
          text: `Высокий темп (${speedPctDay.toFixed(2)}%/сут) без оболочки при Ø${batch.diameterMm}мм. Можно запаять в вакуум на 5–7 дн.`,
          cta: 'В вакуум',
          targetStage: 'rehydrate_vac'
        };
      }

      return {
        isPepper: false,
        W0, Wcur, W_inf, targetWeight, lostGrams,
        lossPct, readinessPct, remDays,
        elapsedDays: diffDays(batch.createdAt, today),
        activeDryingDays, vacuumDays, cureDays,
        k_eff, speedPctDay, crustDiag
      };
    }

    // =========================================================================
    // 6. NAVIGATION & SCREEN RENDERERS
    // =========================================================================
    function getSelectedBatch() {
      if (!store.batches.length) return null;
      const found = store.batches.find(b => b.id === ui.selectedId);
      if (found) return found;
      ui.selectedId = store.batches[0].id;
      return store.batches[0];
    }

    function navigate(screen, batchId) {
      if (batchId) {
        ui.selectedId = batchId;
        ui.draftWeightInput = null;
      }
      if ((screen === 'detail' || screen === 'analytics') && !store.batches.length) {
        showToast('Сначала добавь первую партию');
        openBatchModal(null);
        return;
      }
      ui.screen = screen;
      haptic('light');
      render();
      document.getElementById('viewport').scrollTop = 0;
    }

    window.handleAndroidBack = function() {
      if (document.getElementById('batch-modal').classList.contains('open')) {
        closeBatchModal();
        return true;
      }
      if (ui.screen !== 'home') {
        navigate('home');
        return true;
      }
      return false;
    };

    function render() {
      // Sync bottom dock active state
      ['home', 'detail', 'analytics', 'sim'].forEach(k => {
        document.getElementById('dock-' + k).classList.toggle('active', ui.screen === k);
      });

      const vp = document.getElementById('viewport');
      if (ui.screen === 'home') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildHomeScreen();
      } else if (ui.screen === 'detail') {
        const b = getSelectedBatch();
        const stg = b ? (STAGES[b.currentStage] || STAGES.dry_casing) : STAGES.dry_casing;
        setStatusBar(stg.hex, false);
        vp.innerHTML = buildDetailScreen(b);
      } else if (ui.screen === 'analytics') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildAnalyticsScreen(getSelectedBatch());
      } else if (ui.screen === 'sim') {
        setStatusBar('#FAF8F1', true);
        vp.innerHTML = buildSimScreen();
      }
    }

    // --- SCREEN 2: PRODUCT HERO + STAGE SWITCHER + ARC WEIGH-IN DIAL ---
    function buildDetailScreen(batch) {
      if (!batch) return '';
      const stg = STAGES[batch.currentStage] || STAGES.dry_casing;
      const an = analyze(batch);

      const r = 20;
      const c = 2 * Math.PI * r;
      const off = c * (1 - an.readinessPct / 100);

      const stageList = batch.category === 'pepper'
        ? ['ferm_vac', 'ferm_brine', 'done']
        : ['cure_vac', 'smoke', 'dry_casing', 'dry_naked', 'rehydrate_vac', 'done'];

      // Initialize draft weigh-in input value cleanly
      const tare = batch.tareWeight || 0;
      if (ui.draftWeightInput === null) {
        ui.draftWeightInput = ui.weighMode === 'gross' ? (an.Wcur + tare) : an.Wcur;
      }
      const previewNet = ui.weighMode === 'gross' ? Math.max(10, ui.draftWeightInput - tare) : Math.max(10, ui.draftWeightInput);
      const previewLoss = Math.max(0, ((an.W0 - previewNet) / an.W0) * 100).toFixed(1);

      // Semi-circular arc ticks
      let ticks = '';
      for (let i = 0; i <= 24; i++) {
        const angle = Math.PI + (i / 24) * Math.PI;
        const active = (i / 24) * 100 <= an.readinessPct;
        const x1 = 130 + Math.cos(angle) * 86;
        const y1 = 92 + Math.sin(angle) * 86;
        const x2 = 130 + Math.cos(angle) * 94;
        const y2 = 92 + Math.sin(angle) * 94;
        ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${active ? '#FFFFFF' : 'rgba(255,255,255,0.28)'}" stroke-width="2.4" stroke-linecap="round"/>`;
      }
      const ka = Math.PI + (Math.min(100, Math.max(0, an.readinessPct)) / 100) * Math.PI;
      const kx = 130 + Math.cos(ka) * 72;
      const ky = 92 + Math.sin(ka) * 72;

      return `
        <div class="detail-hero" style="background:${stg.hex};">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div style="min-width:0;">
              <div style="display:flex;gap:8px;margin-bottom:10px;">
                <button class="circle-btn on-pastel" onclick="navigate('home')">←</button>
                <button class="circle-btn on-pastel" onclick="openBatchModal('${batch.id}')" title="Редактировать">✎</button>
              </div>
              <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.09em;opacity:0.86;font-weight:700;">${batch.location}</div>
              <h1 style="font-size:28px;font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin-top:2px;">${batch.title}</h1>
            </div>

            <div style="display:flex;flex-direction:column;align-items:center;text-align:center;" onclick="navigate('analytics')">
              <div style="position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;">
                <svg width="52" height="52" viewBox="0 0 52 52" style="transform:rotate(-90deg);">
                  <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="3.4"/>
                  <circle cx="26" cy="26" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"
                    stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
                </svg>
                <span style="position:absolute;font-size:11px;font-weight:800;font-family:var(--font-mono);">${an.readinessPct}%</span>
              </div>
              <span style="font-size:10px;font-weight:700;opacity:0.92;margin-top:2px;">
                ${batch.currentStage === 'cure_vac' ? 'Посол' : `~${an.remDays} дн`}
              </span>
            </div>
          </div>

          <div style="height:176px;display:flex;align-items:center;justify-content:center;margin:4px 0;">
            ${renderArt(batch, 'large')}
          </div>
        </div>

        <div class="detail-sheet">
          <!-- Stage Switcher Pills -->
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <span style="font-size:12px;font-weight:800;">Этап (можно возвращать вяление ⇄ вакуум)</span>
            </div>
            <div class="stage-pill-row">
              ${stageList.map(sId => {
                const sObj = STAGES[sId];
                const isAct = batch.currentStage === sId;
                return `<button class="stage-pill ${isAct ? 'active-yellow' : ''}" onclick="changeStage('${batch.id}', '${sId}')">${sObj.pill}</button>`;

          <!-- LAYERED MUSTARD + TEAL ARC WEIGH-IN DIAL -->
          ${!an.isPepper ? `

                  -${previewLoss}%

    function buildDynamicSplineSVG(batch, an) {
      // Build real normalized polyline from weight logs + forecast point, smoothed with cubic bezier
      const W = 310, H = 136, padX = 16, padTop = 34, padBot = 16;
      const plotW = W - padX * 2, plotH = H - padTop - padBot;

      let rawPts = [];
      if (an.isPepper) {
        rawPts = [
          { t: 0, pct: 0 },
          { t: 0.35, pct: Math.min(100, an.readinessPct * 0.45) },
          { t: 0.72, pct: an.readinessPct },
          { t: 1, pct: 100, projected: true }
        ];
      } else {
        const logs = batch.weightLogs;
        const startDate = batch.createdAt;
        const lastLogDate = logs[logs.length - 1].date;
        const totalElapsed = Math.max(1, diffDays(startDate, lastLogDate));
        const totalSpan = Math.max(totalElapsed + Math.min(35, an.remDays), 10);

        logs.forEach(l => {
          const d = diffDays(startDate, l.date);
          const loss = Math.max(0, ((an.W0 - l.netWeight) / an.W0) * 100);
          const normPct = Math.min(105, (loss / Math.max(1, batch.targetLossPct)) * 100);
          rawPts.push({ t: d / totalSpan, pct: normPct, w: l.netWeight, stage: l.stage });
        });

        if (an.remDays > 0 && an.Wcur > an.targetWeight) {
          rawPts.push({ t: 1, pct: 100, w: an.targetWeight, projected: true });
        }
      }

      const coords = rawPts.map(p => ({
        x: padX + p.t * plotW,
        y: padTop + plotH * (1 - Math.min(105, Math.max(0, p.pct)) / 105),
        ...p
      }));

      // Actual points only vs projected tail
      const actualCoords = coords.filter(c => !c.projected);
      const activePt = actualCoords[actualCoords.length - 1] || coords[0];

      function smoothPath(list) {
        if (list.length < 2) return `M ${list[0].x} ${list[0].y}`;
        let d = `M ${list[0].x.toFixed(1)} ${list[0].y.toFixed(1)}`;
        for (let i = 0; i < list.length - 1; i++) {
          const p0 = list[i], p1 = list[i + 1];
          const cx = ((p0.x + p1.x) / 2).toFixed(1);
          d += ` C ${cx} ${p0.y.toFixed(1)}, ${cx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
        }
        return d;
      }

      const actualD = smoothPath(actualCoords);
      const areaD = actualCoords.length >= 2
        ? `${actualD} L ${activePt.x.toFixed(1)} ${H - padBot} L ${actualCoords[0].x.toFixed(1)} ${H - padBot} Z`
        : '';

      const projPt = coords.find(c => c.projected);
      const projD = projPt
        ? `M ${activePt.x.toFixed(1)} ${activePt.y.toFixed(1)} Q ${((activePt.x + projPt.x)/2).toFixed(1)} ${(activePt.y - 10).toFixed(1)} ${projPt.x.toFixed(1)} ${projPt.y.toFixed(1)}`
        : '';

      const bubbleTxt = an.isPepper ? `${an.readinessPct}%` : `-${an.lossPct.toFixed(1)}%`;
      const bx = Math.min(W - 36, Math.max(36, activePt.x));
      const by = Math.max(26, activePt.y);

      return `
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" fill="none">
          <defs>
            <linearGradient id="wf-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#D96B68" stop-opacity="0.24"/>
              <stop offset="100%" stop-color="#D96B68" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <!-- Target top line -->
          <line x1="${padX}" y1="${padTop + 4}" x2="${W - padX}" y2="${padTop + 4}" stroke="rgba(86,121,76,0.28)" stroke-dasharray="4 4"/>
          ${areaD ? `<path d="${areaD}" fill="url(#wf-grad)"/>` : ''}
          ${projD ? `<path d="${projD}" stroke="#8FB184" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>` : ''}
          <path d="${actualD}" stroke="#C86464" stroke-width="2.8" stroke-linecap="round"/>

          <!-- Vertical guide under active point -->
          <line x1="${activePt.x.toFixed(1)}" y1="${activePt.y.toFixed(1)}" x2="${activePt.x.toFixed(1)}" y2="${H - padBot}" stroke="rgba(24,25,28,0.14)" stroke-dasharray="2 2"/>

          <!-- Subtle pastel circles on intermediate points -->
          ${actualCoords.slice(1, -1).map(pt => `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.5" fill="#FAF8F1" stroke="#C86464" stroke-width="2"/>`).join('')}

          ${projPt ? `<circle cx="${projPt.x.toFixed(1)}" cy="${projPt.y.toFixed(1)}" r="4.5" fill="#8FB184"/>` : ''}

          <!-- Active point dot + Floating Black Pill Callout -->
          <circle cx="${activePt.x.toFixed(1)}" cy="${activePt.y.toFixed(1)}" r="5.5" fill="#18191C" stroke="#FFFFFF" stroke-width="2.2"/>
          <rect x="${(bx - 30).toFixed(1)}" y="${(by - 31).toFixed(1)}" width="60" height="22" rx="11" fill="#18191C"/>
          <text x="${bx.toFixed(1)}" y="${(by - 16.5).toFixed(1)}" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="800">${bubbleTxt}</text>
        </svg>
      `;
    }

    // --- SCREEN 4: SIMULATOR & SETTINGS ---

            </div>

            <div>
              <label class="f-lbl">Вид мяса</label>
              <select class="f-inp" onchange="updateSim('meat', parseFloat(this.value))">
                <option value="1.15" ${s.meat===1.15?'selected':''}>Говядина постная (Брезаола)</option>
                <option value="1.05" ${s.meat===1.05?'selected':''}>Свинина постная (Карбонад / Ломо)</option>
                <option value="0.78" ${s.meat===0.78?'selected':''}>Свинина мраморная (Шея / Коппа)</option>
                <option value="0.65" ${s.meat===0.65?'selected':''}>Грудинка / Панчетта (жирная)</option>
                <option value="1.30" ${s.meat===1.30?'selected':''}>Утиная грудка</option>
              </select>
            </div>

            <div>

                <option value="1.00" ${s.method===1.00?'selected':''}>Подвес без оболочки (1.0×)</option>
                <option value="0.85" ${s.method===0.85?'selected':''}>Коллаген / черева (0.85×)</option>
                <option value="0.68" ${s.method===0.68?'selected':''}>Мембранный пакет Айцел (0.68×)</option>
              </select>
            </div>

            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px;">
                <span>Калибр / толщина куска</span><span>${s.diam} мм</span>
              </div>
              <input type="range" min="35" max="140" step="5" value="${s.diam}" class="craft-range" oninput="updateSim('diam', parseInt(this.value,10))"/>
            </div>

            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px;">
                <span>Стартовый вес</span><span>${s.weight} г</span>

            </div>

            </div>

            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px;">
                <span>Целевая потеря веса</span><span>-${s.target}%</span>
              </div>
              <input type="range" min="25" max="45" step="1" value="${s.target}" class="craft-range" oninput="updateSim('target', parseInt(this.value,10))"/>
            </div>

            <div>
              <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px;">
                <span>Пауза в вакууме (регидратация)</span><span>${s.vacDays} дн</span>
              </div>
              <input type="range" min="0" max="21" step="1" value="${s.vacDays}" class="craft-range" oninput="updateSim('vacDays', parseInt(this.value,10))"/>
            </div>
          </div>

          <!-- App Settings & Data Controls -->
          <div class="sim-card">
            <div style="font-weight:800;font-size:15px;">Настройки учёта</div>

            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <div>
                <div style="font-weight:700;font-size:13px;">База расчёта потери %</div>
                <div style="font-size:11.5px;color:var(--text-sec);">От сырого веса или после слива сока</div>
              </div>
              <button class="stage-pill active-yellow" onclick="toggleLossBase()">
                ${store.settings.lossBase === 'raw' ? 'От сырого' : 'От навески'}
              </button>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:6px;border-top:1px solid rgba(24,25,28,0.06);">
              <button class="btn-ink" style="flex:1;font-size:12px;" onclick="exportBackup()">Поделиться бэкапом</button>
              <button style="flex:1;border:none;background:var(--cream-card);color:var(--ink);font-weight:700;font-size:12px;padding:12px;border-radius:99px;cursor:pointer;" onclick="resetDemo()">Вернуть демо</button>
            </div>

            <button style="border:none;background:#FADCD9;color:#A63A35;font-weight:800;font-size:12px;padding:11px;border-radius:99px;cursor:pointer;" onclick="clearAllBatches()">
              Очистить все партии (начать с чистого листа)
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 7. INTERACTIVE HANDLERS
    // =========================================================================
    function setZoneFilter(z) {
      ui.zoneFilter = z;
      haptic('light');
      render();
    }

    function changeStage(batchId, newStageId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b || b.currentStage === newStageId) return;
      const today = daysAgoISO(0);
      const curH = b.stageHistory[b.stageHistory.length - 1];
      if (curH && !curH.endDate) curH.endDate = today;

      const stg = STAGES[newStageId];
      b.currentStage = newStageId;
      b.tempC = stg.temp;
      b.location = stg.loc;
      if (newStageId.startsWith('dry_') && b.weightLogs.length) {
        b.hangWeight = b.weightLogs[b.weightLogs.length - 1].netWeight;
      }
      b.stageHistory.push({ stage: newStageId, startDate: today, endDate: null, tempC: stg.temp });
      persistStore();
      haptic('medium');
      showToast(`Этап: ${stg.short}`);
      render();
    }

    function toggleWeighMode() {
      const b = getSelectedBatch();
      if (!b) return;
      const tare = b.tareWeight || 0;
      if (ui.weighMode === 'gross') {
        ui.weighMode = 'net';
        ui.draftWeightInput = Math.max(10, (ui.draftWeightInput || b.initialWeight) - tare);
      } else {
        ui.weighMode = 'gross';
        ui.draftWeightInput = (ui.draftWeightInput || b.initialWeight) + tare;
      }
      haptic('light');
      render();
    }

    function onArcWeightInput(val) {
      const n = parseInt(val, 10);
      if (isNaN(n)) return;
      ui.draftWeightInput = n;
      const b = getSelectedBatch();
      if (!b) return;
      const an = analyze(b);
      const tare = b.tareWeight || 0;
      const net = ui.weighMode === 'gross' ? Math.max(10, n - tare) : Math.max(10, n);
      const loss = Math.max(0, ((an.W0 - net) / an.W0) * 100).toFixed(1);
      const badge = document.getElementById('arc-loss-badge');
      const cap = document.getElementById('arc-net-caption');
      if (badge) badge.textContent = `-${loss}%`;
      if (cap) cap.textContent = ui.weighMode === 'gross'
        ? `Нетто: ${net} г · Цель: ${an.targetWeight} г`
        : `Цель: ${an.targetWeight} г (-${b.targetLossPct}%)`;
    }

    function stepDraftWeight(delta) {
      const b = getSelectedBatch();
      if (!b) return;
      ui.draftWeightInput = Math.max(20, (ui.draftWeightInput || b.initialWeight) + delta);
      haptic('light');
      const inp = document.getElementById('arc-weight-input');
      if (inp) {
        inp.value = ui.draftWeightInput;
        onArcWeightInput(ui.draftWeightInput);
      } else {
        render();
      }
    }

    function commitWeighIn(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      const tare = b.tareWeight || 0;
      const rawVal = parseInt(ui.draftWeightInput, 10);
      if (isNaN(rawVal) || rawVal < 20) return;
      const net = ui.weighMode === 'gross' ? Math.max(10, rawVal - tare) : rawVal;

      b.weightLogs.push({
        date: daysAgoISO(0),
        netWeight: net,
        stage: b.currentStage,
        note: ui.weighMode === 'gross' ? `Брутто ${rawVal} г (−${tare}г)` : 'Замер нетто'
      });
      ui.draftWeightInput = null;
      persistStore();
      haptic('success');
      showToast(`Записано: ${net} г нетто`);
      render();
    }

    function deleteWeighLog(batchId, idx) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b || b.weightLogs.length <= 1) return;
      b.weightLogs.splice(idx, 1);
      ui.draftWeightInput = null;
      persistStore();
      haptic('light');
      showToast('Замер удалён');
      render();
    }

    function togglePepperGas(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      if (b.puffed) {
        b.puffed = false;
        b.degasCount = (b.degasCount || 0) + 1;
        showToast('CO₂ стравлен, пакет перепаян!');
      } else {
        b.puffed = true;
        showToast('Отмечена подушка CO₂');
      }
      persistStore();
      haptic('success');
      render();
    }

    function promptPepperPh(batchId) {
      const b = store.batches.find(x => x.id === batchId);
      if (!b) return;
      const val = prompt('Введи текущий pH перцев (напр. 3.6):', String(b.phValue || 3.8));
      const num = parseFloat((val || '').replace(',', '.'));
      if (!isNaN(num) && num > 1 && num < 9) {
        b.phValue = Math.round(num * 10) / 10;
        persistStore();
        haptic('light');
        render();
      }
    }

    function toggleMetricMode() {
      ui.metricMode = ui.metricMode === 'readiness' ? 'loss' : 'readiness';
      haptic('light');
      render();
    }

    function updateSim(key, val) {
      ui.sim[key] = val;
      render();
    }

    function toggleLossBase() {
      store.settings.lossBase = store.settings.lossBase === 'raw' ? 'hang' : 'raw';
      persistStore();
      haptic('light');
      showToast(store.settings.lossBase === 'raw' ? 'База: сырой вес до посола' : 'База: вес перед навеской');
      render();
    }

    function exportBackup() {
      const txt = JSON.stringify(store, null, 2);
      if (hasAndroid && window.AndroidBridge.shareText) {
        window.AndroidBridge.shareText('Бэкап КАМЕРА (JSON)', txt);
      } else {
        navigator.clipboard && navigator.clipboard.writeText(txt);
        showToast('JSON скопирован');
      }
    }

    function resetDemo() {
      if (!confirm('Восстановить демо-партии (Коппа, Брезаола, Habanero)?')) return;
      store = createDemoData();
      ui.selectedId = store.batches[0].id;
      persistStore();
      haptic('medium');
      showToast('Демо-партии восстановлены');
      navigate('home');
    }

    function clearAllBatches() {
      if (!confirm('Удалить все текущие партии и начать с чистого листа?')) return;
      store.batches = [];
      ui.selectedId = null;
      persistStore();
      haptic('medium');
      showToast('Камера очищена');
      navigate('home');
    }

    // =========================================================================
    // 8. ADD / EDIT BATCH MODAL
    // =========================================================================
    function openBatchModal(editId) {
      ui.editingBatchId = editId;
      const modal = document.getElementById('batch-modal');
      const delBtn = document.getElementById('m-delete-btn');
      const heading = document.getElementById('modal-heading');

      if (editId) {
        const b = store.batches.find(x => x.id === editId);
        if (!b) return;
        heading.textContent = 'Редактировать партию';
        delBtn.classList.remove('hidden');
        document.getElementById('m-cat').value = b.category;
        syncModalCategory();
        document.getElementById('m-title').value = b.title;
        if (b.category === 'meat') {
          document.getElementById('m-meat-type').value = b.meatType || 'pork_marbled';
          document.getElementById('m-diam').value = b.diameterMm || 85;
          document.getElementById('m-target').value = b.targetLossPct || 35;
          document.getElementById('m-tare').value = b.tareWeight || 12;
        } else {
          document.getElementById('m-target').value = b.targetDays || 21;
          document.getElementById('m-tare').value = b.brineWater || 0;
        }
        document.getElementById('m-weight').value = b.initialWeight;
        document.getElementById('m-stage').value = b.currentStage;
        document.getElementById('m-temp').value = b.tempC;
        document.getElementById('m-loc').value = b.location || '';
        document.getElementById('m-notes').value = b.notes || '';
      } else {
        heading.textContent = 'Новая закладка';
        delBtn.classList.add('hidden');
        document.getElementById('m-cat').value = 'meat';
        syncModalCategory();
        document.getElementById('m-title').value = '';
        document.getElementById('m-weight').value = 1250;
        document.getElementById('m-diam').value = 90;
        document.getElementById('m-tare').value = 14;
        document.getElementById('m-target').value = 35;
        document.getElementById('m-notes').value = '';
      }

      refreshModalCalc();
      modal.classList.add('open');
      haptic('light');
    }

    function closeBatchModal() {
      document.getElementById('batch-modal').classList.remove('open');
    }

    function syncModalCategory() {
      const cat = document.getElementById('m-cat').value;
      const meatRow = document.getElementById('m-meat-row');
      const stgSel = document.getElementById('m-stage');
      if (cat === 'pepper') {
        meatRow.style.display = 'none';
        stgSel.innerHTML = `
          <option value="ferm_vac">Вакуумный пакет (2.8%)</option>
          <option value="ferm_brine">Банка с рассолом (3.5%)</option>
        `;
        document.getElementById('m-tare-lbl').textContent = 'Вода для рассола (мл)';
        document.getElementById('m-target-lbl').textContent = 'Срок (дней)';
        if (!ui.editingBatchId) {
          document.getElementById('m-tare').value = 0;
          document.getElementById('m-target').value = 21;
          document.getElementById('m-temp').value = 22;
          document.getElementById('m-loc').value = 'Тёплый шкаф · 22°C';
        }
      } else {
        meatRow.style.display = 'grid';
        stgSel.innerHTML = `
          <option value="cure_vac">Посол в вакууме (3°C)</option>
          <option value="dry_casing">Вяление в оболочке (12°C)</option>
          <option value="dry_naked">Подвес без оболочки (13°C)</option>
          <option value="dry_membrane">Мембранный пакет (4°C)</option>
          <option value="rehydrate_vac">Регидратация в вакууме (4°C)</option>
          <option value="smoke">Копчение (20°C)</option>
        `;
        document.getElementById('m-tare-lbl').textContent = 'Тара: шпагат/оболочка (г)';
        document.getElementById('m-target-lbl').textContent = 'Цель усушки (%)';
        if (!ui.editingBatchId) {
          document.getElementById('m-tare').value = 14;
          document.getElementById('m-target').value = 35;
          document.getElementById('m-temp').value = 3;
          document.getElementById('m-loc').value = 'Холодильник · 3°C';
        }
      }
      refreshModalCalc();
    }

    function onModalStageChange() {
      const sId = document.getElementById('m-stage').value;
      const stg = STAGES[sId];
      if (stg && !ui.editingBatchId) {
        document.getElementById('m-temp').value = stg.temp;
        document.getElementById('m-loc').value = stg.loc;
      }
      refreshModalCalc();
    }

    function refreshModalCalc() {
      const cat = document.getElementById('m-cat').value;
      const w = parseInt(document.getElementById('m-weight').value, 10) || 1000;
      const tVal = parseInt(document.getElementById('m-target').value, 10) || 35;
      const box = document.getElementById('m-calc-box');
      if (cat === 'meat') {
        const sN = (w * 0.0135).toFixed(1);
        const sR = (w * 0.0135).toFixed(1);
        const dex = (w * 0.004).toFixed(1);
        const finW = Math.round(w * (1 - tVal / 100));
        box.innerHTML = `🧂 Равновесный посол 2.7%: <b>${sN} г</b> нитритной + <b>${sR} г</b> морской соли + <b>${dex} г</b> сахара.<br/>🎯 Готовый вес при -${tVal}%: <b>${finW} г</b> (испарить ${w - finW} г).`;
      } else {
        const stg = document.getElementById('m-stage').value;
        const water = parseInt(document.getElementById('m-tare').value, 10) || 0;
        const pct = stg === 'ferm_vac' ? 2.8 : 3.5;
        const mass = stg === 'ferm_vac' ? w : (w + water);
        const salt = (mass * pct / 100).toFixed(1);
        box.innerHTML = `🌶 Соль (${pct}% от ${mass} г): <b>${salt} г</b> неиодированной соли. Выдержка: <b>${tVal} дн</b>.`;
      }
    }

    function saveBatchModal() {
      const cat = document.getElementById('m-cat').value;
      const title = document.getElementById('m-title').value.trim() || (cat === 'meat' ? 'Новый кусок' : 'Острые перцы');
      const w = Math.max(50, parseInt(document.getElementById('m-weight').value, 10) || 1000);
      const tareOrWater = Math.max(0, parseInt(document.getElementById('m-tare').value, 10) || 0);
      const stgId = document.getElementById('m-stage').value;
      const targetVal = Math.max(1, parseInt(document.getElementById('m-target').value, 10) || 35);
      const tempC = parseInt(document.getElementById('m-temp').value, 10);
      const loc = document.getElementById('m-loc').value.trim() || (STAGES[stgId] ? STAGES[stgId].loc : 'Камера');
      const notes = document.getElementById('m-notes').value.trim();
      const diam = Math.max(25, parseInt(document.getElementById('m-diam').value, 10) || 85);
      const meatType = document.getElementById('m-meat-type').value;

      if (ui.editingBatchId) {
        const b = store.batches.find(x => x.id === ui.editingBatchId);
        if (b) {
          b.category = cat;
          b.title = title;
          b.initialWeight = w;
          b.tempC = isNaN(tempC) ? 4 : tempC;
          b.location = loc;
          b.notes = notes;
          if (cat === 'meat') {
            b.meatType = meatType;
            b.diameterMm = diam;
            b.tareWeight = tareOrWater;
            b.targetLossPct = targetVal;
          } else {
            b.brineWater = tareOrWater;
            b.targetDays = targetVal;
            b.saltPct = stgId === 'ferm_vac' ? 2.8 : 3.5;
          }
          if (b.currentStage !== stgId) {
            changeStage(b.id, stgId);
          }
        }
        persistStore();
        closeBatchModal();
        ui.draftWeightInput = null;
        haptic('success');
        showToast('Партия обновлена');
        render();
        return;
      }

      const id = 'b-' + Date.now();
      const today = daysAgoISO(0);
      const newBatch = {
        id,
        category: cat,
        title,
        meatType: cat === 'meat' ? meatType : null,
        diameterMm: cat === 'meat' ? diam : null,
        initialWeight: w,
        hangWeight: w,
        tareWeight: cat === 'meat' ? tareOrWater : 15,
        brineWater: cat === 'pepper' ? tareOrWater : 0,
        targetLossPct: cat === 'meat' ? targetVal : 0,
        currentStage: stgId,
        tempC: isNaN(tempC) ? (STAGES[stgId] ? STAGES[stgId].temp : 4) : tempC,
        location: loc,
        saltPct: cat === 'meat' ? 2.7 : (stgId === 'ferm_vac' ? 2.8 : 3.5),
        puffed: false,
        degasCount: 0,
        phValue: 4.1,
        targetDays: cat === 'pepper' ? targetVal : 0,
        createdAt: today,
        notes,
        stageHistory: [{ stage: stgId, startDate: today, endDate: null, tempC: isNaN(tempC) ? 4 : tempC }],
        weightLogs: [{ date: today, netWeight: w, stage: stgId, note: 'Старт партии' }]
      };

      store.batches.unshift(newBatch);
      ui.selectedId = id;
      ui.draftWeightInput = null;
      ui.zoneFilter = 'all';
      persistStore();
      closeBatchModal();
      haptic('success');
      showToast(`Закладка «${title}» создана!`);
      navigate('detail', id);
    }

    function deleteEditingBatch() {
      if (!ui.editingBatchId) return;
      if (!confirm('Удалить эту партию навсегда?')) return;
      store.batches = store.batches.filter(x => x.id !== ui.editingBatchId);
      ui.selectedId = store.batches.length ? store.batches[0].id : null;
      persistStore();
      closeBatchModal();
      haptic('medium');
      showToast('Партия удалена');
      navigate('home');
    }

    // Boot
    loadStore();
    ui.selectedId = store.batches.length ? store.batches[0].id : null;
    render();
  </script>
</body>
</html>
