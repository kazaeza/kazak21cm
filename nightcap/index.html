<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070c" />
  <title>nightcap. — Космическая туманность коктейлей</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="cosmos-app">
    <!-- ==================== VAUL SCALABLE APP STAGE ==================== -->
    <div id="app-stage" class="app-stage">
      <!-- ==================== TAB 1: COSMOS NEBULA ==================== -->
      <section id="screen-nebula" class="tab-screen nebula-screen is-active" data-tab="nebula">
        <canvas id="nebula-canvas" aria-hidden="true"></canvas>
        <div id="tag-layer" aria-label="Вращающаяся туманность тегов"></div>

        <!-- Floating Top Chrome: Editorial Header + Horizontal Lens Rail -->
        <div id="nebula-top-chrome" class="nebula-top-chrome">
          <header class="app-header">
            <div class="brand-mark">
              <span class="brand-text">nightcap<span class="brand-dot">.</span></span>
              <svg class="brand-spark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <defs>
                  <linearGradient id="logoSpark" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f4dfb9" />
                    <stop offset="55%" stop-color="#e8c78e" />
                    <stop offset="100%" stop-color="#c59d5f" />
                  </linearGradient>
                </defs>
                <path d="M12 1L14.4 9.6L23 12L14.4 14.4L12 23L9.6 14.4L1 12L9.6 9.6L12 1Z" fill="url(#logoSpark)" />
              </svg>
            </div>

            <div class="header-actions">
              <button id="spin-surprise-btn" type="button" class="glass-pill surprise-btn" data-tactile>
                <span data-icon="sparkles" data-icon-class="icon-xs text-gold"></span>
                <span>Удиви меня</span>
              </button>

              <button id="pause-btn" type="button" class="glass-pill circle-pill-btn" data-tactile title="Пауза / вращение" aria-label="Пауза вращения">
                <span id="pause-icon" data-icon="pause" data-icon-class="icon-sm"></span>
              </button>
            </div>
          </header>

          <div id="lens-strip" class="lens-strip" role="tablist" aria-label="Фильтр настроения"></div>
        </div>
      </section>

      <!-- ==================== TAB 2: SHELF (ПОЛКА) ==================== -->
      <section id="screen-shelf" class="tab-screen content-screen hidden" data-tab="shelf"></section>

      <!-- ==================== TAB 3: MENU (КАРТА) ==================== -->
      <section id="screen-menu" class="tab-screen content-screen hidden" data-tab="menu"></section>

      <!-- ==================== TAB 4: SAVED (ТАЙНИК) ==================== -->
      <section id="screen-saved" class="tab-screen content-screen hidden" data-tab="saved"></section>

      <!-- ==================== FLOATING BOTTOM STACK ==================== -->
      <div id="bottom-stack" class="bottom-stack">
        <div id="orbit-hint" class="orbit-hint">
          Крути туманность · тапни на свой вайб
        </div>

        <!-- Bottom Console: Search when idle -> Single-tag confirm "Заебенить" when selected -->
        <div id="cosmos-console" class="cosmos-console glass-chrome">
          <!-- Custom compact live suggestions (never uses native Android datalist popup!) -->
          <div id="word-suggestions" class="word-suggestions hidden" role="listbox" aria-label="Подсказки"></div>

          <!-- State A: Nothing selected -> quick custom word search -->
          <div id="console-idle" class="console-idle-row">
            <form id="word-form" class="word-form" novalidate>
              <span data-icon="search" data-icon-class="icon-xs text-muted"></span>
              <input id="word-input" type="search" enterkeyhint="search" maxlength="45" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Или введи слово: джин, маракуйя, 0%…" />
              <button type="submit" class="word-submit-btn" data-tactile aria-label="Найти вайб">+</button>
            </form>
            <button id="idle-shelf-chip" type="button" class="mini-shelf-chip hidden" data-tactile></button>
          </div>

          <!-- State B: One vibe selected -> crisp confirmation + big "Заебенить" CTA -->
          <div id="console-confirm" class="console-confirm hidden">
            <div class="selected-vibe-bar">
              <div class="selected-vibe-info">
                <span id="selected-vibe-dot" class="selected-vibe-dot"></span>
                <div class="selected-vibe-texts">
                  <div id="selected-vibe-title" class="selected-vibe-title"></div>
                  <div id="selected-vibe-sub" class="selected-vibe-sub"></div>
                </div>
              </div>
              <div class="caught-controls">
                <button id="confirm-shelf-chip" type="button" class="mini-shelf-chip hidden" data-tactile></button>
                <button id="clear-btn" type="button" class="clear-x-btn" data-tactile aria-label="Снять выбор">
                  <span data-icon="x" data-icon-class="icon-xs"></span>
                </button>
              </div>
            </div>

            <button id="mix-btn" type="button" class="confirm-cta-btn" data-tactile>
              <span class="confirm-cta-shimmer" aria-hidden="true"></span>
              <span data-icon="zap" data-icon-class="icon-sm confirm-cta-zap"></span>
              <span class="confirm-cta-label">Заебенить</span>
              <span id="mix-count" class="confirm-cta-count">12</span>
            </button>
          </div>
        </div>

        <!-- Floating Cosmic Navigation Dock with Morphing Glider -->
        <nav id="cosmic-dock" aria-label="Навигация" class="cosmic-dock-wrap">
          <div class="cosmic-dock glass-chrome">
            <span id="dock-pill-indicator" class="dock-pill-indicator" aria-hidden="true"></span>

            <button type="button" data-nav="nebula" class="nav-item active" data-tactile>
              <span data-icon="orbit" data-icon-class="icon-nav"></span>
              <span>Космос</span>
            </button>

            <button type="button" data-nav="shelf" class="nav-item" data-tactile>
              <span class="nav-icon-wrap">
                <span data-icon="wine" data-icon-class="icon-nav"></span>
                <span id="nav-badge-shelf" class="nav-badge hidden"></span>
              </span>
              <span>Полка</span>
            </button>

            <div class="orb-slot">
              <button id="center-orb-btn" type="button" class="orb-cta" data-tactile title="Подобрать коктейли">
                <span data-icon="martini" data-icon-class="icon-orb"></span>
                <span id="orb-count-label" class="orb-label">Микс</span>
              </button>
            </div>

            <button type="button" data-nav="menu" class="nav-item" data-tactile>
              <span data-icon="book-open" data-icon-class="icon-nav"></span>
              <span>Карта</span>
            </button>

            <button type="button" data-nav="saved" class="nav-item" data-tactile>
              <span class="nav-icon-wrap">
                <span data-icon="heart" data-icon-class="icon-nav"></span>
                <span id="nav-badge-saved" class="nav-badge hidden"></span>
              </span>
              <span>Тайник</span>
            </button>
          </div>
        </nav>
      </div>
    </div>

    <!-- ==================== OVERLAYS & WARP FX (OUTSIDE SCALED STAGE) ==================== -->
    <div id="results-sheet" class="sheet-overlay hidden" role="dialog" aria-modal="true" aria-label="Подборка коктейлей"></div>
    <canvas id="fx-canvas" class="fx-canvas" aria-hidden="true"></canvas>
    <div id="recipe-modal" class="recipe-overlay hidden" role="dialog" aria-modal="true" aria-label="Рецепт коктейля"></div>

    <!-- Floating Sonner-style Toast -->
    <div id="toast" class="toast" aria-live="polite">
      <div class="toast-pill glass-chrome">
        <span data-icon="sparkles" data-icon-class="icon-xs text-gold"></span>
        <span id="toast-text"></span>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
